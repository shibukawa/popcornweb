package templates

export component Error500(title: string): html {
  <main class="mx-auto w-full max-w-3xl px-6 py-16">
    <h1 class="text-3xl font-semibold tracking-tight text-slate-900 dark:text-slate-50">{title}</h1>
    <p class="mt-4 text-slate-600 dark:text-slate-400">
      Something this page depended on failed, and the template that needed it
    declared no recover clause. The details are in the server log.
    </p>
    <p class="mt-6"><a
        class="font-medium text-emerald-700 underline underline-offset-4 hover:no-underline dark:text-emerald-400"
        href="/">Back to the index</a></p>
  </main>
}

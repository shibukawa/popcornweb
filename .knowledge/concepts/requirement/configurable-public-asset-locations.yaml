constraints:
- All configured locations stay within the project root and must not traverse symbolic links.
- The authored tree remains input only; the derived tree is the served and embedded tree.
- Projects omitting the new keys retain the existing paths and behavior.
non_goals:
- Move popcornweb.toml below go.mod or change project-root discovery.
- Rebase generated import paths, runtime configuration files, or dotenv discovery.
open_questions:
  runtime-path-handoff:
    text: Use server.public.local_root plus child environment injection, or an equivalent explicit handoff?
    state: answered
    resolution: Use server.public.local_root (default dist/public); pw dev overrides SERVER_PUBLIC_LOCAL_ROOT for
      each child and reloads project configuration on edits.
  auxiliary-output-layout:
    text: For independently configured embed and derived paths, where do the JSON manifest, staging tree, conversion
      cache, and extracted component assets live?
    state: answered
    resolution: The Go manifest shares the embed directory/package. JSON manifest, route table, staging, and cache
      share the derived tree’s parent. Extracted component files use assets.public/generated. Defaults retain their
      previous locations.

id: requirement:configurable-public-asset-locations
type: requirement
title: Configurable Public Asset Locations
summary: Keep the module-root tooling configuration while locating one application’s authored assets, derived assets,
  and embed file below that root.
authority: authored
lifecycle: accepted
review_state: confirmed
facts:
  origin:
    request: concept:bdf-printmanager-integration
    source: source:bdf-printmanager-request
    section: 'Ask 1: configurable asset locations'
  requester_priority: primary; Ask 1 is the integration blocker
  implementation_status: Implemented and verified in this repository; no BDF deployment is claimed.
  configuration:
    file: popcornweb.toml
    base: Directory containing popcornweb.toml, unchanged from the current project root.
    assets.public:
      default: public
      example: cmd/printmanager/public
      meaning: authored input tree
    assets.derived:
      default: dist/public
      example: cmd/printmanager/dist/public
      meaning: derived served and embedded tree
    assets.embed:
      default: public.go
      example: cmd/printmanager/public.go
      meaning: authored embed scaffold checked by verifyPublicEmbed
  embed:
    directive_base: Directory of the configured embed file, not the module root.
    example: //go:embed all:dist/public in cmd/printmanager/public.go
    package: Read the package of the configured embed file; package main in cmd/printmanager is valid.
  generated_locations:
    served_tree: assets.derived
    go_manifest: public_manifest_pw_gen.go beside assets.embed, in the same Go package.
    json_manifest: The request groups the manifest with application-local outputs; exact JSON-manifest placement
      for independent derived/embed overrides remains an open design question.
    tailwind: Existing assets.tailwind.input and output remain relative to the project root.
  runtime_handoff:
    required: pw dev must tell the child process where the configured derived tree is, independent of a working-directory
      dist/public assumption.
    suggested: server.public.local_root with default dist/public, injected as SERVER_PUBLIC_LOCAL_ROOT by pw dev.
    also_acceptable: An equivalent explicit directory/path handoff preserving the existing root semantics.
  affected_surfaces:
  - pw generate
  - pw dev
  - pw build and target packaging
  - runtime public asset mount
  suggested_next_slice: A module with root package fixture and an application in cmd/app generates and serves app.css
    using all three configured paths.
  implementation_report: docs/requests/bdf-printmanager-implementation.md
  verification_notes: Default-path equivalence is verified with the updated dependencies. Dependency-driven generated-code
    changes are intentionally regenerated rather than claimed byte-identical to the old dependency versions.

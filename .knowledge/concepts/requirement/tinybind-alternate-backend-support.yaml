id: requirement:tinybind-alternate-backend-support
type: requirement
title: tinybind-go Support For A Second HTTP Backend
summary: What was asked of system:tinybind for requirement:alternate-http-backend-readiness,
  and what v0.4.9 and v0.4.10 delivered against it.
facts:
  legacy_body: "What was asked of system:tinybind for requirement:alternate-http-backend-readiness,\
    \ and what v0.4.9 and v0.4.10 delivered against it.\n\n```yaml\nowner: system:tinybind\n\
    status: largely delivered; this is now a status record rather than an ask\nsurveyed:\
    \ 2026-08-09 against v0.4.10, having first been written against v0.4.3\ndelivered:\n\
    \  runtime: a fasthttp sibling package declaring the same names over the request\
    \ value, with a shared transport-free leaf both surfaces alias\n  shared_error_types:\
    \ the problem, field-error, and HTTP-error types live in that leaf and are aliased\
    \ rather than redeclared, so an error crossing between the surfaces still matches\n\
    \  transform: eligibility, rewriting, refusal diagnostics with the chain from\
    \ the handler, and a report-only run\n  call_registry: transport slots on call\
    \ patterns, plus a transport-only pattern for a call naming no model, which the\
    \ module needed for its own error writer\n  import_rewrites: a map from an authored\
    \ import path to the one the generated file imports under the original local name\n\
    \  router: a vendored fasthttprouter beside the fasthttp fork, with a configurable\
    \ target naming import, qualifier, type, registration function, and catch-all\
    \ spelling\n  build_tags: generation emits them, so the net/http artifacts and\
    \ the rewritten ones never compile together\n  stream: the callback entry point,\
    \ on both transports\n  docs: an application-author guide and a framework-owner\
    \ guide, the latter written for exactly this framework's position\nalready_neutral_and_unchanged:\n\
    \  packages:\n    - htmlbind and its delta subpackage, whose render entry points\
    \ all take io.Writer\n    - jsonbind, an append-to-bytes API\n    - sqlbind, configbind,\
    \ dynamobind, firestorebind, minitoml, cliparser\n  significance: the heaviest\
    \ dependency this framework has on the module needed no port, which is why the\
    \ delivered scope is smaller than the dependency list suggested\nresolved_differently_than_asked:\n\
    \  handler_arity:\n    asked: this requirement called it the thing to settle first,\
    \ since every emitter and analyzer assumed a writer and a request as two values\n\
    \    answer: the transform rewrites both identifiers to the same context, so arity\
    \ collapses as a consequence of substitution rather than as a modelled change;\
    \ only the printed signature moves, which routetree already parameterized\n  no_adapter:\n\
    \    asked_here: a compatibility fallback, per the proposal decision:transport-compatibility-fallback\
    \ records\n    delivered: a refusal contract instead, which then forced the transform\
    \ to close over the same-package call graph\nwhat_is_left:\n  here_not_upstream:\
    \ requirement:pw-call-registration and the pw fasthttp package, which the module\
    \ cannot supply and explicitly hands to a framework owner\n  tinygo: whether the\
    \ fork and the vendored router build under the target this framework pins, which\
    \ decision:tinygo-042-baseline makes a real question\n  matching_semantics: a\
    \ route table meaning the same thing on both routers, which no transform can rewrite\
    \ and which rule:route-and-template-checks is the place for\nasked_and_answered_2026_08_11:\n\
    \  shipped_in: v0.5.5, which closed both halves — the transform skips generated\
    \ files, and GenerateArtifacts returns the derived binders and route registration\
    \ beside the derived handlers\n  what_that_removed_here: the whole local workaround;\
    \ this framework no longer runs AnalyzeTransform and RewriteTransform itself,\
    \ no longer filters the plan, and no longer has a report for what it could not\
    \ generate\n  as_taken: Options.Transform is set on the generation options and\
    \ the artifacts arrive with the rest; Options.GeneratedHeaders is carried into\
    \ the transform by the generator, so the header this framework brands its output\
    \ with is the one the derivation skips\n  declined: ArtifactTransportRoutes, because\
    \ a page tree here installs on pwfastpage.Router and brings its own registry;\
    \ taking it would mean two registries and a dependency on a router no application\
    \ built on this framework imports\n  proved_by: internal/fastfixture, one authored\
    \ package compiled under both tag configurations, with the generated halves committed\n\
    \  one_thing_not_carried_over: GenerateArtifacts drops the layout warnings transportArtifacts\
    \ returns, so an authored file mixing a handler with declarations both builds\
    \ need is no longer named at generation time; it is a compile error in the second\
    \ build rather than a silent one, and rule:transport-handle-checks PW0603 puts\
    \ it with api:cli-doctor anyway\n  found_by: wiring the transform into api:cli-generate,\
    \ which is the first consumer to run the derivation over a package that already\
    \ holds the last run's generated code\n  the_defect: the derivation was not idempotent\
    \ over its own output, so a second generation of a package refused on a file the\
    \ first one wrote\n  measured:\n    run_one: a package with a body-reading request\
    \ type and no generated binder emits its fasthttp binders and its derived handlers,\
    \ both correct\n    run_two: the same package with the first run's binder beside\
    \ it refuses — \"bindAsk is not transformable, captures r in a function literal\"\
    \ — and the run stops there\n    why: GeneratePackage derives the handlers before\
    \ emitting the binders, and AnalyzeTransform reads every file of the loaded package;\
    \ a generated binder captures the request in a closure to read the body lazily,\
    \ which the eligibility rule correctly calls an escape\n    not_specific_to_this_framework:\
    \ a run with Out unset writes its binders into the package it just analyzed, so\
    \ the next run analyzes them\n  the_ask: the derivation should skip generated\
    \ files, which is the rule discovery already follows through GeneratedHeaders;\
    \ an artifact-level entry for the fasthttp binders would also help, since GenerateArtifacts\
    \ returns the derived handlers and no binders\n  routes_around_it_that_were_tried_and_rejected:\n\
    \    attempt_with_fallback: run the file-writing entry per package and take the\
    \ binder file when it succeeds — rejected because it succeeds only on a package\
    \ with no generated binder yet, so the file appears on the first generation and\
    \ is swept on the second\n    load_with_the_fasthttp_tag: would exclude the refusing\
    \ generated binder and the authored handlers with it, leaving no usage sites for\
    \ the plan; there is no way to set build flags on the load either\n    staging_a_synthetic_package:\
    \ deterministic, and it means generating from a package that is not the one that\
    \ compiles, to work around one rule this framework already implements locally\n\
    \  filtered_here_meanwhile: this framework runs AnalyzeTransform and RewriteTransform\
    \ itself and drops every candidate from a generated file, so its own derivation\
    \ is idempotent; only the binder phase, which it cannot reach, is not\n  cost_until_it_lands:\
    \ a derived handler calling pw.Parse compiles and answers 500 on the first request,\
    \ because the fasthttp binder registry is populated from generated init functions;\
    \ pw generate names the packages at the end of a run rather than leaving it to\
    \ be found\n```"
  owner: system:tinybind
  status: largely delivered; this is now a status record rather than an ask
  surveyed: 2026-08-09 against v0.4.10, having first been written against v0.4.3
  delivered:
    runtime: a fasthttp sibling package declaring the same names over the request
      value, with a shared transport-free leaf both surfaces alias
    shared_error_types: the problem, field-error, and HTTP-error types live in that
      leaf and are aliased rather than redeclared, so an error crossing between the
      surfaces still matches
    transform: eligibility, rewriting, refusal diagnostics with the chain from the
      handler, and a report-only run
    call_registry: transport slots on call patterns, plus a transport-only pattern
      for a call naming no model, which the module needed for its own error writer
    import_rewrites: a map from an authored import path to the one the generated file
      imports under the original local name
    router: a vendored fasthttprouter beside the fasthttp fork, with a configurable
      target naming import, qualifier, type, registration function, and catch-all
      spelling
    build_tags: generation emits them, so the net/http artifacts and the rewritten
      ones never compile together
    stream: the callback entry point, on both transports
    docs: an application-author guide and a framework-owner guide, the latter written
      for exactly this framework's position
  already_neutral_and_unchanged:
    packages:
    - htmlbind and its delta subpackage, whose render entry points all take io.Writer
    - jsonbind, an append-to-bytes API
    - sqlbind, configbind, dynamobind, firestorebind, minitoml, cliparser
    significance: the heaviest dependency this framework has on the module needed
      no port, which is why the delivered scope is smaller than the dependency list
      suggested
  resolved_differently_than_asked:
    handler_arity:
      asked: this requirement called it the thing to settle first, since every emitter
        and analyzer assumed a writer and a request as two values
      answer: the transform rewrites both identifiers to the same context, so arity
        collapses as a consequence of substitution rather than as a modelled change;
        only the printed signature moves, which routetree already parameterized
    no_adapter:
      asked_here: a compatibility fallback, per the proposal decision:transport-compatibility-fallback
        records
      delivered: a refusal contract instead, which then forced the transform to close
        over the same-package call graph
  what_is_left:
    here_not_upstream: requirement:pw-call-registration and the pw fasthttp package,
      which the module cannot supply and explicitly hands to a framework owner
    tinygo: whether the fork and the vendored router build under the target this framework
      pins, which decision:tinygo-042-baseline makes a real question
    matching_semantics: a route table meaning the same thing on both routers, which
      no transform can rewrite and which rule:route-and-template-checks is the place
      for
  asked_and_answered_2026_08_11:
    shipped_in: v0.5.5, which closed both halves — the transform skips generated files,
      and GenerateArtifacts returns the derived binders and route registration beside
      the derived handlers
    what_that_removed_here: the whole local workaround; this framework no longer runs
      AnalyzeTransform and RewriteTransform itself, no longer filters the plan, and
      no longer has a report for what it could not generate
    as_taken: Options.Transform is set on the generation options and the artifacts
      arrive with the rest; Options.GeneratedHeaders is carried into the transform
      by the generator, so the header this framework brands its output with is the
      one the derivation skips
    declined: ArtifactTransportRoutes, because a page tree here installs on pwfastpage.Router
      and brings its own registry; taking it would mean two registries and a dependency
      on a router no application built on this framework imports
    proved_by: internal/fastfixture, one authored package compiled under both tag
      configurations, with the generated halves committed
    one_thing_not_carried_over: GenerateArtifacts drops the layout warnings transportArtifacts
      returns, so an authored file mixing a handler with declarations both builds
      need is no longer named at generation time; it is a compile error in the second
      build rather than a silent one, and rule:transport-handle-checks PW0603 puts
      it with api:cli-doctor anyway
    found_by: wiring the transform into api:cli-generate, which is the first consumer
      to run the derivation over a package that already holds the last run's generated
      code
    the_defect: the derivation was not idempotent over its own output, so a second
      generation of a package refused on a file the first one wrote
    measured:
      run_one: a package with a body-reading request type and no generated binder
        emits its fasthttp binders and its derived handlers, both correct
      run_two: the same package with the first run's binder beside it refuses — "bindAsk
        is not transformable, captures r in a function literal" — and the run stops
        there
      why: GeneratePackage derives the handlers before emitting the binders, and AnalyzeTransform
        reads every file of the loaded package; a generated binder captures the request
        in a closure to read the body lazily, which the eligibility rule correctly
        calls an escape
      not_specific_to_this_framework: a run with Out unset writes its binders into
        the package it just analyzed, so the next run analyzes them
    the_ask: the derivation should skip generated files, which is the rule discovery
      already follows through GeneratedHeaders; an artifact-level entry for the fasthttp
      binders would also help, since GenerateArtifacts returns the derived handlers
      and no binders
    routes_around_it_that_were_tried_and_rejected:
      attempt_with_fallback: run the file-writing entry per package and take the binder
        file when it succeeds — rejected because it succeeds only on a package with
        no generated binder yet, so the file appears on the first generation and is
        swept on the second
      load_with_the_fasthttp_tag: would exclude the refusing generated binder and
        the authored handlers with it, leaving no usage sites for the plan; there
        is no way to set build flags on the load either
      staging_a_synthetic_package: deterministic, and it means generating from a package
        that is not the one that compiles, to work around one rule this framework
        already implements locally
    filtered_here_meanwhile: this framework runs AnalyzeTransform and RewriteTransform
      itself and drops every candidate from a generated file, so its own derivation
      is idempotent; only the binder phase, which it cannot reach, is not
    cost_until_it_lands: a derived handler calling pw.Parse compiles and answers 500
      on the first request, because the fasthttp binder registry is populated from
      generated init functions; pw generate names the packages at the end of a run
      rather than leaving it to be found

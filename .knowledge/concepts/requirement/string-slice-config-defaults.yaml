id: requirement:string-slice-config-defaults
type: requirement
title: String Slice Configuration Defaults
summary: Configuration defaults for string slices must produce the intended elements, including a working CSRF include
  default and an empty-list spelling.
authority: authored
lifecycle: accepted
review_state: confirmed
facts:
  origin:
    request: concept:bdf-printmanager-integration
    source: source:bdf-printmanager-request
    section: Smaller notes from the same integration
  requester_priority: nonblocking integration note; includes a reported CSRF startup bug
  implementation_status: Implemented and verified in this repository; no BDF deployment is claimed.
  reported_versions:
    popcornweb: v0.5.11
    tinybind-go: v0.5.33
  reported_behavior:
    empty_default: default:"[]" reaches Overlay.GetMulti as a scalar and becomes the one-element list containing
      "[]".
    csrf_default: CSRFConfig.Include default:"[\"/**\"]" becomes one literal JSON-looking string rather than the
      path pattern /**.
    startup: SECURITY_CSRF_ENABLED=true without an explicit include fails with a pattern-must-start-with-slash error.
    security: The failure is closed; the request does not ask to weaken CSRF validation.
  allowed_remedies:
  - Teach GetMulti to parse bracketed defaults as lists.
  - Reject unsupported bracketed defaults during generation and use a supported scalar spelling such as /**.
  documentation: Define supported []string default syntax and empty-list behavior in ja/reference/configuration-declaration.md.
  implementation_report: docs/requests/bdf-printmanager-implementation.md

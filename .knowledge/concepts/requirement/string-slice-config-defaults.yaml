constraints:
- Preserve fail-closed validation of invalid CSRF patterns.
open_questions:
  default-parser-ownership:
    text: Fix bracket-list parsing upstream in tinybind-go or reject unsupported syntax and change framework defaults?
    state: answered
    resolution: Keep upstream GetMulti scalar CSV semantics. Correct framework CSRF/CORS defaults to CSV and reject
      array-looking []string defaults in pw generate, including registered nested/defined slice types. Empty defaults
      use no tag or an empty default.

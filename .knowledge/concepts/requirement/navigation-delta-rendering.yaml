id: requirement:navigation-delta-rendering
type: requirement
title: Navigation Delta Rendering
summary: One page URL answers a request carrying the render header with only the boundaries
  whose markup changed, so a search-parameter change or a same-tree navigation costs
  the changed region rather than a full document.
facts:
  legacy_body: "One page URL answers a request carrying the render header with only\
    \ the boundaries whose markup changed, so a search-parameter change or a same-tree\
    \ navigation costs the changed region rather than a full document.\n\n```yaml\n\
    source: decision:update-runtime-convergence\nmotivation: a page is a function\
    \ of its request, and changing one argument should not cost a full page load;\
    \ the layout that did not change is already in the browser\nwhat_is_automatic:\n\
    \  boundaries: every layout and page of a rendered chain, because a layout chain\
    \ is already the shape a partial update wants\n  not_a_boundary: an ordinary component\
    \ call, so a five-hundred-row list does not put five hundred entries in every\
    \ request\n  never_a_boundary: the document shell, since a delta reuses the existing\
    \ document\n  identity: written by generation onto each boundary root element,\
    \ under the data attribute prefix api:cli-generate sets to the Popcorn Web brand\
    \ rather than the system:tinybind default\n  one_spelling: from system:tinybind\
    \ v0.3.1 a render option names the async placeholder element and the boundary\
    \ identifiers from that same prefix, so a document no longer carries the framework's\
    \ attributes beside the module's element names\n  runtime_agreement: the prefix\
    \ reaches the browser as configuration, so requirement:unified-update-runtime\
    \ is not rebuilt for it\n  single_root: a boundary must render exactly one root\
    \ element; a component that cannot is simply not a boundary and still compiles\n\
    validators:\n  frame: a keyed digest of a boundary's own rendered bytes, excluding\
    \ nested boundaries, and the authority for omitting one\n  input: a keyed digest\
    \ of the declared parameters, a cache key and a diagnostic aid\n  why_two: equal\
    \ inputs do not prove equal output, because a component may read the clock, the\
    \ database, the locale, or the request\n  execution: a delta skips transmission,\
    \ never execution; only a component opting into output caching skips its own render\n\
    \  keying: api:html-update-options validator_key, since an unkeyed digest of low-entropy\
    \ content is guessable\nhandler_delta:\n  required: none for a page under concept:page-tree,\
    \ because api:page-render-runtime Render is the one call site and the negotiation\
    \ lives there\n  registered_router: a handler calling api:html-response WriteHTMLPage\
    \ gets the same treatment, since both reach one render entry\n  unchanged: registration,\
    \ request binding, authentication, middleware order, and the generated Fragment\
    \ and Params construction\nmode_ordering:\n  rule: the live token of api:live-delivery-protocol\
    \ is tested first, then the navigation mode, then the document\n  why: the shared\
    \ header of decision:update-runtime-convergence means an untested live request\
    \ would be answered as a complete document\n  bot: api:client-classification still\
    \ forces the synchronous document path of requirement:bot-synchronous-render,\
    \ ahead of every update mode\nresponse:\n  operations: the outermost changed boundaries\
    \ only, since a descendant of a replaced boundary is already inside the replacement\n\
    \  manifest: every boundary, including unchanged ones, so the browser can rebuild\
    \ its whole state from one response\n  head: the tags a first-appearing component\
    \ brings, installed before its markup is applied, so a region never flashes unstyled\n\
    \  status: the page's real status; a delta is never a way to hide one\n  headers:\
    \ Vary on the render header, Cache-Control no-store, and the served mode echoed\
    \ back so a proxy-substituted body is detectable\n  streaming: the streamed record\
    \ form, so a region applies as it is written rather than when the response ends,\
    \ matching decision:automatic-async-render-selection on the document path\n  content_coding:\
    \ negotiated like any other body, per policy:response-content-encoding; a record\
    \ stream is JSON carrying markup, which is the most compressible thing this framework\
    \ writes, and leaving it unencoded while the document it replaces was encoded\
    \ inverted the comparison this whole requirement rests on\n  no_runtime_head:\
    \ the head record carries a first-appearing component's tags and not the runtime's\
    \ own, because a delta answers a request the runtime issued and those tags are\
    \ already on the page; carrying them cost 624 bytes per navigation and, since\
    \ the token in them is freshly masked per render, appended another meta to the\
    \ document head on every click\ndocument_seeding:\n  what: a document carries\
    \ the validators of the boundaries it committed, in an inert element written after\
    \ the body\n  why: without it a page view starts blank, so the first navigation\
    \ after arriving carries no hints and is answered with every region of the page\
    \ — the click a reader is most likely to make, answered the most expensively this\
    \ wire can\n  already_computed: the collect pass that writes the document produces\
    \ the manifest and used to discard it, so this adds the bytes to carry it and\
    \ no work\n  what_it_is_worth: an entry costs about fifty bytes and buys skipping\
    \ whatever its boundary holds. A stable region that is pure markup is nearly free\
    \ to re-send already, because the sequence split sends its values rather than\
    \ its markup, so seeding loses by roughly the marker's own size; a stable region\
    \ carrying data — a folder list with counts, a header naming the signed-in user\
    \ — is not, and on a page measured with one it saved 769 bytes against a marker\
    \ costing about a hundred. The loss is bounded by the marker and the win is not\n\
    \  bounded: a manifest over api:html-update-options MaxManifestBytes is ignored\
    \ by the endpoint that reads it rather than truncated, so a document over the\
    \ bound seeds nothing rather than bytes nobody will use\n  validator_tag: the\
    \ document collect has to run under the same build-seeded validator tag the delta\
    \ does, or the two describe the same regions in a different alphabet and nothing\
    \ ever compares equal; it is the effective identity rather than the vcs stamp,\
    \ because an unstamped binary has none and the module stands its own per-process\
    \ value in\n  consumed: the runtime reads the element at construction and removes\
    \ it, because a manifest is valid only for the DOM it was produced against and\
    \ the first delta makes the page a different one\n  where: the buffered branch\
    \ only, which is the one updates force; a streamed document holds unsettled boundaries\
    \ whose validators do not exist yet\nfallback:\n  triggers: unknown mode, a protocol\
    \ version the server does not speak, a truncated or stripped header, a different\
    \ build, a network failure, or a body that is not a delta\n  behavior: the ordinary\
    \ complete document, or on the client an ordinary browser navigation; a user action\
    \ is never lost\n  rolling_deploy: a page rendered by the old build whose next\
    \ request reaches a new one falls back cleanly, which is what the build header\
    \ buys\nconsistency:\n  within_one_response: a single consistent render of the\
    \ boundaries it covers\n  across_responses: not consistent; after independent\
    \ updates regions may come from different points in time, which is documented\
    \ rather than fixed\n  fencing: a superseded response is discarded unapplied and\
    \ a stale base is rejected, so out-of-order responses cannot restore older state\n\
    \  repeatability: a re-render may be discarded after the server produced it, so\
    \ it must be free of side effects; mutations belong in requirement:action-response-update\n\
    limits:\n  - diffing is per boundary; a changed boundary is replaced whole, with\
    \ no attribute or text-node diff\n  - a boundary embedding a timestamp never matches\
    \ and is resent every time\n  - manifest size grows with boundary count, so boundaries\
    \ belong at meaningful regions\n  - update state lives in the browser, so nothing\
    \ needs session affinity and a restart loses nothing\n  - this is not a client-side\
    \ framework; no component state in the browser, no virtual DOM, no client routing\
    \ table\nacceptance:\n  - a request without the render header serves the page\
    \ it always did, plus the seeded manifest element when updates are on\n  - a delta\
    \ costs fewer bytes on the wire than the document it replaces, compared under\
    \ the coding both are negotiated for\n  - the validators a document seeds are\
    \ the ones a delta would have left the client holding\n  - a search-parameter\
    \ change transfers the page region and not the layout\n  - the same URL serves\
    \ a document to a crawler and a delta to the runtime with no cache cross-contamination\n\
    \  - a request carrying another build identity receives a complete document\n\
    \  - a live request on the shared header still opens a delivery stream\n  - a\
    \ project that never enables updates regenerates and serves identically\n```"
  source: decision:update-runtime-convergence
  motivation: a page is a function of its request, and changing one argument should
    not cost a full page load; the layout that did not change is already in the browser
  what_is_automatic:
    boundaries: every layout and page of a rendered chain, because a layout chain
      is already the shape a partial update wants
    not_a_boundary: an ordinary component call, so a five-hundred-row list does not
      put five hundred entries in every request
    never_a_boundary: the document shell, since a delta reuses the existing document
    identity: written by generation onto each boundary root element, under the data
      attribute prefix api:cli-generate sets to the Popcorn Web brand rather than
      the system:tinybind default
    one_spelling: from system:tinybind v0.3.1 a render option names the async placeholder
      element and the boundary identifiers from that same prefix, so a document no
      longer carries the framework's attributes beside the module's element names
    runtime_agreement: the prefix reaches the browser as configuration, so requirement:unified-update-runtime
      is not rebuilt for it
    single_root: a boundary must render exactly one root element; a component that
      cannot is simply not a boundary and still compiles
  validators:
    frame: a keyed digest of a boundary's own rendered bytes, excluding nested boundaries,
      and the authority for omitting one
    input: a keyed digest of the declared parameters, a cache key and a diagnostic
      aid
    why_two: equal inputs do not prove equal output, because a component may read
      the clock, the database, the locale, or the request
    execution: a delta skips transmission, never execution; only a component opting
      into output caching skips its own render
    keying: api:html-update-options validator_key, since an unkeyed digest of low-entropy
      content is guessable
  handler_delta:
    required: none for a page under concept:page-tree, because api:page-render-runtime
      Render is the one call site and the negotiation lives there
    registered_router: a handler calling api:html-response WriteHTMLPage gets the
      same treatment, since both reach one render entry
    unchanged: registration, request binding, authentication, middleware order, and
      the generated Fragment and Params construction
  mode_ordering:
    rule: the live token of api:live-delivery-protocol is tested first, then the navigation
      mode, then the document
    why: the shared header of decision:update-runtime-convergence means an untested
      live request would be answered as a complete document
    bot: api:client-classification still forces the synchronous document path of requirement:bot-synchronous-render,
      ahead of every update mode
  response:
    operations: the outermost changed boundaries only, since a descendant of a replaced
      boundary is already inside the replacement
    manifest: every boundary, including unchanged ones, so the browser can rebuild
      its whole state from one response
    head: the tags a first-appearing component brings, installed before its markup
      is applied, so a region never flashes unstyled
    status: the page's real status; a delta is never a way to hide one
    headers: Vary on the render header, Cache-Control no-store, and the served mode
      echoed back so a proxy-substituted body is detectable
    streaming: the streamed record form, so a region applies as it is written rather
      than when the response ends, matching decision:automatic-async-render-selection
      on the document path
    content_coding: negotiated like any other body, per policy:response-content-encoding;
      a record stream is JSON carrying markup, which is the most compressible thing
      this framework writes, and leaving it unencoded while the document it replaces
      was encoded inverted the comparison this whole requirement rests on
    no_runtime_head: the head record carries a first-appearing component's tags and
      not the runtime's own, because a delta answers a request the runtime issued
      and those tags are already on the page; carrying them cost 624 bytes per navigation
      and, since the token in them is freshly masked per render, appended another
      meta to the document head on every click
  document_seeding:
    what: a document carries the validators of the boundaries it committed, in an
      inert element written after the body
    why: without it a page view starts blank, so the first navigation after arriving
      carries no hints and is answered with every region of the page — the click a
      reader is most likely to make, answered the most expensively this wire can
    already_computed: the collect pass that writes the document produces the manifest
      and used to discard it, so this adds the bytes to carry it and no work
    what_it_is_worth: an entry costs about fifty bytes and buys skipping whatever
      its boundary holds. A stable region that is pure markup is nearly free to re-send
      already, because the sequence split sends its values rather than its markup,
      so seeding loses by roughly the marker's own size; a stable region carrying
      data — a folder list with counts, a header naming the signed-in user — is not,
      and on a page measured with one it saved 769 bytes against a marker costing
      about a hundred. The loss is bounded by the marker and the win is not
    bounded: a manifest over api:html-update-options MaxManifestBytes is ignored by
      the endpoint that reads it rather than truncated, so a document over the bound
      seeds nothing rather than bytes nobody will use
    validator_tag: the document collect has to run under the same build-seeded validator
      tag the delta does, or the two describe the same regions in a different alphabet
      and nothing ever compares equal; it is the effective identity rather than the
      vcs stamp, because an unstamped binary has none and the module stands its own
      per-process value in
    consumed: the runtime reads the element at construction and removes it, because
      a manifest is valid only for the DOM it was produced against and the first delta
      makes the page a different one
    where: the buffered branch only, which is the one updates force; a streamed document
      holds unsettled boundaries whose validators do not exist yet
  fallback:
    triggers: unknown mode, a protocol version the server does not speak, a truncated
      or stripped header, a different build, a network failure, or a body that is
      not a delta
    behavior: the ordinary complete document, or on the client an ordinary browser
      navigation; a user action is never lost
    rolling_deploy: a page rendered by the old build whose next request reaches a
      new one falls back cleanly, which is what the build header buys
  consistency:
    within_one_response: a single consistent render of the boundaries it covers
    across_responses: not consistent; after independent updates regions may come from
      different points in time, which is documented rather than fixed
    fencing: a superseded response is discarded unapplied and a stale base is rejected,
      so out-of-order responses cannot restore older state
    repeatability: a re-render may be discarded after the server produced it, so it
      must be free of side effects; mutations belong in requirement:action-response-update
  limits:
  - diffing is per boundary; a changed boundary is replaced whole, with no attribute
    or text-node diff
  - a boundary embedding a timestamp never matches and is resent every time
  - manifest size grows with boundary count, so boundaries belong at meaningful regions
  - update state lives in the browser, so nothing needs session affinity and a restart
    loses nothing
  - this is not a client-side framework; no component state in the browser, no virtual
    DOM, no client routing table
  acceptance:
  - a request without the render header serves the page it always did, plus the seeded
    manifest element when updates are on
  - a delta costs fewer bytes on the wire than the document it replaces, compared
    under the coding both are negotiated for
  - the validators a document seeds are the ones a delta would have left the client
    holding
  - a search-parameter change transfers the page region and not the layout
  - the same URL serves a document to a crawler and a delta to the runtime with no
    cache cross-contamination
  - a request carrying another build identity receives a complete document
  - a live request on the shared header still opens a delivery stream
  - a project that never enables updates regenerates and serves identically

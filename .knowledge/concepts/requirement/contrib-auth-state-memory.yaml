id: requirement:contrib-auth-state-memory
type: requirement
title: In-Memory Authentication State Adapter
summary: authstate/memory provides bounded process-local requirement:contrib-auth-state
  storage.
facts:
  legacy_body: "authstate/memory provides bounded process-local requirement:contrib-auth-state\
    \ storage.\n\n```yaml\npackage: authstate/memory\npublic_api:\n  - NewStore[T](Options)\n\
    required:\n  - injected clock supports deterministic expiry tests\n  - concurrent\
    \ Put and Take are race safe\n  - expired entries are reclaimed before capacity\
    \ checks\n  - nil context and nil or zero Store return stable errors without panic\n\
    \  - duplicate keys fail without replacing stored values\nlimits:\n  default_entries:\
    \ 4096\n  hard_entries: 65536\n  default_key_bytes: 256\n  hard_key_bytes: 4096\n\
    constraints:\n  - process-local; intended for development, tests, and single-process\
    \ deployments\n  - values are stored by assignment and treated as immutable\n\
    ```"
  package: authstate/memory
  public_api:
  - NewStore[T](Options)
  required:
  - injected clock supports deterministic expiry tests
  - concurrent Put and Take are race safe
  - expired entries are reclaimed before capacity checks
  - nil context and nil or zero Store return stable errors without panic
  - duplicate keys fail without replacing stored values
  limits:
    default_entries: 4096
    hard_entries: 65536
    default_key_bytes: 256
    hard_key_bytes: 4096
  constraints:
  - process-local; intended for development, tests, and single-process deployments
  - values are stored by assignment and treated as immutable
relations:
- relation: mentions
  to: requirement:contrib-auth-state
  resolution: resolved

id: requirement:contrib-oauth
type: requirement
title: TinyGo OAuth Client
summary: contrib/oauth implements bounded OAuth 2.0 Authorization Code with PKCE and
  Device Authorization clients using requirement:contrib-auth-common and requirement:contrib-auth-state.
facts:
  legacy_body: "contrib/oauth implements bounded OAuth 2.0 Authorization Code with\
    \ PKCE and Device Authorization clients using requirement:contrib-auth-common\
    \ and requirement:contrib-auth-state.\n\n```yaml\npackage: contrib/oauth\nscope:\
    \ authorization code and RFC 8628 device authorization clients\npublic_api:\n\
    \  - NewClient(config, options)\n  - Config.EndpointValidator applies caller-specific\
    \ trust policy to configured endpoints\n  - Client.BeginAuthorization(context,\
    \ options) returns URL and transaction key\n  - Client.HandleCallback(context,\
    \ transaction key, callback values) returns TokenSet\n  - Options.TransactionValidator\
    \ runs after callback state correlation and before token exchange\n  - TransactionCodec\
    \ implements api:auth-state-codec\n  - NewDeviceClient(config, options) returns\
    \ a client that needs no redirect URI or state store\n  - DeviceClient.Begin(context,\
    \ options) returns data:device-authorization\n  - DeviceClient.Poll(context, authorization)\
    \ waits until TokenSet or a terminal typed error\nrequired:\n  - generate state\
    \ and PKCE verifier from crypto/rand\n  - S256 PKCE only\n  - store expiring correlation\
    \ data and atomically consume it before code exchange\n  - exact redirect URI\
    \ supplied by application\n  - protocol-managed authorization parameters cannot\
    \ be overridden by extension parameters\n  - scope values follow the RFC scope-token\
    \ grammar and cannot contain whitespace or control bytes\n  - endpoint validator\
    \ mutations cannot rewrite the configured request endpoints\n  - client_secret_basic\
    \ and client_secret_post token authentication\n  - public-client authentication\
    \ with client_id and no client secret only on the typed device client\n  - device\
    \ authorization request, response, polling, and errors follow flow:oidc-device-authorization\n\
    \  - polling timing, cancellation, backoff, and terminal behavior follow policy:device-authorization-security\n\
    \  - bounded token endpoint request and response\n  - bounded standard token string\
    \ fields\n  - typed token response with bounded raw extension values\n  - policy:oauth-security\n\
    deferred:\n  - authorization server implementation\n  - implicit and resource-owner\
    \ password grants\n  - OAuth token exchange grant\n  - private_key_jwt and DPoP\n\
    \  - automatic refresh scheduling\nstandards:\n  oauth: https://www.rfc-editor.org/rfc/rfc6749\n\
    \  pkce: https://www.rfc-editor.org/rfc/rfc7636\n  security: https://www.rfc-editor.org/rfc/rfc9700\n\
    \  device_grant: https://www.rfc-editor.org/rfc/rfc8628\n```"
  package: contrib/oauth
  scope: authorization code and RFC 8628 device authorization clients
  public_api:
  - NewClient(config, options)
  - Config.EndpointValidator applies caller-specific trust policy to configured endpoints
  - Client.BeginAuthorization(context, options) returns URL and transaction key
  - Client.HandleCallback(context, transaction key, callback values) returns TokenSet
  - Options.TransactionValidator runs after callback state correlation and before
    token exchange
  - TransactionCodec implements api:auth-state-codec
  - NewDeviceClient(config, options) returns a client that needs no redirect URI or
    state store
  - DeviceClient.Begin(context, options) returns data:device-authorization
  - DeviceClient.Poll(context, authorization) waits until TokenSet or a terminal typed
    error
  required:
  - generate state and PKCE verifier from crypto/rand
  - S256 PKCE only
  - store expiring correlation data and atomically consume it before code exchange
  - exact redirect URI supplied by application
  - protocol-managed authorization parameters cannot be overridden by extension parameters
  - scope values follow the RFC scope-token grammar and cannot contain whitespace
    or control bytes
  - endpoint validator mutations cannot rewrite the configured request endpoints
  - client_secret_basic and client_secret_post token authentication
  - public-client authentication with client_id and no client secret only on the typed
    device client
  - device authorization request, response, polling, and errors follow flow:oidc-device-authorization
  - polling timing, cancellation, backoff, and terminal behavior follow policy:device-authorization-security
  - bounded token endpoint request and response
  - bounded standard token string fields
  - typed token response with bounded raw extension values
  - policy:oauth-security
  deferred:
  - authorization server implementation
  - implicit and resource-owner password grants
  - OAuth token exchange grant
  - private_key_jwt and DPoP
  - automatic refresh scheduling
  standards:
    oauth: https://www.rfc-editor.org/rfc/rfc6749
    pkce: https://www.rfc-editor.org/rfc/rfc7636
    security: https://www.rfc-editor.org/rfc/rfc9700
    device_grant: https://www.rfc-editor.org/rfc/rfc8628

      one
  item-edc77221d2bc3ef2:
    text: no action is offered on a document with no diagnostic
  item-56fbef6489751338:
    text: a file-creating action shows the file it would create before creating it
  item-bd2527fc6d3a4277:
    text: an action is never offered in a *_pw_gen.go

id: requirement:auth-security-remediation
type: requirement
title: Authentication Security Remediation
summary: The eight gaps a security review found in the authentication surface at HEAD
  8c9601c, all closed; each invariant now lives in the concept that owns it, and this
  records what was decided and what remains bounded rather than absolute.
facts:
  legacy_body: "The eight gaps a security review found in the authentication surface\
    \ at HEAD 8c9601c, all closed; each invariant now lives in the concept that owns\
    \ it, and this records what was decided and what remains bounded rather than absolute.\n\
    \n```yaml\nreview:\n  date: 2026-08-05\n  head: 8c9601c\n  scope: plugin/auth,\
    \ contrib/passkey, contrib/jwt, contrib/oidc, session, and the DynamoDB and relational\
    \ authentication stores\n  verified: every finding was read against the tree rather\
    \ than carried over from the report\n  found_no_fault_in: session encryption,\
    \ the OAuth and OIDC exchanges, JWT validation, passkey signature verification,\
    \ and CSRF token generation\nstatus: implemented\nclosed:\n  passkey_enrollment_binding:\n\
    \    concept: policy:passkey-security\n    shipped: an opaque binding carried\
    \ in the ceremony state and required as an argument to FinishRegistration\n  account_revocation:\n\
    \    concept: policy:session-security\n    shipped: the account behind a live\
    \ session is re-read, bounded to once per 30 seconds, with auth.ForgetAccount\
    \ for immediacy\n  login_slot_placement:\n    concept: policy:session-security\n\
    \    shipped: a startup warning outside dev plus the PW0506 readiness check, rather\
    \ than a refusal\n  tinygo_request_timeouts:\n    concept: rule:tinygo-runtime-compatibility\n\
    \    shipped: a deadline-enforcing transport applied by the OIDC and JWT clients\
    \ under the tinygo tag\n  counter_monotonicity:\n    concept: api:auth-credential-store\n\
    \    shipped: a conditional relational update matching the DynamoDB store, with\
    \ the rule stated on the interface\n  jwks_staleness:\n    concept: policy:jwt-security\n\
    \    shipped: MaxStaleAge, defaulting to an hour and capped at 24, with no unbounded\
    \ value\n  revocation_cache_bounds:\n    concept: policy:token-revocation\n  \
    \  shipped: a 4096-entry cap with expiry-driven eviction\n  origin_check_consolidation:\n\
    \    concept: policy:csrf-protection\n    shipped: internal/requestorigin, shared\
    \ by the CSRF middleware and the authentication endpoints\nchanged_from_the_plan:\n\
    \  login_slot_placement:\n    planned: register the slot session.ServerOnly and\
    \ let the session package refuse the cookie backend\n    shipped: a startup warning\
    \ outside dev, silent in dev, and PW0506 in pw doctor\n    why: the slot is registered\
    \ from an init that cannot see whether auth is enabled, so ServerOnly would take\
    \ the cookie backend away from a deployment that merely links this package; the\
    \ slot also stores nothing before a login, so the placement bought nothing a check\
    \ does not\n    why_not_a_refusal: a login on the cookie backend is the correct\
    \ pairing in development, where the backend exists so that a login needs no infrastructure;\
    \ refusing would remove it from the case it was built for, and the deployment\
    \ is the party that knows whether it can live without ending a session on demand\n\
    \  account_revocation:\n    planned: an account-scoped epoch stamped into the\
    \ session and compared per request\n    shipped: a bounded re-read of the account\n\
    \    why: an epoch still has to be fetched from somewhere to be compared against,\
    \ so it adds a field without removing the read; the application already publishes\
    \ one way to ask about an account\nsharpened_during_verification:\n  origin_check:\
    \ the middleware implementation was already correct, reconstructing a whole origin\
    \ and refusing a null one, so the finding was a second weaker copy guarding the\
    \ authentication endpoints rather than a missing check\n  passkey_binding: the\
    \ stored user handle also stays the one minted at begin, so an affected account\
    \ would have held two handles\nresidual:\n  documented_at: the Known limits section\
    \ of the security guide, in both locales\n  items:\n    - a suspension reaches\
    \ a live session within 30 seconds, and ForgetAccount is process-local\n    -\
    \ a TinyGo round trip cannot be cancelled, so a hung provider costs a goroutine\
    \ and a connection rather than a stalled handler\n    - cached JWKS keys stop\
    \ verifying an hour past their TTL during an issuer outage\n    - the cookie session\
    \ backend still cannot revoke; outside dev that is a startup warning and PW0506,\
    \ not a refusal, so a deployment can still choose it knowingly\nverification:\n\
    \  passed: go build, go vet under both build configurations, go test over the\
    \ whole tree, and the documentation site build\n  tinygo: tinygo test of contrib/internal/authn\
    \ on 0.41.1 darwin/arm64, covering the deadline transport\n  added_tests: internal/requestorigin,\
    \ contrib/jwt RemoteKeySet which had none, the passkey binding, the account gate,\
    \ the conditional counter, the revocation cache bounds, and the cookie-backend\
    \ refusal\n  unchanged_from_the_review: the force_tinygo_logic run over the whole\
    \ tree still fails in zstd response handling and a SQLite read-only transaction,\
    \ neither in the authentication surface\n  caveat: system:tinygodriver vendors\
    \ forks of its database drivers, so a vulnerability database may not recognize\
    \ the module names; govulncheck passing is weaker evidence there than elsewhere\n\
    non_goals:\n  - a finding type in the catalog; each invariant belongs to the concept\
    \ it constrains, and the defect record is deleted with the fix\n  - configuration\
    \ keys for the two new bounds, which are constants until a deployment asks for\
    \ them\n```"

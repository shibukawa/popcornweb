id: requirement:web-standards-overview
type: requirement
title: Web Standards Architecture Overview
summary: '`website/src/content/docs/appendix/web-standards.md` and its Japanese peer
  are the headline index of Web standards and interoperable conventions adopted by
  the framework.'
facts:
  legacy_body: "`website/src/content/docs/appendix/web-standards.md` and its Japanese\
    \ peer are the headline index of Web standards and interoperable conventions adopted\
    \ by the framework.\n\n```yaml\naudience: application developers evaluating or\
    \ configuring framework HTTP behavior\npage_rule:\n  - summarize the framework\
    \ behavior and its standard or convention in one short entry\n  - link each entry\
    \ to existing detailed documentation instead of repeating configuration or examples\n\
    \  - distinguish IETF or W3C standards from de facto compatibility conventions\n\
    \  - claim adopted support only when shipped; label planned support explicitly\
    \ or omit it\nsections:\n  security_headers:\n    headline: browser response hardening,\
    \ CSRF, cookie protection, cross-origin admission, and origin handling\n    links:\n\
    \      - policy:security-response-headers\n      - policy:csrf-protection\n  \
    \    - policy:cookie-value-protection\n      - requirement:cors-middleware\n \
    \   cors_entry:\n      added: 2026-08-13, once shipped, per the page rule against\
    \ claiming unshipped support\n      names: the WHATWG Fetch Standard rather than\
    \ an RFC, since the opening of this page rests on that distinction\n      carries:\
    \ where the preflight is answered and why, that an unmarked response withholds\
    \ the status as well as the body, and the three exclusions -- no origin pattern\
    \ language, no Private Network Access, and the WebSocket upgrade\n    openapi_entry:\
    \ the OpenAPI section states the wildcard the document answers on its own, because\
    \ a reader deciding whether a hosted UI can read it looks there rather than in\
    \ the security section\n  authentication:\n    headline: OIDC Authorization Code\
    \ and Device Authorization, WebAuthn passkeys, Bearer JWT verification, sessions,\
    \ and assurance challenges\n    links:\n      - requirement:contrib-oidc\n   \
    \   - requirement:oidc-device-authorization\n      - requirement:contrib-passkey\n\
    \      - requirement:jwt-only-api-authentication\n      - requirement:session-assurance-levels\n\
    \    grant_boundary:\n      supported:\n        - Authorization Code Flow with\
    \ mandatory S256 PKCE, state, and nonce\n        - RFC 8628 Device Authorization\
    \ Grant for browserless or input-constrained clients\n      unsupported:\n   \
    \     - Resource Owner Password Credentials Grant because OAuth 2.0 Security BCP\
    \ says it MUST NOT be used\n        - Client Credentials Grant because it represents\
    \ a client without an end-user and belongs to machine-to-machine or batch workloads\n\
    \      distinction: Client Credentials Grant is not Device Authorization Grant\n\
    \  error_responses:\n    headline: negotiated RFC problem details, field validation\
    \ failures, safe HTML pages, and HTTP 429\n    links:\n      - api:problem-response\n\
    \      - policy:validation-errors\n      - requirement:rate-limit-problem-responses\n\
    \  api_lifecycle:\n    headline: Deprecation, Sunset, migration links, and OpenAPI\
    \ deprecation metadata\n    links:\n      - requirement:api-lifecycle-response-headers\n\
    \  openapi:\n    headline: generated operation contracts and configured document\
    \ or API-reference endpoints\n    links:\n      - system:tinybind\n      - policy:operational-endpoints\n\
    \      - requirement:dev-api-reference\n    api_discovery_entry:\n      added:\
    \ 2026-08-28, once shipped, per the page rule against claiming unshipped support\n\
    \      owner: requirement:api-catalog-well-known\n      names: RFC 9727 and the\
    \ RFC 9264 Linkset it is carried in, since both numbers decide whether a client's\
    \ parser accepts the document\n      carries: that the catalog is projected from\
    \ the endpoints this section already describes rather than authored, which is\
    \ why it sits here and not in operational_http; that its links are relative until\
    \ server.api_catalog_origin names one and are never guessed from the request Host;\
    \ and the cross-origin wildcard it shares with the document it points at\n   \
    \   exclusions: no nested catalogs, no negotiated APIs.json or HAL alternative,\
    \ and no service-meta link\n  cache_control:\n    headline: asset validators and\
    \ immutable caching, private dynamic responses, and no-store protocols\n    links:\n\
    \      - api:public-asset-middleware\n      - policy:public-asset-negotiation\n\
    \      - requirement:navigation-delta-rendering\n      - api:live-delivery-protocol\n\
    \  content_negotiation:\n    headline: Accept, content encoding, precompressed\
    \ assets, and Vary ownership\n    links:\n      - policy:response-content-encoding\n\
    \      - policy:public-asset-media-negotiation\n      - api:problem-response\n\
    \  operational_http:\n    headline: health, readiness, API documents, redirects,\
    \ compression, and request limits\n    links:\n      - policy:operational-endpoints\n\
    \      - api:redirect-response\n      - requirement:response-gzip-encoder\nacceptance:\n\
    \  - every headline links to at least one maintained detail page\n  - RFC numbers\
    \ and standards status are visible where they affect interoperability\n  - OIDC\
    \ flow support and intentionally unsupported OAuth grants are explicit\n  - the\
    \ index contains no duplicated configuration reference\n  - navigation exposes\
    \ the page under Architecture\n```"
  audience: application developers evaluating or configuring framework HTTP behavior
  page_rule:
  - summarize the framework behavior and its standard or convention in one short entry
  - link each entry to existing detailed documentation instead of repeating configuration
    or examples
  - distinguish IETF or W3C standards from de facto compatibility conventions
  - claim adopted support only when shipped; label planned support explicitly or omit
    it
  sections:
    security_headers:
      headline: browser response hardening, CSRF, cookie protection, cross-origin
        admission, and origin handling
      links:
      - policy:security-response-headers
      - policy:csrf-protection
      - policy:cookie-value-protection
      - requirement:cors-middleware
      cors_entry:
        added: 2026-08-13, once shipped, per the page rule against claiming unshipped
          support
        names: the WHATWG Fetch Standard rather than an RFC, since the opening of
          this page rests on that distinction
        carries: where the preflight is answered and why, that an unmarked response
          withholds the status as well as the body, and the three exclusions -- no
          origin pattern language, no Private Network Access, and the WebSocket upgrade
      openapi_entry: the OpenAPI section states the wildcard the document answers
        on its own, because a reader deciding whether a hosted UI can read it looks
        there rather than in the security section
    authentication:
      headline: OIDC Authorization Code and Device Authorization, WebAuthn passkeys,
        Bearer JWT verification, sessions, and assurance challenges
      links:
      - requirement:contrib-oidc
      - requirement:oidc-device-authorization
      - requirement:contrib-passkey
      - requirement:jwt-only-api-authentication
      - requirement:session-assurance-levels
      grant_boundary:
        supported:
        - Authorization Code Flow with mandatory S256 PKCE, state, and nonce
        - RFC 8628 Device Authorization Grant for browserless or input-constrained
          clients
        unsupported:
        - Resource Owner Password Credentials Grant because OAuth 2.0 Security BCP
          says it MUST NOT be used
        - Client Credentials Grant because it represents a client without an end-user
          and belongs to machine-to-machine or batch workloads
        distinction: Client Credentials Grant is not Device Authorization Grant
    error_responses:
      headline: negotiated RFC problem details, field validation failures, safe HTML
        pages, and HTTP 429
      links:
      - api:problem-response
      - policy:validation-errors
      - requirement:rate-limit-problem-responses
    api_lifecycle:
      headline: Deprecation, Sunset, migration links, and OpenAPI deprecation metadata
      links:
      - requirement:api-lifecycle-response-headers
    openapi:
      headline: generated operation contracts and configured document or API-reference
        endpoints
      links:
      - system:tinybind
      - policy:operational-endpoints
      - requirement:dev-api-reference
      api_discovery_entry:
        added: 2026-08-28, once shipped, per the page rule against claiming unshipped
          support
        owner: requirement:api-catalog-well-known
        names: RFC 9727 and the RFC 9264 Linkset it is carried in, since both numbers
          decide whether a client's parser accepts the document
        carries: that the catalog is projected from the endpoints this section already
          describes rather than authored, which is why it sits here and not in operational_http;
          that its links are relative until server.api_catalog_origin names one and
          are never guessed from the request Host; and the cross-origin wildcard it
          shares with the document it points at
        exclusions: no nested catalogs, no negotiated APIs.json or HAL alternative,
          and no service-meta link
    cache_control:
      headline: asset validators and immutable caching, private dynamic responses,
        and no-store protocols
      links:
      - api:public-asset-middleware
      - policy:public-asset-negotiation
      - requirement:navigation-delta-rendering
      - api:live-delivery-protocol
    content_negotiation:
      headline: Accept, content encoding, precompressed assets, and Vary ownership
      links:
      - policy:response-content-encoding
      - policy:public-asset-media-negotiation
      - api:problem-response
    operational_http:
      headline: health, readiness, API documents, redirects, compression, and request
        limits
      links:
      - policy:operational-endpoints
      - api:redirect-response
      - requirement:response-gzip-encoder
  acceptance:
  - every headline links to at least one maintained detail page
  - RFC numbers and standards status are visible where they affect interoperability
  - OIDC flow support and intentionally unsupported OAuth grants are explicit
  - the index contains no duplicated configuration reference
  - navigation exposes the page under Architecture

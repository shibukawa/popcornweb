id: requirement:contrib-acceptance
type: requirement
title: Contrib Acceptance Criteria
summary: A contrib package is releasable only when its declared subset is interoperable,
  bounded under hostile input, and verified on its supported TinyGo matrix.
facts:
  legacy_body: "A contrib package is releasable only when its declared subset is interoperable,\
    \ bounded under hostile input, and verified on its supported TinyGo matrix.\n\n\
    ```yaml\ncommon:\n  - policy:contrib-compatibility checks pass\n  - host Go and\
    \ TinyGo produce equivalent fixture results\n  - OAuth/OIDC compatibility is demonstrated\
    \ with at least two independent protocol-shaped fixtures\n  - live provider interoperability\
    \ is tracked separately and is not claimed without provider credentials\n  - public\
    \ API has examples and unsupported-feature documentation\n  - malformed and oversized\
    \ input tests prove bounded failure\n  - fuzz corpus runs under host Go and regression\
    \ cases run under TinyGo\n  - race or reentrancy behavior is documented for shared\
    \ objects\n  - package target matrices compile supported imported packages\npackage_gates:\n\
    \  sql_engines_shared:\n    applies_to:\n      - requirement:contrib-sqlite\n\
    \      - requirement:contrib-postgresql\n      - requirement:contrib-mysql\n \
    \   gates:\n      - one contract suite covering open, ping, parameters, null and\
    \ core scalar scanning, ErrNoRows, prepared statements, transactions, rollback,\
    \ and column metadata passes on every engine\n      - context cancellation interrupts\
    \ an in-flight query and reports it as an error rather than completing\n     \
    \ - savepoint open, release, and rollback pass per rule:savepoint-dialect-support\n\
    \      - the rule:explain-dialect-support plan capture returns a plan or records\
    \ an explicit explain_error\n      - requirement:database-migration applies, re-applies,\
    \ and reverses the same migration set\n      - requirement:test-data-seeding seeds\
    \ and asserts through the matching system:dbtestify dialect\n      - requirement:parallel-database-tests\
    \ passes with t.Parallel against one prepared database\n      - a DSN carrying\
    \ a password produces no output, log, or error containing it\n  server_sql_engines:\n\
    \    applies_to:\n      - requirement:contrib-postgresql\n      - requirement:contrib-mysql\n\
    \    gates:\n      - live interoperability passes against the declared server\
    \ versions, on host Go and under TinyGo\n      - each supported TLS mode is asserted\
    \ against the server's own view of the session, and an unknown CA and a wrong\
    \ host name are both rejected\n      - a platform with no TLS backend refuses\
    \ the connection instead of connecting in plaintext\n      - cancellation is measured\
    \ under TLS, not only in plaintext\n      - the pool opens no more server connections\
    \ than a standard Go build does for the same workload\n      - a -scheduler=tasks\
    \ build is proven to be a rejected configuration rather than a silent regression\n\
    \      - binary size and memory stay within policy:contrib-compatibility bounds\n\
    \      - a platform listed as unverified in decision:server-sql-support-tier is\
    \ reported as unverified rather than skipped silently\n  requirement:contrib-auth-state:\n\
    \    - concurrent Take returns a stored value exactly once\n    - every adapter\
    \ preserves single-use, expiry, cancellation, and stable error semantics\n  requirement:contrib-auth-state-memory:\n\
    \    - expiry and capacity tests use an injected clock without sleeping\n    -\
    \ concurrent Put and Take pass under the race detector\n    - hard entry and key\
    \ limits reject oversized configuration\n  requirement:contrib-auth-state-redis:\n\
    \    - Redis and Valkey each pass duplicate Put, expiry, concurrent Take, malformed\
    \ record, codec failure, cancellation, and reconnect fixtures\n    - every external\
    \ network fixture follows policy:outbound-transport-security\n  requirement:contrib-auth-state-sqlite:\n\
    \    - every requirement:contrib-sqlite backend passes duplicate Put, expired\
    \ replacement, concurrent Take, malformed row, codec failure, cancellation, reopen,\
    \ and bounded Prune fixtures\n    - schema initialization is idempotent and rejects\
    \ incompatible existing tables\n  requirement:contrib-auth-common:\n    - malformed,\
    \ non-canonical, duplicate, expired, and oversized vectors fail within configured\
    \ limits\n  requirement:contrib-cbor:\n    - RFC 8949 valid, malformed, duplicate-key,\
    \ limit, and deterministic-encoding vectors run upstream in system:tinygodriver\
    \ encoding/cbor\n    - COSE_Key signed labels and byte strings are exercised here\
    \ through requirement:contrib-passkey fixtures\n  requirement:contrib-passkey:\n\
    \    - ES256 registration and authentication succeed against two independent authenticator\
    \ fixtures or implementations\n    - negative vectors cover challenge, origin,\
    \ RP ID hash, flags, user handle, algorithm, signature, counter, and backup state\n\
    \  requirement:contrib-passkey-test:\n    - a registration and an authentication\
    \ built from the emitted options JSON alone complete against requirement:contrib-passkey\n\
    \    - every declared fault is rejected with its specific requirement:contrib-passkey\
    \ error and none is accepted\n    - a seeded run reproduces identical credential\
    \ IDs and keys; signatures still vary, because ECDSA is randomized exactly as\
    \ it is on a real authenticator\n    - two credentials registered for one account\
    \ are independently selectable through allowCredentials\n    - discoverable and\
    \ non-discoverable registrations differ only in the returned user handle\n   \
    \ - it counts as at most one of the two independent authenticator implementations,\
    \ per decision:passkey-test-authenticator\n    - the TinyGo matrix is not required,\
    \ per decision:host-tools-target-runtime\n  requirement:contrib-otel:\n    - W3C\
    \ propagation vectors pass\n    - OTLP/HTTP JSON trace and log requests are accepted\
    \ on standard endpoints by an OpenTelemetry Collector\n    - retry exhaustion\
    \ reports drops without writing telemetry to stdout\n  requirement:contrib-redis-valkey:\n\
    \    - the pinned go-redis client compiles with the supported TinyGo version and\
    \ passes required commands against Redis and Valkey\n    - decision:local-tls-proxy-boundary\
    \ passes certificate, hostname, unavailable upstream, and credential-redaction\
    \ fixtures\n  requirement:contrib-jwt:\n    - RFC and adversarial algorithm-confusion\
    \ vectors pass\n  requirement:contrib-websocket:\n    - one echo fixture completes\
    \ handshake, text and binary round trip, ping and pong, and close, and passes\
    \ unchanged against each supported backend's upgrader\n    - a cross-origin upgrade\
    \ is refused without the application configuring anything, and the refusal is\
    \ a 403 rather than a dropped connection\n    - an upgrade carrying no Origin\
    \ header is admitted only where the framework's request-origin resolution admits\
    \ it, so the library's own default is never what decides\n    - a malformed handshake,\
    \ an oversized frame, and an oversized control message each fail within configured\
    \ limits\n    - the callback closing over the request rather than over read values\
    \ is caught by rule:transport-handle-checks rather than by review\n    - the TinyGo\
    \ matrix is either passing or carries an explicit exemption decision; an unstated\
    \ exemption fails this gate\n  requirement:contrib-oauth:\n    - Authorization\
    \ Code plus S256 PKCE succeeds against two independent servers or conformance\
    \ fixtures\n    - negative vectors cover state, expiry, replay, callback errors,\
    \ redirect URI, PKCE, and oversized token responses\n  requirement:contrib-oidc:\n\
    \    - Authorization Code plus PKCE succeeds against two independent providers\
    \ or conformance fixtures\n    - requirement:contrib-devidp counts as at most\
    \ one of those two, because it is developed in this repository\n  requirement:contrib-devidp:\n\
    \    - an independent OIDC client library validates discovery, JWKS, ID Token,\
    \ and UserInfo output\n    - requirement:contrib-oidc completes Authorization\
    \ Code plus S256 PKCE against it under host Go\n    - negative vectors cover unknown\
    \ client, unregistered redirect URI, missing or mismatched PKCE verifier, replayed\
    \ code, expired code, wrong client secret, unknown subject, and unconfigured scope\n\
    \    - roster loading rejects unknown keys, reserved claim overrides, empty client\
    \ secrets, and duplicate subjects\n    - policy:devidp-safety refusals are proven\
    \ for prod environment, non-loopback bind without opt-in, and application build\
    \ import\n    - automatic login and ui:devidp-login selection issue identical\
    \ token claims\n    - RP-initiated logout revokes the subject access tokens and\
    \ rejects a forged id_token_hint or an unregistered post_logout_redirect_uri\n\
    \    - an api:cli-dev run with no client, issuer, or secret in any project file\
    \ completes flow:oidc-account-login from injected environment values alone\n \
    \   - a reserved-port run and a pinned-port run both produce discovery URLs that\
    \ the relying party accepts\n    - ephemeral client redirect handling accepts\
    \ loopback callbacks on any port and rejects every non-loopback host\n    - injected\
    \ secrets never appear in api:cli-dev output or configuration provenance logs\n\
    \    - the TinyGo matrix is not required, per decision:devidp-scope-reduction\n\
    \  requirement:contrib-html-template:\n    - invalid field paths, loop types,\
    \ map keys, helpers, and JSON type graphs fail during generation with source positions\n\
    \    - generated struct, slice, array, map, pointer, and JSON fixtures match golden\
    \ output under host Go and TinyGo\n    - HTML, attribute, URL, JavaScript, CSS,\
    \ and JSON script XSS vectors remain escaped\n```"
  common:
  - policy:contrib-compatibility checks pass
  - host Go and TinyGo produce equivalent fixture results
  - OAuth/OIDC compatibility is demonstrated with at least two independent protocol-shaped
    fixtures
  - live provider interoperability is tracked separately and is not claimed without
    provider credentials
  - public API has examples and unsupported-feature documentation
  - malformed and oversized input tests prove bounded failure
  - fuzz corpus runs under host Go and regression cases run under TinyGo
  - race or reentrancy behavior is documented for shared objects
  - package target matrices compile supported imported packages
  package_gates:
    sql_engines_shared:
      applies_to:
      - requirement:contrib-sqlite
      - requirement:contrib-postgresql
      - requirement:contrib-mysql
      gates:
      - one contract suite covering open, ping, parameters, null and core scalar scanning,
        ErrNoRows, prepared statements, transactions, rollback, and column metadata
        passes on every engine
      - context cancellation interrupts an in-flight query and reports it as an error
        rather than completing
      - savepoint open, release, and rollback pass per rule:savepoint-dialect-support
      - the rule:explain-dialect-support plan capture returns a plan or records an
        explicit explain_error
      - requirement:database-migration applies, re-applies, and reverses the same
        migration set
      - requirement:test-data-seeding seeds and asserts through the matching system:dbtestify
        dialect
      - requirement:parallel-database-tests passes with t.Parallel against one prepared
        database
      - a DSN carrying a password produces no output, log, or error containing it
    server_sql_engines:
      applies_to:
      - requirement:contrib-postgresql
      - requirement:contrib-mysql
      gates:
      - live interoperability passes against the declared server versions, on host
        Go and under TinyGo
      - each supported TLS mode is asserted against the server's own view of the session,
        and an unknown CA and a wrong host name are both rejected
      - a platform with no TLS backend refuses the connection instead of connecting
        in plaintext
      - cancellation is measured under TLS, not only in plaintext
      - the pool opens no more server connections than a standard Go build does for
        the same workload
      - a -scheduler=tasks build is proven to be a rejected configuration rather than
        a silent regression
      - binary size and memory stay within policy:contrib-compatibility bounds
      - a platform listed as unverified in decision:server-sql-support-tier is reported
        as unverified rather than skipped silently
    requirement:contrib-auth-state:
    - concurrent Take returns a stored value exactly once
    - every adapter preserves single-use, expiry, cancellation, and stable error semantics
    requirement:contrib-auth-state-memory:
    - expiry and capacity tests use an injected clock without sleeping
    - concurrent Put and Take pass under the race detector
    - hard entry and key limits reject oversized configuration
    requirement:contrib-auth-state-redis:
    - Redis and Valkey each pass duplicate Put, expiry, concurrent Take, malformed
      record, codec failure, cancellation, and reconnect fixtures
    - every external network fixture follows policy:outbound-transport-security
    requirement:contrib-auth-state-sqlite:
    - every requirement:contrib-sqlite backend passes duplicate Put, expired replacement,
      concurrent Take, malformed row, codec failure, cancellation, reopen, and bounded
      Prune fixtures
    - schema initialization is idempotent and rejects incompatible existing tables
    requirement:contrib-auth-common:
    - malformed, non-canonical, duplicate, expired, and oversized vectors fail within
      configured limits
    requirement:contrib-cbor:
    - RFC 8949 valid, malformed, duplicate-key, limit, and deterministic-encoding
      vectors run upstream in system:tinygodriver encoding/cbor
    - COSE_Key signed labels and byte strings are exercised here through requirement:contrib-passkey
      fixtures
    requirement:contrib-passkey:
    - ES256 registration and authentication succeed against two independent authenticator
      fixtures or implementations
    - negative vectors cover challenge, origin, RP ID hash, flags, user handle, algorithm,
      signature, counter, and backup state
    requirement:contrib-passkey-test:
    - a registration and an authentication built from the emitted options JSON alone
      complete against requirement:contrib-passkey
    - every declared fault is rejected with its specific requirement:contrib-passkey
      error and none is accepted
    - a seeded run reproduces identical credential IDs and keys; signatures still
      vary, because ECDSA is randomized exactly as it is on a real authenticator
    - two credentials registered for one account are independently selectable through
      allowCredentials
    - discoverable and non-discoverable registrations differ only in the returned
      user handle
    - it counts as at most one of the two independent authenticator implementations,
      per decision:passkey-test-authenticator
    - the TinyGo matrix is not required, per decision:host-tools-target-runtime
    requirement:contrib-otel:
    - W3C propagation vectors pass
    - OTLP/HTTP JSON trace and log requests are accepted on standard endpoints by
      an OpenTelemetry Collector
    - retry exhaustion reports drops without writing telemetry to stdout
    requirement:contrib-redis-valkey:
    - the pinned go-redis client compiles with the supported TinyGo version and passes
      required commands against Redis and Valkey
    - decision:local-tls-proxy-boundary passes certificate, hostname, unavailable
      upstream, and credential-redaction fixtures
    requirement:contrib-jwt:
    - RFC and adversarial algorithm-confusion vectors pass
    requirement:contrib-websocket:
    - one echo fixture completes handshake, text and binary round trip, ping and pong,
      and close, and passes unchanged against each supported backend's upgrader
    - a cross-origin upgrade is refused without the application configuring anything,
      and the refusal is a 403 rather than a dropped connection
    - an upgrade carrying no Origin header is admitted only where the framework's
      request-origin resolution admits it, so the library's own default is never what
      decides
    - a malformed handshake, an oversized frame, and an oversized control message
      each fail within configured limits
    - the callback closing over the request rather than over read values is caught
      by rule:transport-handle-checks rather than by review
    - the TinyGo matrix is either passing or carries an explicit exemption decision;
      an unstated exemption fails this gate
    requirement:contrib-oauth:
    - Authorization Code plus S256 PKCE succeeds against two independent servers or
      conformance fixtures
    - negative vectors cover state, expiry, replay, callback errors, redirect URI,
      PKCE, and oversized token responses
    requirement:contrib-oidc:
    - Authorization Code plus PKCE succeeds against two independent providers or conformance
      fixtures
    - requirement:contrib-devidp counts as at most one of those two, because it is
      developed in this repository
    requirement:contrib-devidp:
    - an independent OIDC client library validates discovery, JWKS, ID Token, and
      UserInfo output
    - requirement:contrib-oidc completes Authorization Code plus S256 PKCE against
      it under host Go
    - negative vectors cover unknown client, unregistered redirect URI, missing or
      mismatched PKCE verifier, replayed code, expired code, wrong client secret,
      unknown subject, and unconfigured scope
    - roster loading rejects unknown keys, reserved claim overrides, empty client
      secrets, and duplicate subjects
    - policy:devidp-safety refusals are proven for prod environment, non-loopback
      bind without opt-in, and application build import
    - automatic login and ui:devidp-login selection issue identical token claims
    - RP-initiated logout revokes the subject access tokens and rejects a forged id_token_hint
      or an unregistered post_logout_redirect_uri
    - an api:cli-dev run with no client, issuer, or secret in any project file completes
      flow:oidc-account-login from injected environment values alone
    - a reserved-port run and a pinned-port run both produce discovery URLs that the
      relying party accepts
    - ephemeral client redirect handling accepts loopback callbacks on any port and
      rejects every non-loopback host
    - injected secrets never appear in api:cli-dev output or configuration provenance
      logs
    - the TinyGo matrix is not required, per decision:devidp-scope-reduction
    requirement:contrib-html-template:
    - invalid field paths, loop types, map keys, helpers, and JSON type graphs fail
      during generation with source positions
    - generated struct, slice, array, map, pointer, and JSON fixtures match golden
      output under host Go and TinyGo
    - HTML, attribute, URL, JavaScript, CSS, and JSON script XSS vectors remain escaped

id: requirement:object-storage
type: requirement
title: Object Storage
summary: 'An application stores and reads files through one object storage interface
  whose backend is selected by configuration: S3-compatible storage on a process host,
  the R2 binding in a Cloudflare Worker, and a local directory in development.'
facts:
  legacy_body: "An application stores and reads files through one object storage interface\
    \ whose backend is selected by configuration: S3-compatible storage on a process\
    \ host, the R2 binding in a Cloudflare Worker, and a local directory in development.\n\
    \n```yaml\naudience: actor:application-developer\npriority: should; the second\
    \ half of requirement:cloudflare-r2-storage, placed here by decision:object-storage-in-framework\n\
    status: implemented 2026-09-03 as api:storage-package; the external tree still\
    \ reads through its own source hook, and presigned URLs and multipart stay out\n\
    motivation:\n  - an application that accepts uploads needs an object store on\
    \ every host, and today it reaches one only by calling a client directly, which\
    \ ties a handler to the host it was written on\n  - requirement:cloudflare-r2-storage\
    \ serves the external public tree from a bucket through a source hook of its own;\
    \ the application-facing half has no home yet\n  - system:tinygodriver storage/s3\
    \ already speaks the API R2, S3 and every S3-compatible store implement, so the\
    \ process-host backend is an adapter rather than a client\ninterface:\n  package:\
    \ storage\n  bucket: Get, Head, Put, Delete and List on a Bucket value, each taking\
    \ a context, with Get returning the body as a stream the caller closes and Head\
    \ returning metadata alone\n  object: key, size, ETag, media type, and last modified,\
    \ in the shape system:tinygodriver storage/s3 already reports; user metadata carried\
    \ as a string map\n  put: media type required, content length optional, metadata\
    \ optional\n  list: by prefix, paged by a continuation token, so a large bucket\
    \ is never read whole\n  errors: a missing key is a sentinel the caller tests\
    \ with errors.Is, never a nil object; every other failure carries the backend's\
    \ error\n  no_seek: a body is a stream, not a file; a caller needing Range asks\
    \ the backend for a range rather than seeking\nbackends:\n  s3:\n    package:\
    \ storage/s3, wrapping system:tinygodriver storage/s3\n    configuration: endpoint,\
    \ region, bucket, and credentials by reference to environment names, never inline,\
    \ per the secret rule of data:server-runtime-config\n    hosts: every process\
    \ host, and R2 through its S3 API from outside a Worker\n  r2:\n    package: cloudflare/r2,\
    \ the binding client of requirement:cloudflare-r2-storage, implementing the same\
    \ interface; compiled under js && wasm, with the host file refusing to open\n\
    \    configuration: the binding name; wrangler.jsonc carries r2_buckets for it,\
    \ per requirement:cloudflare-workers-build-target\n  local:\n    package: storage/local,\
    \ a directory under the project, for api:cli-dev and tests\n    configuration:\
    \ the directory, relative to the project\n    why: a developer loop that needs\
    \ an S3 endpoint before a file can be stored is one nobody starts with\nselection:\n\
    \  configuration: a [[storage.buckets]] array, each element naming a bucket by\
    \ the name handlers address it by, its backend, and the backend's settings; the\
    \ shape data:project-config's cache.stores and middleware.rdb.connections already\
    \ use\n  environment_form: the array travels as JSON in one variable, the way\
    \ pwconfig.ConnectionsEnv carries connections, so a Worker receives it through\
    \ wrangler vars\n  handle: storage.Bucket(ctx, name) resolves a configured bucket\
    \ from process state, the way api:dynamo-package resolves its Handle; no context\
    \ value stands between a handler and the store\n  refusal: a backend the host\
    \ cannot reach is refused at startup naming the bucket, per requirement:cloudflare-process-state-refusal's\
    \ shape; on a Worker only r2 is reachable\nexternal_public_tree:\n  fact: requirement:cloudflare-r2-storage's\
    \ ExternalAssetSource is a read of one bucket by manifest path\n  convergence:\
    \ the r2 source reads through the same cloudflare/r2 Bucket the r2 backend is,\
    \ so one client serves the tree and the application's own objects; folding the\
    \ source into a configured bucket is open\ndevelopment:\n  api:cli-dev: the local\
    \ backend by default, so a scaffolded upload handler works before any bucket exists\n\
    \  parity: the same handler runs against s3 and r2 without a change, which is\
    \ what the interface is for\npresigned_urls:\n  status: implemented 2026-09-04\
    \ on system:tinygodriver v1.2.12, which answered docs/tinygodriver-s3-presign-request.md\
    \ with Presign and multipart together\n  interface: Presign(ctx, key, PresignOptions)\
    \ on Bucket, returning a URL a browser may GET or PUT for a bounded time\n  s3:\
    \ the client's SigV4 query-string signer, once it exists there, so one signer\
    \ serves every host and the redirect re-signing it already has keeps it right\n\
    \  r2: the same signer against the R2 S3 endpoint, when the bucket's configuration\
    \ carries an access key beside the binding; without one, refused by name, because\
    \ the binding has no presign of its own\n  local: a relative path under storage.SignedPathPrefix\
    \ that the application serves through storage.SignedHandler, mounted at SlotSignedStorage\
    \ when a local bucket is configured; the signature is an HMAC over method, bucket,\
    \ key and expiry with a key generated per process, so a URL outlives neither\n\
    \  route: GET streams the object with its media type and ETag, PUT stores the\
    \ body under the signed key, DELETE removes it; a signature for another method,\
    \ another key or a past expiry is 403\n  why_not_built_here: cloud/aws exports\
    \ the canonical helpers, but the signing key and canonical request are that library's,\
    \ and a presign that disagreed with its header signer by one encoding rule would\
    \ be a SignatureDoesNotMatch no test here catches\nnon_goals:\n  - a second SigV4\
    \ implementation here\n  - multipart in the interface, although system:tinygodriver\
    \ storage/s3 now has it; it waits for an application above the single-Put limit\n\
    \  - multipart upload, until an application needs an object the single Put limit\
    \ refuses\n  - a typed object binding in system:tinybind; the interface carries\
    \ bytes and metadata\n  - S3 through system:tinygodriver from inside a Worker;\
    \ the binding is the Worker's client\nverified:\n  date: 2026-09-03\n  host: a\
    \ handler doing put, head, get, list, delete and the not-found check against the\
    \ local backend under the host process\n  worker: the same handler against the\
    \ r2 backend under wrangler dev, from one source, with the binding declared by\
    \ the build\nacceptance:\n  - a handler stores and reads back an object against\
    \ the local backend under api:cli-dev\n  - the same handler runs against storage/s3\
    \ on a process host and against cloudflare/r2 under wrangler dev from one source\n\
    \  - a missing key is reported by the sentinel on every backend\n  - a Worker\
    \ configured with an s3 bucket is refused at startup naming the bucket\n  - the\
    \ external public tree is served through the interface with the ETag and Range\
    \ behaviour requirement:cloudflare-r2-storage verified\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: Object of type date is not JSON serializable

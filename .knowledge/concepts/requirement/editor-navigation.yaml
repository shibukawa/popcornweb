id: requirement:editor-navigation
type: requirement
title: Cross-Language Navigation
summary: A name that crosses the boundary between a template source, its generated
  Go, and the handwritten Go that calls it is navigable in one jump, because that
  boundary is where the framework's indirection lives.
facts:
  legacy_body: "A name that crosses the boundary between a template source, its generated\
    \ Go, and the handwritten Go that calls it is navigable in one jump, because that\
    \ boundary is where the framework's indirection lives.\n\n```yaml\nstatus: >\n\
    \  hover, definition, and references implemented at internal/pwlsp, with both\
    \ Go\n  directions. What is not implemented is the page_tree, action, sql_table,\
    \ and\n  dynamo_attribute jumps below, each of which needs a resolver this server\
    \ does\n  not have yet\ngo_directions:\n  declaration_to_call: part of textDocument/references.\
    \ The names to look for are read out of the declaration's own generated file rather\
    \ than derived from it, because the naming scheme belongs to api:cli-generate\
    \ and a copy here would drift on its next release; with no generated output the\
    \ declaration name alone is used, which is the exported entry every dialect emits\n\
    \  call_to_declaration: the pw/declarationFor request and an editor command, not\
    \ a definition provider. vision:editor-support leaves Go documents to gopls, and\
    \ registering a provider for them would put this extension in front of the one\
    \ that owns the language\n  never_a_destination: a *_pw_gen.go is excluded from\
    \ call sites, per the generated_files rule below\n  ambiguity: a wrapper carries\
    \ the declaration name inside its own, and so does every shorter declaration whose\
    \ name is a substring of it; the longest match wins, because taking any match\
    \ would answer with whichever the index happened to yield first\nstage: 3 of vision:editor-support\n\
    server: requirement:pw-language-server\njumps:\n  component_to_component: a component\
    \ reference in a .pw.html body to its declaration, in the same file or another\
    \ one\n  declaration_to_call: a component, statement, or dynamo declaration to\
    \ the Go call sites of its generated function\n  call_to_declaration: a generated\
    \ function call in handwritten Go to the .pw.* declaration that produced it, skipping\
    \ the *_pw_gen.go in between\n  external_binding: an external, external async,\
    \ or external live declaration to the Go function it binds\n  page_tree: a concept:page-tree\
    \ page or layout to its route, and a route to its page, per flow:page-route-generation\n\
    \  action: a server action reference in a template to its Go handler, per api:server-action\n\
    \  sql_table: a table name in a .pw.sql or a .pw.dynamo table clause to the data:migration-source\
    \ statement that creates it\n  dynamo_attribute: an attribute in a key clause\
    \ to the dynamo-tagged struct field that declares it\nhover:\n  declaration: the\
    \ resolved signature, the generated Go function name, and the output type\n  parameter:\
    \ its declared type\n  dynamo_attribute: the tag, its stored type, and its key\
    \ role\ngenerated_files:\n  rule: a *_pw_gen.go is a waypoint, never a destination;\
    \ navigation resolves through it to the source\n  reason: policy:generated-artifacts\
    \ makes it uncommitted output, so a bookmark into it is worthless\nprerequisites:\n\
    \  - a loaded project, because a call site is found by the same analysis api:cli-generate\
    \ uses\n  - generated output present for the Go direction, since the call site\
    \ references a generated symbol\n  - degraded answer when either is missing: report\
    \ unavailable rather than a partial result\ndeferred:\n  rename: a declaration\
    \ name decides a Go symbol, a file name, and possibly a route, so renaming is\
    \ a generator operation rather than an editor one\nacceptance:\n  - go-to-definition\
    \ on a generated query call in a handler lands on the .pw.sql statement\n  - go-to-definition\
    \ on a component reference lands on its declaration and never on the generated\
    \ fragment\n  - find-references on a component declaration lists template references\
    \ and Go call sites in one result\n  - hover on a dynamo key attribute names the\
    \ struct field and its stored type\n  - a project with no generated output still\
    \ navigates template to template\n```"
  status: 'hover, definition, and references implemented at internal/pwlsp, with both
    Go directions. What is not implemented is the page_tree, action, sql_table, and
    dynamo_attribute jumps below, each of which needs a resolver this server does
    not have yet

    '
  go_directions:
    declaration_to_call: part of textDocument/references. The names to look for are
      read out of the declaration's own generated file rather than derived from it,
      because the naming scheme belongs to api:cli-generate and a copy here would
      drift on its next release; with no generated output the declaration name alone
      is used, which is the exported entry every dialect emits
    call_to_declaration: the pw/declarationFor request and an editor command, not
      a definition provider. vision:editor-support leaves Go documents to gopls, and
      registering a provider for them would put this extension in front of the one
      that owns the language
    never_a_destination: a *_pw_gen.go is excluded from call sites, per the generated_files
      rule below
    ambiguity: a wrapper carries the declaration name inside its own, and so does
      every shorter declaration whose name is a substring of it; the longest match
      wins, because taking any match would answer with whichever the index happened
      to yield first
  stage: 3 of vision:editor-support
  server: requirement:pw-language-server
  jumps:
    component_to_component: a component reference in a .pw.html body to its declaration,
      in the same file or another one
    declaration_to_call: a component, statement, or dynamo declaration to the Go call
      sites of its generated function
    call_to_declaration: a generated function call in handwritten Go to the .pw.*
      declaration that produced it, skipping the *_pw_gen.go in between
    external_binding: an external, external async, or external live declaration to
      the Go function it binds
    page_tree: a concept:page-tree page or layout to its route, and a route to its
      page, per flow:page-route-generation
    action: a server action reference in a template to its Go handler, per api:server-action
    sql_table: a table name in a .pw.sql or a .pw.dynamo table clause to the data:migration-source
      statement that creates it
    dynamo_attribute: an attribute in a key clause to the dynamo-tagged struct field
      that declares it
  hover:
    declaration: the resolved signature, the generated Go function name, and the output
      type
    parameter: its declared type
    dynamo_attribute: the tag, its stored type, and its key role
  generated_files:
    rule: a *_pw_gen.go is a waypoint, never a destination; navigation resolves through
      it to the source
    reason: policy:generated-artifacts makes it uncommitted output, so a bookmark
      into it is worthless
  prerequisites:
  - a loaded project, because a call site is found by the same analysis api:cli-generate
    uses
  - generated output present for the Go direction, since the call site references
    a generated symbol
  - degraded answer when either is missing: report unavailable rather than a partial
      result
  deferred:
    rename: a declaration name decides a Go symbol, a file name, and possibly a route,
      so renaming is a generator operation rather than an editor one
  acceptance:
  - go-to-definition on a generated query call in a handler lands on the .pw.sql statement
  - go-to-definition on a component reference lands on its declaration and never on
    the generated fragment
  - find-references on a component declaration lists template references and Go call
    sites in one result
  - hover on a dynamo key attribute names the struct field and its stored type
  - a project with no generated output still navigates template to template

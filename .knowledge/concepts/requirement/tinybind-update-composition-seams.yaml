      per template file rather than the feature
    ask: unchanged from the earlier round; the registration seam is the piece with
      no substitute
  csrf_token_rotation:
    withdrawn: raised as an ask, then answered on this side before it was sent
    the_gap_as_raised: a token reaching the browser once, as head metadata written
      at render, cannot be refreshed, so a page held across a rotation holds a stale
      token
    why_it_was_the_wrong_ask: the defect was in this framework's chosen transport
      rather than in the module, which had picked a page-embedded token with no refresh
      channel

    one_header_cannot_move: the redraw entity tag, which digests the body the module
      assembles, so a caller cannot produce it without rendering the component twice
    a_narrower_reading_of_the_vary_axes:
      the_module_asks_for: the redraw axes on a page response too, so a cache that
        learned the page cannot answer a redraw from it
      this_side_declares: the render and build axes before the branch and the narrow
        ones only on the redraw itself
      why: every update request names its mode on the render header and a document
        names none, so the render axis already separates the page from all three;
        kind and instance separate one redraw from another, and every redraw response
        carries them
    found_by_probing_the_running_example: three defects, none reachable from a test
      that agreed with itself about what a response should contain
    sequence_response_claimed_the_wrong_mode:
      what: routing the mode echo through a shared token function whose switch has
        no sequence case, so a sequence answered as a navigation
      effect: a client checking the echo — which is where proxy substitution is detected
        — discards every tree it asks for, every operation carrying values falls back,
        and every in-page navigation becomes a complete document
      fixed_here: the echo is set on the answer before it is sent, because the header
        is this framework's
    redraw_carries_an_empty_markup_field_beside_its_values:
      what: the redraw response encodes its markup field unconditionally, so an operation
        that chose the address form arrives with an empty string next to the address
      effect: a client reading markup first replaces the region with nothing, reports
        the update applied, and emits its redrawn event; the row leaves the page with
        no error, no failed request, and nothing in the response that looks wrong
      fixed_here: the address wins where both are present, which is also right on
        its own terms — an empty string is a legitimate rendering, so it cannot be
        told from an absent field, and the address is the unambiguous half
      not_raised_upstream: deciding which half of an operation is authoritative is
        wire-format work this side owns, so the client rule is the fix rather than
        the interim workaround; the omitempty asymmetry between the streamed and buffered
        encodings is left alone deliberately
    the_hole_element_cannot_survive_a_table:
      what: the placeholder a decomposed fragment leaves is an unknown element, and
        an unknown element inside a table is foster-parented — the parser lifts it
        out of the tbody and inserts it before the table
      effect: every hole a table's rows leave sits outside the table, the rows filling
        them land loose on the page, and the list is left empty; the response is correct
        and the resulting DOM is valid, so nothing reports it
      fixed_here: holes are rewritten to template elements before parsing and the
        spelling is restored through the DOM afterwards, since insertion is not parsing
        and nothing is foster-parented
      the_ask: a placeholder the parser keeps where it was written — a template element
        or a comment both qualify — because a reloadable row is the shape the children
        operation exists for
      wider_than_the_delta: a progressive render writes the same element for an await
        boundary, so an await boundary inside a table has the same problem in the
        streamed document
  v0_4_8_answered_the_round:
    status: all three raised items closed, plus one this side did not find
    the_hole_split_into_two_shapes:
      delta_hole: a template element, which is what this side asked for; the rewrite-before-parse
        and restore-after is deleted, since the server writes the template
      await_marker: a comment fence around the fallback, because a template's contents
        do not render and a fallback that does not render is not a fallback — the
        objection this side did not think of
      why_they_had_to_split: a hole is one node to replace and an await is a range
        around visible content; no single shape is both, since nothing the parser
        keeps in a table renders its contents
      taken_here: applyBoundary walks to the fence instead of looking up a placeholder
        element, and the markers are kept rather than removed after settling, because
        a live boundary refills the same range for as long as its subscription lives
      verified_in_a_browser: an await boundary inside a tbody, served through the
        framework; the markers stay in the tbody, the fallback row is replaced in
        place, and nothing lands loose in the body
    sequence_echo: the default arm removed and the switch made exhaustive, so a missing
      case is a panic at the first test rather than a response that lies; the correction
      on this side is deleted
    values_are_smaller: one predicate both paths call, so the rule cannot be on one
      and not the other again
    refusal_vary_found_upstream: FailureResponse carried no Vary at all, and a heuristically
      cacheable 404 could then answer a document request from the same URL; upstream
      now adds the negotiated mode's axes
    the_vary_placement_disagreement:
      outcome: this side was right that the render axis already separates a page from
        a redraw, and upstream's stated reason did not hold
      but_the_placement_was_load_bearing_anyway: declaring the shared axes before
        the branch was covering the refusal that carried none, which neither side
        had noticed
      kept: right answer, wrong reason, and worth remembering as a case where the
        advice survived its argument
    costs_of_the_round: every sequence address and frame validator changed, so the
      first request after a deploy is a complete document; committed fixtures regenerated
  carried_forward:
    live_mode_plan_slice: requirement:live-mode-plan-slice, since a live render still
      executes the whole composed chain and pays it per reconnect
    liveness_signal: requirement:live-boundary-liveness-signal, since nothing states
      which boundary is live and this framework keeps its own bookkeeping
    status: raised in earlier rounds, unchanged by v0.3.1, and listed so a round does
      not read as if they were resolved
  not_asked_for:
  - the delta protocol, the validators, the manifest encoding, or the operation kinds
  - anything settled by v0.3.1, which answered its round in full
  - a second convergence of the live transport itself, which is this framework's decision
    rather than a module gap
  acceptance:
  - the live token means one body, whichever side implements it, and the guide describes
    what the code does
  - a component appearing for the first time in a redraw or an action response installs
    its assets before its markup lands
  - a caller can read a chain's required assets before rendering starts
  - a template writes one registered element for a CSRF token
  - a slot-supplied component's head contributions are delivered or reported, never
    dropped
  - one attribute prefix reaches every generation path, so no document holds two spellings

id: requirement:tinybind-update-composition-seams
type: requirement
title: TinyBind Update Composition Seams
summary: Seams system:tinybind owns that this framework needs opened before the update
  capabilities compose cleanly; v0.3.3 answered the five raised against v0.3.1 and
  v0.3.5 answered the client ownership round, leaving the attribute prefix as the
  one item still open.

  owner: system:tinybind
  raised_against: v0.3.1
  answered_partly: v0.3.2, which settled the documentation defect and carried head
    on the action response
  answered_fully: v0.3.3
  status: five closed by v0.3.3; the client ownership question answered by v0.3.5
    and settled on this side; the attribute prefix is the one item still open
  kept_for: the record of the round and of two corrections this framework had to make
    to its own findings
  as_built:
    live_token: its own negotiated mode, so subscriptions stay open only in live mode;
      the validator question answered as deliveries carrying none and the opening
      delta carrying them
    adopted_from_here: the done-versus-retry distinction, the build identity on the
      opening record, and resetting the attempt count on a healthy close, all offered
      as input and taken
    found_while_settling_it: the module's live entry had set subscriptions unconditionally,
      so an ordinary navigation delta on a live route never terminated
    redraw_head: covered from both sides without changing the body, by a registry-level
      required set for the shell and a response header for the per-redraw case
    asset_set: the required set is on the bound value and readable before rendering;
      the embedded byte table and caller URL function remain unbuilt
    builtin_elements: registration and lowering shipped, though requirement:module-native-csrf
      removed the use this framework had for them
    slot_head: the plan now reaches fragments carried in parameter structs, so no
      report side was needed; the existing rejection logic sees them
    cost_elsewhere: the hyphenated element namespace closed, which requirement:custom-element-registration
      carries
  follows: requirement:tinybind-runtime-ownership, answered in full by v0.3.1
  not_blocked: nothing here stops adoption; one item is cheap now and expensive after
    either side ships
  live_mode_convergence:
    priority: first, and the only item that is a wire contract rather than a missing
      feature
    what_we_did: decision:update-runtime-convergence put this framework's live delivery
      on the shared render header, as 'live;v=N', tested before delegating to the
      module
    what_we_relied_on: the documented rule that an unrecognized mode resolves to a
      complete document, which makes an unknown token inert rather than an error
    first_reading_was_wrong:
      assumed: the module had reserved 'live;v=N' and this framework had taken it
      checked: no live token is parsed anywhere in the module's Go; the live entry
        point delegates to the streaming navigation entry, which serves live deliveries
        under the navigation mode as delta records
      so: the published token names a planned mode the code never reads, and the two
        open questions on the module's own reconnect requirement are the mode spelling
        and whether the body is the navigation delta or a delivery stream
      revised_position: this framework has shipped the feature the module has designed,
        so the useful contribution is an implementation to converge against rather
        than a request for a name
    same_intent: re-request the same page, re-execute the chain, and resume delivering
      to the live regions the client already holds; whole-region state rather than
      increments, so no cursor, no event log, no replay; positional boundary ids reproduced
      by a re-render; navigation supersedes; a version mismatch falls back to a document
    same_two_phase_shape:
      correction: an earlier reading of this entry treated the format change between
        the initial delivery and the reconnect as a divergence; it is not, and both
        sides arrived at it for one reason
      initial: chunked, inside the document response, framed for the HTML parser exactly
        as an async completion is
      reconnect: header-selected and read by script, so the parser framing has nothing
        to trigger and a record is the ordinary shape
      stated_identically_on_both_sides: api:html-boundary-protocol already says past
        the initial document there is no parser reading, which is the module's own
        reason too
    transport_is_not_a_difference_either:
      second_correction: this entry then claimed the module holds the document response
        open while this framework finishes it; that is also wrong, and v0.3.2 checked
        it against the code
      what_the_module_actually_does: a live boundary settles in place through the
        blocking op, so the document response commits first content and finishes,
        and a second connection carries the deliveries
      which_is_this_framework_exactly: the document render takes one delivery per
        live boundary and ends with a terminal marker, then the client opens a separate
        connection
      where_the_misreading_came_from: the module's first-delivery-inline behaviour,
        where a live boundary's first value rides the document render as an await
        completion, was read as the response staying open afterwards
      already_argued_upstream: the module's own live transport decision rejects the
        held-open document response, on the four grounds this framework re-derived
        independently, and now records that a downstream reached them on its own
    what_actually_remains:
      the_token:
        finding: no live token is parsed in any code on either side, and the module's
          shipped runtime sends the navigation token for both the first connection
          and every reconnect
        so: the module's live mode has never had a spelling, and this framework's
          live token names a mode nothing upstream reads
        module_position: filed as a must-priority requirement, whose recommendation
          is a live token rather than the navigation one, because the two differ in
          duration and termination and cannot be routed, timed out, or bounded separately
          while they share a name
        agreement: that recommendation is this framework's existing choice, so convergence
          is likely rather than contested
        remaining_substance: whether a live body carries validators; the module writes
          one per record and this framework deliberately carries none
      control_vocabulary: this framework distinguishes a stream closed because every
        source finished from one closed healthy at a lifetime bound, with a retry
        hint on the latter, plus an open record carrying the build; offered as input
        to the token work rather than as a defect
      backoff: linear and attempt-bounded upstream, exponential with jitter here and
        reset on a healthy close, so a working screen closed at its bound does not
        stall
    documentation_defect:
      what: the guide's mode table published the live token and its availability table
        marked live delivery and reconnection available, while no live token was parsed
        and the requirement still listed the spelling as open
      why_it_matters: this framework built against the published table, which is how
        it arrived at the same token by a route the module did not intend
      resolved: v0.3.2, where both tables now describe what the code does and say
        plainly that the live token is designed and unimplemented on both sides
    ask:
      settle_the_body: decide whether live reconnect reuses the navigation delta body
        or a delivery stream, since that decision is what makes one token mean one
        contract
      take_this_as_input: the control vocabulary, the done-versus-retry distinction,
        and the reset-on-healthy-close backoff are shipped here and are offered rather
        than asserted
      or_reserve_a_space: failing convergence, a documented caller-owned token space,
        or extra modes declared on the options and reported back as a distinct negotiated
        mode
    why_now: a token is a wire contract; settling it after either side ships costs
      a coordinated deploy, which is what the build identity exists to avoid
  client_ownership:
    raised: 2026-08-04, while wiring requirement:reloadable-component-endpoint end
      to end
    priority: highest of this round, because it decides whether the items below are
      asks at all
    what_forced_it:
      the_endpoint_is_this_framework_s: pw mounts the redraw route, owns the reserved
        prefix, owns the registry, and routes every refusal to its own error path
      the_client_is_the_module_s: the browser half builds the redraw URL as prefix
        plus kind plus instance and sends no render mode at all, so the address of
        this framework's own endpoint is decided in a dependency
      effect: moving that endpoint under the page URL, which is what makes it inherit
        the page's authentication rather than needing a protection pattern of its
        own, cannot be done here at all
    what_the_audit_found:
      one_file: the module ships exactly one browser asset; htmlbind ships none, so
        this is the whole surface
      apply_duplicated: the module's half swaps through its own function and references
        neither of this framework's, against what requirement:unified-update-runtime
        records
      live_duplicated: the module implements a live reader, a stream consumer, and
        a reconnect policy speaking the token this framework defined, beside the ones
        already built here
      reach_in: the module reads this framework's live handoff header to decide whether
        a route expects a delivery stream
    positions:
      minimal: make redraw addressing a caller decision, as the action path already
        is, where the caller issues the request and the module only applies what came
        back
      proposed_here: the module supplies no browser code at all and stays with HTML

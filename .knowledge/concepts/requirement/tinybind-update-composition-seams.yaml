    already_designed: the module's own component asset requirement carries the statically
      known required set, the embedded table, and the caller-supplied URL function
    why_it_matters_here: it is what makes the item above solvable without a mid-swap
      fetch, since the document can carry every asset a later delivery might need
    status: unimplemented, and its own hardest property is the one this framework

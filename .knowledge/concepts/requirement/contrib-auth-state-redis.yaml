id: requirement:contrib-auth-state-redis
type: requirement
title: Redis Authentication State Store
summary: authstate/redis implements requirement:contrib-auth-state over Redis or Valkey
  without implementing a Redis protocol client.
facts:
  legacy_body: "authstate/redis implements requirement:contrib-auth-state over Redis\
    \ or Valkey without implementing a Redis protocol client.\n\n```yaml\npackage:\
    \ authstate/redis\ndependency: requirement:contrib-redis-valkey\ntransport: policy:outbound-transport-security\n\
    public_api:\n  - NewStore[T](go-redis UniversalClient, api:auth-state-codec, Options)\n\
    \  - Store[T] implements authstate.Store[T]\noptions:\n  - required bounded key\
    \ prefix and namespace\n  - injectable clock\n  - maximum key and encoded payload\
    \ bytes with hard caps\nrecord: data:auth-state-record\nput:\n  - encode and bound\
    \ payload before network mutation\n  - store version, absolute expiry, and payload\
    \ with SET NX and a ceil-rounded millisecond TTL\n  - false NX result maps to\
    \ ErrAlreadyExists\ntake:\n  - GETDEL atomically consumes one value\n  - missing\
    \ value maps to ErrNotFound\n  - validate record bounds and absolute expiry before\
    \ decode\n  - malformed, expired, or undecodable values remain consumed\nerrors:\n\
    \  - semantic failures map to requirement:contrib-auth-state errors\n  - sanitized\
    \ client and server failures wrap ErrUnavailable\noperations:\n  required:\n \
    \   - SET with NX and PX\n    - GETDEL\n  excluded:\n    - transactions, Pub/Sub,\
    \ Streams, and Redis Cluster redirection logic in the adapter\nsecurity:\n  -\
    \ use decision:local-tls-proxy-boundary outside loopback or the same Pod namespace\n\
    \  - retain Redis ACL or password authentication on the protected local hop when\
    \ configured\n  - never include Redis URLs, keys, or payloads in stable errors\n\
    ```"
  package: authstate/redis
  dependency: requirement:contrib-redis-valkey
  transport: policy:outbound-transport-security
  public_api:
  - NewStore[T](go-redis UniversalClient, api:auth-state-codec, Options)
  - Store[T] implements authstate.Store[T]
  options:
  - required bounded key prefix and namespace
  - injectable clock
  - maximum key and encoded payload bytes with hard caps
  record: data:auth-state-record
  put:
  - encode and bound payload before network mutation
  - store version, absolute expiry, and payload with SET NX and a ceil-rounded millisecond
    TTL
  - false NX result maps to ErrAlreadyExists
  take:
  - GETDEL atomically consumes one value
  - missing value maps to ErrNotFound
  - validate record bounds and absolute expiry before decode
  - malformed, expired, or undecodable values remain consumed
  errors:
  - semantic failures map to requirement:contrib-auth-state errors
  - sanitized client and server failures wrap ErrUnavailable
  operations:
    required:
    - SET with NX and PX
    - GETDEL
    excluded:
    - transactions, Pub/Sub, Streams, and Redis Cluster redirection logic in the adapter
  security:
  - use decision:local-tls-proxy-boundary outside loopback or the same Pod namespace
  - retain Redis ACL or password authentication on the protected local hop when configured
  - never include Redis URLs, keys, or payloads in stable errors
relations:
- relation: mentions
  to: api:auth-state-codec

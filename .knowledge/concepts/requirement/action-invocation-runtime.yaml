    closes: the client stub system:tinybind left open, from the caller's side
    shape: a namespace in the bag decision:component-handler-namespace hands setup,
      holding one async function per action of the route, so a block writes actions.Rename(input)
      and names no URL
    why_the_bag_and_not_an_import:
      the_rsc_shape_is_an_import: client code imports the server function, which the
        JavaScript toolchain then resolves and checks
      blocked_upstream: the script block of system:tinybind v0.5.5 makes a relative
        import specifier a generation error, because an extracted block is served
        from the public URL base rather than from the template's directory
      consequence: an import cannot name a module generated beside the template, so
        the capability has to arrive as a value; the bag is where the instance's other
        capabilities already arrive
    why_nested_under_one_key: the bag also carries the element and the teardown, and
      flattening action names into it would let a handler named el or teardown collide
      with a framework capability
    what_a_call_does:
      request: the same POST requirement:action-invocation-runtime issues for a gesture,
        with the caller's argument as the body, since api:request-binding already
        accepts JSON for the same input struct
      address: the page URL, per decision:action-entry-point-selection, so the path
        parameters a gesture can send are the ones a call sends
      an_update_response: applied exactly as a gesture's is, and the call resolves
        with the outcome
      a_json_response: resolved as the parsed value, which is the shape that makes
        this read like RSC
      a_redirect: followed as a navigation, since the handler decided where the user
        belongs
      in_flight_state: the caller's, because no element was activated and the runtime
        has nothing to mark
    which_actions_are_in_it:
      rule: the route package's, since api:page-action-endpoint publishes exactly
        that package's exported handler-shaped functions
      consequence: a component declared in a shared package has no route and therefore
        an empty namespace, which is correct and has to be documented rather than
        discovered
      the_scope_axis_differs_from_the_lifecycle_one: a script block is per component
        and an action set is per route, so a reusable component cannot reach one
    checking:
      cheap_half: the namespace is generated per route, so only actions that exist
        are in it and a typo is undefined at the call site rather than a request to
        a wrong address
      diagnostic: the runtime reports the name and what the route does publish, which
        is what turns undefined is not a function into an answer
      build_time_half: reading actions.Rename means parsing member expressions, which
        is deeper than the declarations decision:component-handler-namespace already
        asks for; worth having and not worth blocking on
    what_a_typed_action_needs_from_here: nothing, which is the finding that made requirement:typed-server-action
      a generation question alone; this posts JSON and returns a non-update response
      to its caller, and a typed action is exactly that pair with the glue generated
      on the Go side
    grants_nothing_new: every action is a public POST endpoint already, per rule:server-action-authoring,
      so a stub removes a URL an author would otherwise hand-write and moves no authorization
      boundary
    as_built_2026_08_12:
      the_join_nothing_else_held: the generated registry declares which directory
        a route serves and which directory a handler was declared in, and joining
        them is what turns a name into an address; a derived init publishes the join
        per route pattern, the way the reloadable registration is derived
      keyed_on_the_matched_pattern: the render reads http.Request.Pattern, so nothing
        re-resolves a path the router already resolved and a page with no actions
        costs one map lookup
      carried_as_its_own_meta: an inert escaped element beside the runtime configuration
        rather than a field in it, because that value is the module's struct and is
        process-static where this one varies per route
      returns_what_the_handler_wrote: an update response is applied as a gesture's
        is, and anything else is handed back, since the caller asked for it and has
        somewhere to put it
      the_handler_can_tell_the_two_apart:
        asked_for: 2026-08-13, so a form-invoked action and a script-invoked one may
          answer differently
        what_was_already_true: a script call already received JSON, because a response
          that is not an update mode is returned to the caller; what was missing was
          the Go side, where one handler served both callers and had to pick one behaviour
        channel: a second header of this framework's own, sent by a call and by nothing
          else
        not_a_second_mode: the mode still says action, so an update response applies
          to a call exactly as it does to a gesture; what this adds is who is holding
          the answer
        not_the_mode_parameter: system:tinybind documents the field after the semicolon
          as the caller's wire version, and a second meaning there would collide the
          day a caller versions its wire
        surface: pw.WantsValue beside pw.WantsUpdate, so an action handler has three
          branches and a handler asking neither is unchanged
        the_guards_ran_again: the call-pattern test refused the predicate until a
          pattern was registered and a pwfast counterpart existed, which is the third
          time that pair has caught an addition in this feature
        found_by_the_fixture: making Rename branch produced a redirect reading r.URL,
          which the transport analysis refuses; the direct endpoint carries no path
          parameter, so a handler there cannot reconstruct the page it came from and
          a fixed destination is the honest one
      no_in_flight_marking: no element was activated, so the state belongs to the
        caller that started the call
      proved: four harness cases over the request, the JSON body, the argument-free
        call, and the cross-origin refusal, plus the head contribution and the generated
        join in Go
  open_questions:
  - whether an action may ask for a navigation-style diff instead of naming regions,
    which requirement:action-response-update also leaves open
acceptance:
  item-bf511b2e566b47e4:
    text: a bare button carrying server-action performs the mutation and applies what
      the handler returned
  item-425175fdbe0db3bd:
    text: a form carrying server-action posts its fields to the handler and never
      turns into a GET on the current URL
  item-8bd35bd9f27bffd0:
    text: a submit button carrying its own action inside a form selects that handler
      and sends the form's fields
  item-fc7eacf91454db1f:
    text: a 4xx carrying validation regions is applied, and typed text outside the
      rewritten region survives
  item-d10512b3fa9224e5:
    text: an action response that is not an update is not applied as markup
  item-182444c4805f32e2:
    text: a second activation of a busy element performs no second mutation
  item-d4728ba8e93fcc2c:
    text: a failed action on a form falls back to the native submit and a failed action
      on a bare element is reported rather than silently dropped
  item-ab1af567651ea9ca:
    text: a request carries the token from the cookie and is refused after a rotation
      the page did not see
  item-eaee814047bc3625:
    text: a page with the runtime disabled is unchanged, since nothing here is a render-time
      emission

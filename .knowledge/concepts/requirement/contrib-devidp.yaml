id: requirement:contrib-devidp
type: requirement
title: Development OpenID Provider
summary: contrib/devidp is a development-only OpenID Provider that authenticates by
  selecting a user from a TOML roster, giving requirement:contrib-oidc an in-repo
  counterparty without external IdP credentials.
facts:
  legacy_body: "contrib/devidp is a development-only OpenID Provider that authenticates\
    \ by selecting a user from a TOML roster, giving requirement:contrib-oidc an in-repo\
    \ counterparty without external IdP credentials.\n\n```yaml\nauthentication_age:\n\
    \  status: implemented\n  why: a development provider that ignored max_age would\
    \ let the requirement:session-assurance-levels step-up appear to work while proving\
    \ nothing, because auth_time would always read as now\n  provider_session:\n \
    \   added: a cookie-keyed login the provider keeps for itself, distinct from the\
    \ automatic-login shortcut\n    reason: without one, every authorization looked\
    \ like a fresh authentication, so no freshness requirement could be seen to fail\n\
    \    effect: a second authorization is answered from it and carries the earlier\
    \ auth_time, which is what a real provider does and what auth_time exists to report\n\
    \  max_age: refused when malformed, honoured by authenticating again when the\
    \ session is older than it, and satisfied from the session when it is not\n  prompt:\
    \ login and select_account force an interaction, none refuses with login_required\
    \ rather than asking, and an unknown value or none beside another is an invalid_request\n\
    \  auth_time: the time the end user was authenticated, not the time the code was\
    \ issued, which is the defect this replaced\n  end_session: drops the provider\
    \ session and its cookie, so a global sign-out is not silently answered from it\
    \ afterward\npackage: contrib/devidp\nscope: development and test identity provider\
    \ only\nruntime: host Go only, exempt from the policy:contrib-compatibility TinyGo\
    \ matrix per decision:devidp-scope-reduction\norigin: system:oidcld\npublic_api:\n\
    \  - LoadConfig(path) and ParseConfig(source, base) return data:devidp-config\n\
    \  - New(config, options) returns Provider\n  - Start(context, addr, config, options)\
    \ listens on loopback, derives the issuer from the port, and returns Server\n\
    \  - Provider.Handler() returns an http.Handler for the issuer base path\n  -\
    \ Provider.Issuer() and Provider.Endpoint(path) return absolute URLs\n  - Provider.RegisterClient(spec)\
    \ returns generated client credentials for a tool-owned ephemeral client\n  -\
    \ Provider.RegisterPublicDeviceClient(spec) returns a generated client id without\
    \ a secret\n  - Provider.SetLoginUser(subject) and Provider.LoginUser() control\
    \ automatic login\n  - Provider.Users() returns the roster in login-screen order\n\
    \  - Provider.Reload(config) swaps roster and scopes while the issuer, clients,\
    \ and signing key survive\n  - Provider.Close() releases signing keys and pending\
    \ authorization state\nendpoints:\n  - GET /.well-known/openid-configuration\n\
    \  - GET /jwks.json\n  - GET and POST /authorize\n  - POST /token\n  - GET /userinfo\n\
    \  - GET and POST /end_session\n  - GET and POST /login serving ui:devidp-login\n\
    \  - POST /device_authorization\n  - GET and POST /device serving ui:devidp-device-verification\n\
    configuration: data:devidp-config\nflows:\n  - flow:devidp-user-selection\n  -\
    \ flow:oidc-device-authorization\nrequired:\n  - Authorization Code with S256\
    \ PKCE and RFC 8628 device authorization grants\n  - client_secret_basic and client_secret_post\
    \ token authentication for authorization-code and confidential device clients\n\
    \  - registered device clients may be public and authenticate with client_id only\n\
    \  - RS256 signing with the key published at the JWKS endpoint\n  - discovery\
    \ advertises only implemented grants, response types, scopes, claims, and the\
    \ S256 challenge method\n  - discovery issuer exactly equals the configured issuer\
    \ so policy:oidc-security issuer checks pass\n  - exact match of the redirect\
    \ URI against the registered list of the requesting client, except the loopback\
    \ relaxation policy:devidp-safety grants to ephemeral clients\n  - clients declared\
    \ in data:devidp-config and clients registered by the running tool share one validation\
    \ path\n  - the issuer, and therefore every discovery URL, is resolved after the\
    \ listener port is known\n  - authorization codes are single-use, short-lived,\
    \ and bound to client, redirect URI, PKCE challenge, nonce, and subject\n  - nonce\
    \ is echoed into the ID Token whenever the authorization request supplies one\n\
    \  - state is returned unchanged and is never interpreted\n  - granted scope is\
    \ the intersection of the request, the configured valid scopes, and the per-user\
    \ extra scopes\n  - openid, profile, and email claims are mapped from the roster\
    \ entry and repeated by UserInfo\n  - UserInfo requires a Bearer access token\
    \ issued by this provider and returns a matching sub\n  - automatic login mode\
    \ issues the code without rendering ui:devidp-login\n  - RP-initiated logout verifies\
    \ id_token_hint against the provider signing key before ending anything\n  - logout\
    \ revokes the access tokens of that subject and client, so a token cannot outlive\
    \ the session\n  - the post_logout_redirect_uri needs no registration and may\
    \ be any local URL, because requiring one would restore the friction this provider\
    \ exists to remove\n  - a non-local post_logout_redirect_uri is refused, so the\
    \ provider cannot become an open redirect off the machine\n  - loopback matching\
    \ accepts loopback addresses, localhost, and any RFC 6761 name under .localhost\n\
    \  - state is returned unchanged to the post-logout URI\n  - bounded request parsing,\
    \ bounded pending-authorization count, and expiry sweeping\n  - standard OAuth\
    \ and OIDC error responses for every rejection\n  - discovery advertises device_authorization_endpoint\
    \ and the device-code grant\n  - device state, approval, denial, polling, and\
    \ token issuance follow flow:oidc-device-authorization\n  - user-code guessing\
    \ and polling are bounded by policy:device-authorization-security\n  - policy:devidp-safety\
    \ guardrails\ndeferred:\n  - local certificate authority and TLS termination\n\
    \  - reverse proxy, static hosting, and mock APIs\n  - client credentials grant\n\
    \  - EntraID v1 and v2 compatibility modes\n  - refresh tokens and back-channel\
    \ or front-channel logout notification\n  - developer console and MCP surfaces\n\
    \  - public clients outside device authorization, private_key_jwt, and DPoP\n\
    \  - passwords, MFA, consent screens, and account registration\n  - dynamic client\
    \ registration\n  - implicit and hybrid flows\n  - persisted tokens, codes, or\
    \ signing keys\nconsumers:\n  - api:cli-dev\n  - api:testutil-idp\n  - requirement:contrib-oidc\
    \ fixtures under requirement:contrib-acceptance\ndependencies:\n  - requirement:contrib-auth-common\
    \ for crypto/rand secrets, constant-time comparison, and S256 challenge derivation\n\
    \  - system:tinybind minitoml for data:devidp-config parsing\nsigning:\n  location:\
    \ contrib/devidp signs RS256 itself\n  reason: requirement:contrib-jwt signs HS256\
    \ only because RS256 signing waits on the TinyGo matrix, and this host-only provider\
    \ must not widen that surface\n  verification: relying parties verify through\
    \ requirement:contrib-jwt JWKS parsing, which already supports RS256\nstandards:\n\
    \  oidc: https://openid.net/specs/openid-connect-core-1_0-18.html\n  discovery:\
    \ https://openid.net/specs/openid-connect-discovery-1_0.html\n  pkce: https://www.rfc-editor.org/rfc/rfc7636\n\
    \  rp_initiated_logout: https://openid.net/specs/openid-connect-rpinitiated-1_0.html\n\
    \  device_grant: https://www.rfc-editor.org/rfc/rfc8628\n```"
  authentication_age:
    status: implemented
    why: a development provider that ignored max_age would let the requirement:session-assurance-levels
      step-up appear to work while proving nothing, because auth_time would always
      read as now
    provider_session:
      added: a cookie-keyed login the provider keeps for itself, distinct from the
        automatic-login shortcut
      reason: without one, every authorization looked like a fresh authentication,
        so no freshness requirement could be seen to fail
      effect: a second authorization is answered from it and carries the earlier auth_time,
        which is what a real provider does and what auth_time exists to report
    max_age: refused when malformed, honoured by authenticating again when the session
      is older than it, and satisfied from the session when it is not
    prompt: login and select_account force an interaction, none refuses with login_required
      rather than asking, and an unknown value or none beside another is an invalid_request
    auth_time: the time the end user was authenticated, not the time the code was
      issued, which is the defect this replaced
    end_session: drops the provider session and its cookie, so a global sign-out is
      not silently answered from it afterward
  package: contrib/devidp
  scope: development and test identity provider only
  runtime: host Go only, exempt from the policy:contrib-compatibility TinyGo matrix
    per decision:devidp-scope-reduction
  origin: system:oidcld
  public_api:
  - LoadConfig(path) and ParseConfig(source, base) return data:devidp-config
  - New(config, options) returns Provider
  - Start(context, addr, config, options) listens on loopback, derives the issuer
    from the port, and returns Server
  - Provider.Handler() returns an http.Handler for the issuer base path
  - Provider.Issuer() and Provider.Endpoint(path) return absolute URLs
  - Provider.RegisterClient(spec) returns generated client credentials for a tool-owned
    ephemeral client
  - Provider.RegisterPublicDeviceClient(spec) returns a generated client id without
    a secret
  - Provider.SetLoginUser(subject) and Provider.LoginUser() control automatic login
  - Provider.Users() returns the roster in login-screen order
  - Provider.Reload(config) swaps roster and scopes while the issuer, clients, and
    signing key survive
  - Provider.Close() releases signing keys and pending authorization state
  endpoints:
  - GET /.well-known/openid-configuration
  - GET /jwks.json
  - GET and POST /authorize
  - POST /token
  - GET /userinfo
  - GET and POST /end_session
  - GET and POST /login serving ui:devidp-login
  - POST /device_authorization
  - GET and POST /device serving ui:devidp-device-verification
  configuration: data:devidp-config
  flows:
  - flow:devidp-user-selection
  - flow:oidc-device-authorization
  required:
  - Authorization Code with S256 PKCE and RFC 8628 device authorization grants
  - client_secret_basic and client_secret_post token authentication for authorization-code
    and confidential device clients
  - registered device clients may be public and authenticate with client_id only
  - RS256 signing with the key published at the JWKS endpoint
  - discovery advertises only implemented grants, response types, scopes, claims,
    and the S256 challenge method
  - discovery issuer exactly equals the configured issuer so policy:oidc-security
    issuer checks pass
  - exact match of the redirect URI against the registered list of the requesting
    client, except the loopback relaxation policy:devidp-safety grants to ephemeral
    clients
  - clients declared in data:devidp-config and clients registered by the running tool
    share one validation path
  - the issuer, and therefore every discovery URL, is resolved after the listener
    port is known
  - authorization codes are single-use, short-lived, and bound to client, redirect
    URI, PKCE challenge, nonce, and subject
  - nonce is echoed into the ID Token whenever the authorization request supplies
    one
  - state is returned unchanged and is never interpreted
  - granted scope is the intersection of the request, the configured valid scopes,
    and the per-user extra scopes
  - openid, profile, and email claims are mapped from the roster entry and repeated
    by UserInfo
  - UserInfo requires a Bearer access token issued by this provider and returns a
    matching sub
  - automatic login mode issues the code without rendering ui:devidp-login
  - RP-initiated logout verifies id_token_hint against the provider signing key before
    ending anything
  - logout revokes the access tokens of that subject and client, so a token cannot
    outlive the session
  - the post_logout_redirect_uri needs no registration and may be any local URL, because
    requiring one would restore the friction this provider exists to remove
  - a non-local post_logout_redirect_uri is refused, so the provider cannot become
    an open redirect off the machine
  - loopback matching accepts loopback addresses, localhost, and any RFC 6761 name
    under .localhost
  - state is returned unchanged to the post-logout URI
  - bounded request parsing, bounded pending-authorization count, and expiry sweeping
  - standard OAuth and OIDC error responses for every rejection
  - discovery advertises device_authorization_endpoint and the device-code grant
  - device state, approval, denial, polling, and token issuance follow flow:oidc-device-authorization
  - user-code guessing and polling are bounded by policy:device-authorization-security
  - policy:devidp-safety guardrails
  deferred:
  - local certificate authority and TLS termination
  - reverse proxy, static hosting, and mock APIs
  - client credentials grant
  - EntraID v1 and v2 compatibility modes
  - refresh tokens and back-channel or front-channel logout notification
  - developer console and MCP surfaces
  - public clients outside device authorization, private_key_jwt, and DPoP
  - passwords, MFA, consent screens, and account registration
  - dynamic client registration
  - implicit and hybrid flows
  - persisted tokens, codes, or signing keys
  consumers:
  - api:cli-dev
  - api:testutil-idp
  - requirement:contrib-oidc fixtures under requirement:contrib-acceptance
  dependencies:
  - requirement:contrib-auth-common for crypto/rand secrets, constant-time comparison,
    and S256 challenge derivation
  - system:tinybind minitoml for data:devidp-config parsing
  signing:
    location: contrib/devidp signs RS256 itself
    reason: requirement:contrib-jwt signs HS256 only because RS256 signing waits on
      the TinyGo matrix, and this host-only provider must not widen that surface
    verification: relying parties verify through requirement:contrib-jwt JWKS parsing,
      which already supports RS256
  standards:
    oidc: https://openid.net/specs/openid-connect-core-1_0-18.html
    discovery: https://openid.net/specs/openid-connect-discovery-1_0.html
    pkce: https://www.rfc-editor.org/rfc/rfc7636
    rp_initiated_logout: https://openid.net/specs/openid-connect-rpinitiated-1_0.html
    device_grant: https://www.rfc-editor.org/rfc/rfc8628

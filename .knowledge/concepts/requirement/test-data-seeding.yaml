id: requirement:test-data-seeding
type: requirement
title: Test Data Seeding and Comparison
summary: Popcorn Web provides one dataset format that seeds a database from the CLI
  and from unit tests and also serves as the expected result for database assertions.
facts:
  legacy_body: "Popcorn Web provides one dataset format that seeds a database from\
    \ the CLI and from unit tests and also serves as the expected result for database\
    \ assertions.\n\n```yaml\ngoals:\n  - remove handwritten INSERT fixtures from\
    \ tests and development bootstrap\n  - keep one dataset definition shared by api:cli-seed\
    \ and api:test-seed\n  - make database state assertable without hand-rolled SELECT\
    \ comparison\n  - keep the framework module free of CGo and extra SQL driver dependencies\n\
    scope:\n  dataset: data:seed-dataset\n  cli: api:cli-seed\n  test: api:test-seed\n\
    \  engine: system:dbtestify through decision:dbtestify-integration\n  other_store:\
    \ requirement:dynamodb-test-data reuses the dataset format and the two surfaces\
    \ with an executor of its own, because system:dbtestify speaks database/sql\n\
    constraints:\n  - decision:config-driven-database keeps pool ownership with the\
    \ framework\n  - decision:sqlite-backend-selection keeps the sqlite driver in\
    \ system:tinygodriver\n  - decision:server-sql-support-tier bounds which databases\
    \ are supported\n  - requirement:database-migration stays the only owner of schema\
    \ creation\n  - concept:public-package-boundaries keeps seeding out of the request\
    \ path\nacceptance:\n  - pw seed applies a named dataset to the configured database\
    \ and exits nonzero on failure\n  - pw seed with no argument applies every dataset\
    \ in lexical order\n  - pw seed fails clearly when middleware.rdb.enabled is false\n\
    \  - TestRun with WithMigrations and WithSeed starts with schema installed then\
    \ rows loaded\n  - Server.Seed reloads a dataset mid-test\n  - Server.AssertDB\
    \ passes on matching state and reports a per-table diff through Errorf on mismatch\n\
    \  - decision:testutil-testing-interface TestingT gains Errorf and existing *testing.T\
    \ callers still compile\n  - AssertDB honors exact and sub match strategies and\
    \ the any, null, notnull, regexp, and currentdate matchers\n  - a dataset file\
    \ works unchanged as both seed input and expected result\n  - the framework module\
    \ builds with CGO_ENABLED=0\n  - no test opens a second pool against the api:test-run\
    \ database\n  - Seed and AssertDB under WithTransaction see the test transaction\
    \ and leave nothing committed\nnon_goals:\n  - schema migration or version history\n\
    \  - production data loading\n  - dataset generation from a live database\n  -\
    \ the dbtestify HTTP API and standalone CLI\n```"
  goals:
  - remove handwritten INSERT fixtures from tests and development bootstrap
  - keep one dataset definition shared by api:cli-seed and api:test-seed
  - make database state assertable without hand-rolled SELECT comparison
  - keep the framework module free of CGo and extra SQL driver dependencies
  scope:
    dataset: data:seed-dataset
    cli: api:cli-seed
    test: api:test-seed
    engine: system:dbtestify through decision:dbtestify-integration
    other_store: requirement:dynamodb-test-data reuses the dataset format and the
      two surfaces with an executor of its own, because system:dbtestify speaks database/sql
  constraints:
  - decision:config-driven-database keeps pool ownership with the framework
  - decision:sqlite-backend-selection keeps the sqlite driver in system:tinygodriver
  - decision:server-sql-support-tier bounds which databases are supported
  - requirement:database-migration stays the only owner of schema creation
  - concept:public-package-boundaries keeps seeding out of the request path
  acceptance:
  - pw seed applies a named dataset to the configured database and exits nonzero on
    failure
  - pw seed with no argument applies every dataset in lexical order
  - pw seed fails clearly when middleware.rdb.enabled is false
  - TestRun with WithMigrations and WithSeed starts with schema installed then rows
    loaded
  - Server.Seed reloads a dataset mid-test
  - Server.AssertDB passes on matching state and reports a per-table diff through
    Errorf on mismatch
  - decision:testutil-testing-interface TestingT gains Errorf and existing *testing.T
    callers still compile
  - AssertDB honors exact and sub match strategies and the any, null, notnull, regexp,
    and currentdate matchers
  - a dataset file works unchanged as both seed input and expected result
  - the framework module builds with CGO_ENABLED=0
  - no test opens a second pool against the api:test-run database
  - Seed and AssertDB under WithTransaction see the test transaction and leave nothing
    committed
  non_goals:
  - schema migration or version history
  - production data loading
  - dataset generation from a live database
  - the dbtestify HTTP API and standalone CLI

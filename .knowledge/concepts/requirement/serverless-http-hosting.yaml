id: requirement:serverless-http-hosting
type: requirement
title: Serverless HTTP Hosting
summary: One Popcorn Web application binary for either backend runs unchanged on scale-to-zero
  HTTP container services and HTTP-forwarding function hosts.
facts:
  legacy_body: "One Popcorn Web application binary for either backend runs unchanged\
    \ on scale-to-zero HTTP container services and HTTP-forwarding function hosts.\n\
    \n```yaml\nruntime_contract:\n  ordinary_container: data:server-runtime-config\
    \ PORT\n  aws_lambda_web_adapter: AWS_LWA_PORT, falling back in the adapter and\
    \ application to PORT then 8080\n  azure_functions_custom_handler: FUNCTIONS_CUSTOMHANDLER_PORT\n\
    resolution:\n  priority:\n    - FUNCTIONS_CUSTOMHANDLER_PORT\n    - AWS_LWA_PORT\n\
    \    - data:server-runtime-config port after PORT binding\n  validation: a special\
    \ assignment must be a decimal integer from 1 through 65535; invalid input refuses\
    \ startup and names the variable\ndeployment:\n  aws_lambda:\n    adapter: AWS\
    \ Lambda Web Adapter in an extension layer or container image\n    application_change:\
    \ none\n    excludes: a framework-owned Lambda Runtime API client\n  azure_functions:\n\
    \    adapter: custom handler with HTTP request forwarding enabled\n    application_change:\
    \ none\n    scope: HTTP trigger and output only; bindings using the custom payload\
    \ need a separate adapter\n  cloud_run_app_runner_container_apps:\n    adapter:\
    \ none; policy:container-runtime-image already satisfies the assigned-port process\
    \ contract\nsource_function_boundary:\n  vercel_go: exported Handler generated\
    \ by requirement:serverless-source-entrypoints\n  cloud_run_functions: Functions\
    \ Framework registration generated by requirement:serverless-source-entrypoints\n\
    \  distinction: both remote-build source with no application main and therefore\
    \ need a generated entry point, not a listener environment alias\nnon_goals:\n\
    \  - creating provider resources, uploading artifacts, setting domains, or storing\
    \ credentials\n  - non-HTTP event triggers\n  - DigitalOcean/OpenWhisk event functions\n\
    \  - Fastly Compute or another component-model edge-Wasm host before decision:wasi-http-deferred\
    \ is reopened\nacceptance:\n  - an ordinary process with neither special variable\
    \ keeps its configured port\n  - each special variable selects its assigned port\
    \ without changing application source\n  - an invalid special port fails before\
    \ database and telemetry initialization\n  - decision:serverless-target-scope\
    \ is the authoritative initial provider list\n  - the deployment guide classifies\
    \ shipped, committed, blocked, and deferred hosts\nbackend_parity:\n  nethttp:\
    \ pw.Run resolves the assigned listener port\n  fasthttp: pwfast.Run resolves\
    \ the same assigned listener port through pwconfig.HostingPort\n  source_functions:\
    \ requirement:serverless-source-entrypoints owns the exported net/http boundary\n\
    ```"
  runtime_contract:
    ordinary_container: data:server-runtime-config PORT
    aws_lambda_web_adapter: AWS_LWA_PORT, falling back in the adapter and application
      to PORT then 8080
    azure_functions_custom_handler: FUNCTIONS_CUSTOMHANDLER_PORT
  resolution:
    priority:
    - FUNCTIONS_CUSTOMHANDLER_PORT
    - AWS_LWA_PORT
    - data:server-runtime-config port after PORT binding
    validation: a special assignment must be a decimal integer from 1 through 65535;
      invalid input refuses startup and names the variable
  deployment:
    aws_lambda:
      adapter: AWS Lambda Web Adapter in an extension layer or container image
      application_change: none
      excludes: a framework-owned Lambda Runtime API client
    azure_functions:
      adapter: custom handler with HTTP request forwarding enabled
      application_change: none
      scope: HTTP trigger and output only; bindings using the custom payload need
        a separate adapter
    cloud_run_app_runner_container_apps:
      adapter: none; policy:container-runtime-image already satisfies the assigned-port
        process contract
  source_function_boundary:
    vercel_go: exported Handler generated by requirement:serverless-source-entrypoints
    cloud_run_functions: Functions Framework registration generated by requirement:serverless-source-entrypoints
    distinction: both remote-build source with no application main and therefore need
      a generated entry point, not a listener environment alias
  non_goals:
  - creating provider resources, uploading artifacts, setting domains, or storing
    credentials
  - non-HTTP event triggers
  - DigitalOcean/OpenWhisk event functions
  - Fastly Compute or another component-model edge-Wasm host before decision:wasi-http-deferred
    is reopened
  acceptance:
  - an ordinary process with neither special variable keeps its configured port
  - each special variable selects its assigned port without changing application source
  - an invalid special port fails before database and telemetry initialization
  - decision:serverless-target-scope is the authoritative initial provider list
  - the deployment guide classifies shipped, committed, blocked, and deferred hosts
  backend_parity:
    nethttp: pw.Run resolves the assigned listener port
    fasthttp: pwfast.Run resolves the same assigned listener port through pwconfig.HostingPort
    source_functions: requirement:serverless-source-entrypoints owns the exported
      net/http boundary
acceptance:
  item-f699334bc48c2b69:
    text: an ordinary process with neither special variable keeps its configured port
  item-0719f3155b918df9:
    text: each special variable selects its assigned port without changing application
      source
  item-64e6a0757bfb7769:
    text: an invalid special port fails before database and telemetry initialization
  item-4a287b25bcb9ef1b:
    text: decision:serverless-target-scope is the authoritative initial provider list
  item-ee4f8030d57b0e4c:
    text: the deployment guide classifies shipped, committed, blocked, and deferred
      hosts

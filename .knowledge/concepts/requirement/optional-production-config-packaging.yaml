id: requirement:optional-production-config-packaging
type: requirement
title: Optional Production Configuration in Deployment Packaging
summary: Deployment packaging must honor configured public asset locations and allow an application configured entirely
  by environment variables to omit config.prod.toml.
authority: authored
lifecycle: accepted
review_state: confirmed
facts:
  origin:
    request: concept:bdf-printmanager-integration
    source: source:bdf-printmanager-request
    section: 'Ask 3 (lower priority): packaging that follows Ask 1'
  requester_priority: lower than Ask 1 and Ask 2
  implementation_status: Implemented and verified in this repository; no BDF deployment is claimed.
  reported_blocker: pw build --target=lambda requires root public.go during asset generation and config.prod.toml
    during packaging.
  application_configuration: BDF Print Manager uses MANAGER_* and platform AWS_* environment variables without config.prod.toml.
  allowed_designs:
  - Treat an absent config.prod.toml as optional.
  - Use an explicit declaration such as deploy.config_file = false.
  artifact_contract: When no production config is carried, the Lambda Dockerfile omits COPY of config.prod.toml;
    include it normally when configured and present.
  requester_migration: BDF can remove cmd/printmanager/deploy/lambda/Dockerfile once the framework packages this
    application.
  implementation_report: docs/requests/bdf-printmanager-implementation.md

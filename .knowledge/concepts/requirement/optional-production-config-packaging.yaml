open_questions:
  production-config-policy:
    text: Is missing config.prod.toml sufficient, or is deploy.config_file = false required?
    state: answered
    resolution: An absent config.prod.toml is sufficient; no opt-out flag is required. Copy it when present and
      omit its Dockerfile COPY when absent. Source stages preserve the selected cmd subtree and relocate a main-local
      embed tree with the transformed entrypoint.

constraints:
- Never fall back to the authored input tree.
- Keep existing mount and path-security rules.
open_questions:
  fallback-policy:
    text: Adopt the requester’s preferred embedded fallback plus startup diagnostic, or the accepted strict-startup
      alternative?
    state: answered
    resolution: Adopt embedded fallback on ordinary misses plus one startup diagnostic for a missing tree. Keep
      security rejections as refusals. An initial pw dev asset-build failure exits with its reported error.

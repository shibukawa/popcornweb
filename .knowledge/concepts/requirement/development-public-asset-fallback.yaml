id: requirement:development-public-asset-fallback
type: requirement
title: Development Public Asset Fallback
summary: A development public mount must serve an explicitly registered embedded asset on an ordinary derived-tree
  miss, or make the unavailable mount a visible startup failure.
authority: authored
lifecycle: accepted
review_state: confirmed
facts:
  origin:
    request: concept:bdf-printmanager-integration
    source: source:bdf-printmanager-request
    section: 'Ask 2: a development mount that does not go silently empty'
  requester_priority: secondary; requester prefers fallback plus a diagnostic
  implementation_status: Implemented and verified in this repository; no BDF deployment is claimed.
  reported_trigger: Under pwdev a missing dist/public or local file produces 404 even when pw.WithPublicFS provides
    that file.
  preferred_behavior:
  - Try the configured derived tree first.
  - On an ordinary miss, fall back to the filesystem explicitly supplied by pw.WithPublicFS or registered by the
    application.
  - Report a missing derived tree once at startup; indicate fallback/stale embedded bytes when relevant.
  accepted_alternative: If fallback is not chosen, pw dev must fail nonzero on the asset-build failure or expose
    it as an error, and the application must explicitly report that the public mount has no usable tree.
  staleness_tradeoff: Embedded fallback may be one build stale; the requester accepts this in preference to an unexplained
    empty mount.
  existing_conflict: 'Resolved: derived-tree-development now allows embedded fallback for ordinary misses; the older
    authored-tree development decision is superseded.'
  implementation_report: docs/requests/bdf-printmanager-implementation.md

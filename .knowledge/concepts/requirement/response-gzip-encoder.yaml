id: requirement:response-gzip-encoder
type: requirement
title: Gzip Response Encoder
summary: The gzip half of policy:response-content-encoding selects an optimized host
  encoder or the standard library one behind a single response-writer interface, mirroring
  how requirement:contrib-zstd splits.
facts:
  legacy_body: "The gzip half of policy:response-content-encoding selects an optimized\
    \ host encoder or the standard library one behind a single response-writer interface,\
    \ mirroring how requirement:contrib-zstd splits.\n\n```yaml\nimplementation_selection:\n\
    \  host_go:\n    condition: \"!tinygo && !force_tinygo_logic\"\n    backend: github.com/klauspost/compress/gzip\n\
    \    level: 1\n    already_a_dependency: true, through the host backend of requirement:contrib-zstd,\
    \ so the coding adds 148 KB and no module\n  tinygo:\n    condition: \"tinygo\
    \ || force_tinygo_logic\"\n    backend: compress/gzip\n    level: 1\n    reason:\
    \ pure Go with no assembly path to validate, and it compiles for wasip1 today\n\
    \  force_policy: decision:force-tinygo-logic\nlevel_is_1_because:\n  - a dynamic\
    \ body is encoded while a request waits, so throughput is the scarce resource\
    \ and ratio is the one that can give\n  - level 1 is the fastest level that still\
    \ compresses, at 464 MB/s on the host and 309 on TinyGo against 60.9 percent for\
    \ Huffman-only\n  - it costs 3.3 points of ratio against level 6 and returns a\
    \ third to two thirds more throughput, per the gzip_level_curve of decision:response-content-codings\n\
    \  - on the standard library it is not a judgment call: only level 1 uses the\
    \ fast encoder, and level 2 is already half the speed for 1.7 points\n  - one\
    \ level on both backends means a response does not change size when a target changes,\
    \ so a test asserting encoded bytes holds across builds\n  - the deep levels are\
    \ not lost; policy:public-asset-precompression takes them where the cost lands\
    \ on the build\nwhy_not_one_backend:\n  stdlib_on_the_host: 1.5 times slower than\
    \ klauspost at level 1, per decision:response-content-codings\n  klauspost_on_tinygo:\
    \ carries architecture-specific assembly with pure-Go fallbacks, so it is a validation\
    \ cost for a target where the standard library already works\nrequired_of_both:\n\
    \  - construction writes nothing to the destination, per the lazy_frame_header\
    \ rule of requirement:contrib-zstd; both gzip backends defer their header to the\
    \ first Write already\n  - Write, Flush, Close, and an Abort that discards an\
    \ uncommitted frame\n  - Flush emits everything written so far as complete blocks\
    \ and leaves the stream open, which is the compress/flate sync-flush shape requirement:contrib-zstd\
    \ was already specified against\n  - Flush does not flush the destination writer;\
    \ the caller chains that\n  - Flush after Close is an error\n  - identical public\
    \ lifecycle and errors across backends, so the negotiation path branches on neither\n\
    pooling:\n  host: reset and reuse through sync.Pool, as the zstd encoder already\
    \ does, which makes steady-state per-request allocation zero\n  tinygo: an encoder\
    \ is allocated per response; whether pooling helps depends on the target allocator\
    \ and is not assumed\nshared_shape:\n  - one interface covers zstd and gzip, so\
    \ policy:response-content-encoding holds a coding token and a constructor rather\
    \ than a type per coding\n  - a coding named in configuration but absent from\
    \ this framework is reported as unsupported instead of failing to compile the\
    \ negotiation, which is what catches brotli in the list\nbuild_tag:\n  retired:\
    \ pw_nogzip and pw_nozstd were removed once the zstd encoder became its own package;\
    \ see decision:response-encoders-are-unconditional\n  what_replaced_it: middleware.compression,\
    \ which is the same saving at run time and does not fork the build\nopen_questions:\n\
    \  - the per-writer memory of the TinyGo encoder, which level 1 settles on speed\
    \ but not on footprint; a constrained target may still want a smaller window than\
    \ the standard library's fixed one, and that is a measurement nobody has taken\n\
    references:\n  - https://www.rfc-editor.org/rfc/rfc1952\n```"
  implementation_selection:
    host_go:
      condition: '!tinygo && !force_tinygo_logic'
      backend: github.com/klauspost/compress/gzip
      level: 1
      already_a_dependency: true, through the host backend of requirement:contrib-zstd,
        so the coding adds 148 KB and no module
    tinygo:
      condition: tinygo || force_tinygo_logic
      backend: compress/gzip
      level: 1
      reason: pure Go with no assembly path to validate, and it compiles for wasip1
        today
    force_policy: decision:force-tinygo-logic
  level_is_1_because:
  - a dynamic body is encoded while a request waits, so throughput is the scarce resource
    and ratio is the one that can give
  - level 1 is the fastest level that still compresses, at 464 MB/s on the host and
    309 on TinyGo against 60.9 percent for Huffman-only
  - it costs 3.3 points of ratio against level 6 and returns a third to two thirds
    more throughput, per the gzip_level_curve of decision:response-content-codings
  - on the standard library it is not a judgment call: only level 1 uses the fast
      encoder, and level 2 is already half the speed for 1.7 points
  - one level on both backends means a response does not change size when a target
    changes, so a test asserting encoded bytes holds across builds
  - the deep levels are not lost; policy:public-asset-precompression takes them where
    the cost lands on the build
  why_not_one_backend:
    stdlib_on_the_host: 1.5 times slower than klauspost at level 1, per decision:response-content-codings
    klauspost_on_tinygo: carries architecture-specific assembly with pure-Go fallbacks,
      so it is a validation cost for a target where the standard library already works
  required_of_both:
  - construction writes nothing to the destination, per the lazy_frame_header rule
    of requirement:contrib-zstd; both gzip backends defer their header to the first
    Write already
  - Write, Flush, Close, and an Abort that discards an uncommitted frame
  - Flush emits everything written so far as complete blocks and leaves the stream
    open, which is the compress/flate sync-flush shape requirement:contrib-zstd was
    already specified against
  - Flush does not flush the destination writer; the caller chains that
  - Flush after Close is an error
  - identical public lifecycle and errors across backends, so the negotiation path
    branches on neither
  pooling:
    host: reset and reuse through sync.Pool, as the zstd encoder already does, which
      makes steady-state per-request allocation zero
    tinygo: an encoder is allocated per response; whether pooling helps depends on
      the target allocator and is not assumed
  shared_shape:
  - one interface covers zstd and gzip, so policy:response-content-encoding holds
    a coding token and a constructor rather than a type per coding
  - a coding named in configuration but absent from this framework is reported as
    unsupported instead of failing to compile the negotiation, which is what catches
    brotli in the list
  build_tag:
    retired: pw_nogzip and pw_nozstd were removed once the zstd encoder became its
      own package; see decision:response-encoders-are-unconditional
    what_replaced_it: middleware.compression, which is the same saving at run time
      and does not fork the build
  open_questions:
  - the per-writer memory of the TinyGo encoder, which level 1 settles on speed but
    not on footprint; a constrained target may still want a smaller window than the
    standard library's fixed one, and that is a measurement nobody has taken
  references:
  - https://www.rfc-editor.org/rfc/rfc1952
open_questions:
  item-008b1a95f8f3ab2c:
    text: the per-writer memory of the TinyGo encoder, which level 1 settles on speed
      but not on footprint; a constrained target may still want a smaller window than
      the standard library's fixed one, and that is a measurement nobody has taken

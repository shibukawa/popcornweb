      what_is_worth_doing_instead: documenting the upgrade hazard where a project
        adopts a form action, since the panic is legible and the surprise is only
        that generation added a registration
    csrf_field_name_is_not_forwarded:
      fact: CSRFFieldName and CSRFMode are templates/htmlbind options and routetree
        forwards neither, so a page tree always emits _csrf and always emits it
      bites_us_when: a project configures another field name, which policy:csrf-protection
        permits while recommending the module default
      answer: refuse a configured field name that is not the module default in a page-tree
        project, naming this as the reason, rather than emitting a token the middleware

        declared a counterpart, which is exactly what requirement:pw-call-registration
        was written to do
    the_attribute_prefix_was_the_real_question:
      found: UpdateAttributePrefix is tb, deliberately, while PageActionAttr was already
        data-pw-action, so the document already held two spellings before this feature
        added two more
      the_stated_reason_was_stale: it said routetree did not thread the prefix, and
        pwAttributePrefix already records that v0.5.6 closed that and both paths pass
        the value
      chosen: all three behaviour attributes derive from the one prefix, which moves
        PageActionAttr to data-tb-action
      why: the runtime builds every attribute name it reads from one configured value,
        and branding these three would have needed a second constant in the JavaScript
        to find half of them
      what_it_leaves_open: whether that prefix becomes this framework's brand, which
        is a decision the tree already records as available and which now moves all
        four attributes together
    the_page_post_is_not_in_the_route_table:
      found: the generated registry registers POST on the page pattern, and Routes
        lists only the GETs while Actions lists only the direct endpoints
      consequence: PW0201 exists and cannot see this collision, because the pattern
        that panics is registered and published nowhere
      so: the collision check is blocked on the route table carrying it, which is
        an upstream ask rather than work here
    a_malformed_csrf_secret_fails_exactly_like_an_absent_one:
      found: the token derivation decodes the secret and yields nothing when it cannot,
        so a placeholder secret produces the same ErrNoCSRFToken and the same opaque
        500
      where_it_bit: the page tree fixture, which needed a minted secret rather than
        any string
      worth_stating: the failure a page author meets is a 500 saying internal error,
        with the reason in the log only, which is the diagnosis gap this requirement
        should close next
    runtime_interception:
      built: the submit path takes a form naming a server function ahead of the navigation
        rules, and the click path takes an element no submit event covers
      body: the form's fields plus the pressed button's own pair, and nothing at all
        for a bare element
      in_flight: the element is marked aria-busy and a second activation is ignored
        rather than queued, which is the redraw supersession rule inverted because
        a mutation is not idempotent
      failure: a reload rather than a resubmit, because nothing can tell a request
        that never arrived from one whose answer was unusable, and resubmitting would
        perform the mutation twice
      covered: six cases in the conformance harness, including that a plain GET form
        is still the search form it was
    the_parser_as_built:
      where: internal/pwscript, a scanner rather than a parser
      what_it_skips: a string, a template literal including its interpolations, a
        line and block comment, and a regular expression literal, which are the four
        things a pattern match reads wrong; a slash is division or a literal depending
        on the token before it, and reading that wrong swallows the rest of a file
      what_it_reads: a top-level setup, the parameter names nested under one key in
        its pattern, and the keys of an object literal returned at the function's
        own top level
      what_it_declines: a returned variable, a spread, a nested return, and the bag
        taken whole under one name, each of which leaves the component unchecked rather
        than half-published
      the_declining_is_the_design: decision:component-handler-namespace records checking
        as total for the idiomatic shape and partial in general, and a scanner that
        guessed would publish a handler that does not exist
      wired_at: the routetree ScriptResolver, which refuses a referenced name the
        block does not return and supplies the reason, while the module supplies the
        position
      proved: a typo in the fixture fails generation naming the file, line, column,
        component, the name, and the reason
      unwalkable_is_different_from_unread: a block whose quoting never closes is an
        error, because that is not this scanner's limit and the browser meets the
        same source next
    the_signature_migration_and_the_binding:
      built: setup takes one destructured object carrying el, teardown, onSignal and
        props, and returns the handlers the markup may name
      the_break_was_loud_as_designed: the signal harness failed at once on the fixture
        still taking positional arguments, which is the property that made a compatibility
        shim unnecessary and impossible in the same breath
      ordering: a descendant's setup waits for its ancestors to settle and not for
        its siblings, so an await that never settles stalls its own subtree rather
        than every remaining component on the page
      binding: after setup returns, the mounted subtree is scanned once and a listener
        added per declared pair; nothing is recorded for release, because a listener
        on a node dies with the node and these sit on the nodes a swap destroys
      props: parsed from the emitted attribute, empty rather than absent when unreadable
        so a destructuring reads undefined instead of throwing
      migrated: two harness fixtures, the page tree fixture, the live_render example
        and its regenerated asset, and eight documentation pages in both locales
    the_csrf_field_name_check:
      built: a startup refusal when the configured field name is not the one generated
        forms carry
      why_startup: generation never takes the setting, so the failure it replaces
        is a 403 on every submission with the reason in the log only, which reads
        as a broken request rather than as a setting
    documentation:
      added: a server actions guide in both locales, covering which element to choose,
        what the handler owes, the two entry points and what each carries, the CSRF
        posture, and the POST registration
      corrected: the interactivity overview said intercepting the click was still
        the application's, which the runtime interception made false, and the template
        syntax reference described the bare-element lowering as the only one
      the_recommendation_it_lands: put a server action on a form, because a bare button
        loses the no-script path and posts to a constant address carrying no path
        parameters
    what_is_not_done:
      the_post_collision_check: withdrawn rather than blocked; the panic already names
        both sites, and analysis excludes the generated registry by design
      none_of_this_framework_s: the actions namespace landed 2026-08-12, which was
        the last item that was ours
      a_form_action_needs_csrf_turned_on_and_the_scaffold_does_not_always_turn_it_on:
        chain: generation writes the hidden field because the form is unsafe, the
          render needs a token to fill it, the token comes from a secret, and the
          secret is minted by the CSRF middleware alone
        so: with security.csrf.enabled false, which is the shipped default, every
          render of a page declaring a form action fails
        verified: the page tree fixture answered 500 until its requests carried a
          secret, and setupCSRF returns no middleware at all when the setting is off
        the_scaffold_gap: securityRuntimeConfig writes the whole security section
          only for a project serving a browser login, so a page-tree project with
          no login, and a JWT-only one, are scaffolded into exactly that state
        derived_not_run: the scaffold path was read rather than exercised; what was
          exercised is the render behaviour a project in that state gets
        why_it_is_new: before v0.5.8 a form carrying server-action emitted no token
          field, so it needed no token; adopting the feature is what makes a working
          page fail
        what_the_author_sees: a 500 whose body says internal error, because sanitizedProblem
          strips the cause from every 5xx, which is right in general and wrong for
          a configuration mistake reported through the same channel
        built_2026_08_12: the render supplies the module's explicit no-token option
          when the configuration says the check is off, so the form renders unprotected
          because that is what the deployment asked for
        the_distinction_that_makes_it_safe:
          check_on_and_no_secret: still a failed render; no session, or a store that
            failed, and rendering an unprotected form would hide it
          check_off: renders, because the choice is in the configuration and this
            render is reading it
          why_it_does_not_contradict_module_native_csrf: what that requirement refuses
            is treating an absent token as none wanted, which turns a forgotten option
            into an unprotected form nobody chose; the setting is not a forgotten
            option
          the_tests_could_not_tell_them_apart: a bare context reads the zero SecurityConfig
            where the check is off, so a case meaning no session was also saying no
            protection wanted, and both now say which they are
        what_it_leaves: the hidden field is still emitted and empty, because the generation-time
          mode is not threaded into a page tree's compile; removing it is an upstream
          ask the module has already offered
        why_not_take_that_ask_first:
          coupling: the mode is decided at generation and the setting is read at runtime,
            so a build with the mode off deployed with the check on would emit forms
            carrying no token and have every submission refused
          worse_than_today: that fails at submit rather than at render, and the form
            looks correct while it happens
          so: threading the mode needs a startup guard comparing the two, where reading
            one runtime value at render time needs none
        scaffold_closed_2026_08_12:
          was: the security section was written for a browser login and nothing else,
            on the ground that a project with no session has nothing to bind a token
            to
          why_that_was_already_untrue: sessionRuntimeConfig writes session.enabled
            unconditionally and says why, that session storage is not a login, so
            a page-tree project was scaffolded able to hold a secret and configured
            not to
          now: the section is written for a page tree as well, and the comment it
            emits names the unsafe route that project actually ships rather than the
            general case
        rejected: minting a secret regardless of the setting, which would emit a token
          nothing verifies and make the form look protected when the deployment turned
          protection off
        also_required_and_not_only_the_check: sessions, since the secret is a session
          slot and pwsession.Setup returns nothing when session.enabled is false,
          so csrf.enabled alone is not sufficient
  sequencing:
    first: the version bump and the attribute names, since they change generated bytes
      and nothing else works until the markup is this framework's
    second: the two checks, because both fail a build rather than a request and are
      cheap
    third: the runtime interception, which is what makes a server action perform its
      mutation
    fourth: the parser and the handler binding, which are one feature and the largest
      piece
  acceptance:
  - a form carrying server-action reaches its handler with scripting disabled, and
    is never submitted as a GET
  - the same form is intercepted by the runtime and its response applied
  - a bare button posts to its direct endpoint and never to the page URL
  - a page whose template declares a form action and whose application registers POST
    at the same path fails a check rather than panicking at startup
  - a project configuring a non-default CSRF field name in a page tree fails with
    that reason named
  - every attribute this framework's runtime reads carries this framework's prefix
  - a component declaring a script block reports its parameters, and only the destructured
    ones reach the DOM
  - a project declaring no script block and no server action regenerates byte-identical
    output

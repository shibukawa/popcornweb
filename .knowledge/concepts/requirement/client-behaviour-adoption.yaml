    defaults: data-tb-action, data-tb-on, data-tb-props, _action, _csrf
    parity: fasthttpbind carries its own action dispatch, so requirement:alternate-http-backend-readiness
      is not regressed by adopting this
  what_upstream_answered_differently_and_better:
    no_action_attribute: the form carries method=post and no action at all, so a native

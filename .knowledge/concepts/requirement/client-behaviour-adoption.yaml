  verified_against_the_code:
    reporting_seam: templates/htmlbind/script_report.go ComponentScripts returns Component,
      Script, Pos, Handlers and Parameters, and runs the same analysis Generate does
    answer_seam: GenerateOptions ClientHandlers, ClientHandlerAttr, ComponentParameters

id: requirement:tailwind-css-integration
type: requirement
title: Tailwind CSS Integration
summary: Optional Tailwind CSS v4 tooling scans Popcorn Web sources and emits one
  reproducible static stylesheet for application-owned delivery.
facts:
  legacy_body: "Optional Tailwind CSS v4 tooling scans Popcorn Web sources and emits\
    \ one reproducible static stylesheet for application-owned delivery.\n\n```yaml\n\
    inputs:\n  - configured CSS entry containing @import tailwindcss\n  - .pw.html\
    \ templates\n  - Go sources containing complete literal class names when explicitly\
    \ sourced\n  - CSS-owned @source, theme, utility, variant, and requirement:tailwind-plugin-integration\
    \ directives\noutput: configured static CSS path\ndiscovery:\n  - treat .pw.html\
    \ as plain text source\n  - require complete class-name literals\n  - reject or\
    \ warn on template expressions that construct class-name fragments\n  - use @source\
    \ inline for intentional safelists\nruntime:\n  - default output enters requirement:public-asset-delivery\n\
    \  - a custom output remains application-owned\nrules:\n  - flow:tailwind-css-build\
    \ runs only when configured\n  - CSS failure prevents a production build from\
    \ using stale output\n  - Popcorn Web does not parse, translate, or own Tailwind\
    \ CSS configuration\n  - generated CSS is reproducible but is not policy:generated-artifacts\
    \ generated Go, so its version-control rule is decision:generated-public-asset-version-control\
    \ rather than that policy's Go ignore line\n  - the output is excluded from version\
    \ control in an application and committed in a package, on the same reasoning\n\
    references:\n  - https://tailwindcss.com/docs/installation/tailwind-cli\n  - https://tailwindcss.com/docs/detecting-classes-in-source-files\n\
    ```"
  inputs:
  - configured CSS entry containing @import tailwindcss
  - .pw.html templates
  - Go sources containing complete literal class names when explicitly sourced
  - CSS-owned @source, theme, utility, variant, and requirement:tailwind-plugin-integration
    directives
  output: configured static CSS path
  discovery:
  - treat .pw.html as plain text source
  - require complete class-name literals
  - reject or warn on template expressions that construct class-name fragments
  - use @source inline for intentional safelists
  runtime:
  - default output enters requirement:public-asset-delivery
  - a custom output remains application-owned
  rules:
  - flow:tailwind-css-build runs only when configured
  - CSS failure prevents a production build from using stale output
  - Popcorn Web does not parse, translate, or own Tailwind CSS configuration
  - generated CSS is reproducible but is not policy:generated-artifacts generated
    Go, so its version-control rule is decision:generated-public-asset-version-control
    rather than that policy's Go ignore line
  - the output is excluded from version control in an application and committed in
    a package, on the same reasoning
  references:
  - https://tailwindcss.com/docs/installation/tailwind-cli
  - https://tailwindcss.com/docs/detecting-classes-in-source-files
relations:
- relation: mentions
  to: decision:generated-public-asset-version-control
  resolution: resolved
- relation: mentions
  to: flow:tailwind-css-build
  resolution: resolved
- relation: mentions
  to: policy:generated-artifacts
  resolution: resolved
- relation: mentions
  to: requirement:public-asset-delivery
  resolution: resolved
- relation: mentions
  to: requirement:tailwind-plugin-integration
  resolution: resolved

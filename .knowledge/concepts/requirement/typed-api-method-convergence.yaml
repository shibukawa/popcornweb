  landed_2026_09_02:
    module_line: go 1.27.0, which is what let the tagged files stop being tagged;
      a consumer building on an older Go is refused at the module line rather than
      at a method declaration
    here:
      memo: Get, Has, Set, Invalidate, InvalidateScope and InvalidateTag on *pwruntime.CacheStore
        carry the bodies; Memo, MemoHas, MemoSet, MemoInvalidate, MemoInvalidateScope
        and MemoInvalidateTag are deleted from pwruntime, pw and pwfast
      test_configuration: Get, Set and Update on *testutil.Config carry the bodies
        and the functions are deleted; Update infers its type from the edit's parameter,
        Set from its value, and Get still writes it
      session_registry: Register on *session.Registry carries the body and the function

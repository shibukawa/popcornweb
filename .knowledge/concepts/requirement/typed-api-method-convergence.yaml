      discovery: pwgen registers the four cache methods as Method patterns on pwruntime.CacheStore
        with the key at argument index 1, replacing the four Function patterns on
        pw with the key at index 2; the wrappers fixture calls store.Get and still
        yields the key type
      why_deleted_rather_than_deprecated: each function was a one-line delegation

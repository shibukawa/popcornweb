    nothing_stored_moves: each of these is a call shape, so no generated artifact,
      stored entry, or wire format changes
  written_ahead_behind_a_build_tag:
    what: the three sites built here carry their methods already, in files tagged
      go1.27 beside the code they extend, so the release is a flip rather than a design
    where: pwruntime/cache_go127.go, testutil/testutil_go127.go and session/registry_go127.go,

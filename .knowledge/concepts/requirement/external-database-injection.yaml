id: requirement:external-database-injection
type: requirement
title: Caller-owned database injection
summary: Supply externally provisioned pools, including pgmem, without transferring
  ownership to the framework.
lifecycle: accepted
authority: authored
scope:
  transport: net/http
facts:
  request: Complete leftover FromPool and WithDatabase work for externally provisioned
    pgmem tests and submit a pull request.
  decisions:
    api: Complete postgres.FromPool, pw.WithDatabase, pwdatabase.Install and testutil.WithDatabase.
    ownership: The caller owns supplied pools. The framework closes only its own pools
      and tooling handles.
    configuration: RDB must be explicitly enabled. Production retains valid configured
      topology. TestRun derives its isolated copied topology from the supplied connection.
    pgmem: Keep pgmem outside the core module dependency graph; test real integration
      in a standalone example module.
    native_tooling: Native connections require a framework-compatible DataSource URL.
      Modified pgx configuration or custom dialers need an explicitly reachable tooling
      DSN.
constraints:
- Preserve unrelated local untracked work.
- TestRun must not install pools in process state.
- Do not log DataSource, which can contain credentials.
non_goals:
- Automatic provisioning or ownership of pgmem servers.
- Reconstructing custom dialers or modified pgx connection settings from a DSN.
- A new fasthttp startup API; RuntimeOptions.Resources already supports external connection
  sets.
capabilities:
  external-pools:
    state: implemented
    verified_by:
    - provided-pool
    - ownership
    - isolated-tests
    - prepare-data
    - native-adapter
    - validation
    - pgmem
    - build
    evidence:
      path: docs/requests/external-database-injection.md
acceptance:
  provided-pool:
    text: Requests use supplied SQL or native pools without opening configured DSNs.
    verified_by:
    - provided-pool
  ownership:
    text: Replacement, shutdown and failed setup preserve caller-owned pools and release
      framework-owned handles.
    verified_by:
    - ownership
  isolated-tests:
    text: Separate TestRun servers use independent connections without changing process
      state or global configuration.
    verified_by:
    - isolated-tests
  prepare-data:
    text: Migrations, seed loading and assertions target the supplied database, including
      PostgreSQL from pgmem.
    verified_by:
    - prepare-data
  native-adapter:
    text: FromPool preserves native queries, WithConn and transactions, and records
      a tooling DSN.
    verified_by:
    - native-adapter
  validation:
    text: Empty/nil connections, disabled RDB, missing native tooling DSNs and unsupported
      transaction drivers fail before serving.
    verified_by:
    - validation
  pgmem:
    text: An external fixture provisions pgmem; real HTTP, migrations, seed data,
      rollback and pool lifetime are tested.
    verified_by:
    - pgmem
  build:
    text: Tests, pwdev checks and go install pass, and English/Japanese usage documentation
      is provided.
    verified_by:
    - build

id: requirement:editor-runtime-diagnostics
type: requirement
title: Runtime Findings in the Editor
summary: A failure that only happens when the application runs is reported in the
  editor at the template position that produced it, so the class of problem static
  analysis cannot reach is not the one class the developer debugs by reading logs.
facts:
  legacy_body: "A failure that only happens when the application runs is reported\
    \ in the editor at the template position that produced it, so the class of problem\
    \ static analysis cannot reach is not the one class the developer debugs by reading\
    \ logs.\n\n```yaml\nstatus: the dev-loop source is implemented, opt-in, over the\
    \ requirement:dev-console loop state\nbrowser_source_blocked_on:\n  transport:\
    \ requirement:dev-console exposes the loop state and nothing else; a browser report\
    \ becomes an api:logger record, and no endpoint offers those, so the transport\
    \ this file names does not exist yet\n  what_it_needs: a console endpoint over\
    \ the reports it has seen, which is a framework surface rather than an editor\
    \ one\n  position: a report carries a source file and line from the bundle, so\
    \ placing it needs the requirement:derived-asset-pipeline source map read and\
    \ resolved; an unmappable one is reported against the project rather than dropped,\
    \ which is what this file already says\nstage: 3 of vision:editor-support\nsources:\n\
    \  dev_loop: a template render failure, a query failure, and a panic observed\
    \ by api:cli-dev\n  browser: the requirement:browser-report-ingest records of\
    \ data:browser-report-record, which carry client-side failures a server never\
    \ sees\n  console: the requirement:dev-console already collects both, so the editor\
    \ subscribes to it rather than to the application\ntransport:\n  from: the requirement:dev-console\
    \ listener of decision:dev-console-consolidation, over its own endpoint\n  when:\
    \ only while api:cli-dev is running and the developer opted in, because policy:editor-tool-execution\
    \ never starts the loop implicitly\n  never: no report leaves the machine, per\
    \ the data rules of policy:editor-tool-execution\npositioning:\n  server_side:\
    \ requirement:template-source-positions, which is what turns a generated stack\
    \ frame into a template line\n  client_side: the requirement:derived-asset-pipeline\
    \ source map, which is what turns a bundled frame into a TypeScript line\n  unmappable:\
    \ reported against the project rather than dropped, because a report with no position\
    \ is still a report\npresentation:\n  separate_from_static: a distinct diagnostic\
    \ source, so a runtime finding is never confused with one api:cli-generate would\
    \ produce\n  lifetime: cleared when the dev loop restarts, because a finding from\
    \ a previous process describes code that may no longer exist\n  volume: bounded\
    \ per position, so a failing loop does not fill the Problems view with one repeated\
    \ error\nnon_goals:\n  - a telemetry surface in the editor; requirement:dev-telemetry-viewer\
    \ stays a browser tool, per vision:editor-support\n  - reports from a deployed\
    \ environment, which requirement:browser-report-ingest handles on the server\n\
    \  - starting api:cli-dev to obtain a report\nacceptance:\n  - a panic in a generated\
    \ renderer appears against the .pw.html line\n  - a browser report appears against\
    \ the TypeScript line rather than the bundle\n  - the findings clear when the\
    \ dev loop restarts\n  - no finding appears when the dev loop is not running\n\
    \  - a runtime finding and a static one on the same line are distinguishable\n\
    ```"
  status: the dev-loop source is implemented, opt-in, over the requirement:dev-console
    loop state
  browser_source_blocked_on:
    transport: requirement:dev-console exposes the loop state and nothing else; a
      browser report becomes an api:logger record, and no endpoint offers those, so
      the transport this file names does not exist yet
    what_it_needs: a console endpoint over the reports it has seen, which is a framework
      surface rather than an editor one
    position: a report carries a source file and line from the bundle, so placing
      it needs the requirement:derived-asset-pipeline source map read and resolved;
      an unmappable one is reported against the project rather than dropped, which
      is what this file already says
  stage: 3 of vision:editor-support
  sources:
    dev_loop: a template render failure, a query failure, and a panic observed by
      api:cli-dev
    browser: the requirement:browser-report-ingest records of data:browser-report-record,
      which carry client-side failures a server never sees
    console: the requirement:dev-console already collects both, so the editor subscribes
      to it rather than to the application
  transport:
    from: the requirement:dev-console listener of decision:dev-console-consolidation,
      over its own endpoint
    when: only while api:cli-dev is running and the developer opted in, because policy:editor-tool-execution
      never starts the loop implicitly
    never: no report leaves the machine, per the data rules of policy:editor-tool-execution
  positioning:
    server_side: requirement:template-source-positions, which is what turns a generated
      stack frame into a template line
    client_side: the requirement:derived-asset-pipeline source map, which is what
      turns a bundled frame into a TypeScript line
    unmappable: reported against the project rather than dropped, because a report
      with no position is still a report
  presentation:
    separate_from_static: a distinct diagnostic source, so a runtime finding is never
      confused with one api:cli-generate would produce
    lifetime: cleared when the dev loop restarts, because a finding from a previous
      process describes code that may no longer exist
    volume: bounded per position, so a failing loop does not fill the Problems view
      with one repeated error
  non_goals:
  - a telemetry surface in the editor; requirement:dev-telemetry-viewer stays a browser
    tool, per vision:editor-support
  - reports from a deployed environment, which requirement:browser-report-ingest handles
    on the server
  - starting api:cli-dev to obtain a report
  acceptance:
  - a panic in a generated renderer appears against the .pw.html line
  - a browser report appears against the TypeScript line rather than the bundle
  - the findings clear when the dev loop restarts
  - no finding appears when the dev loop is not running
  - a runtime finding and a static one on the same line are distinguishable
acceptance:
  item-d9d6ba9e03823282:
    text: a panic in a generated renderer appears against the .pw.html line
  item-934b2bf0932de0b9:
    text: a browser report appears against the TypeScript line rather than the bundle
  item-32b09aa2dc9ce1eb:
    text: the findings clear when the dev loop restarts
  item-56a060c0dfb537a1:
    text: no finding appears when the dev loop is not running
  item-1ba789afe8757db1:
    text: a runtime finding and a static one on the same line are distinguishable

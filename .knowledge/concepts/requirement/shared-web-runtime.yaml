id: requirement:shared-web-runtime
type: requirement
title: Shared Web Runtime
summary: Both application styles use one lifecycle and HTTP foundation.
facts:
  legacy_body: "Both application styles use one lifecycle and HTTP foundation.\n\n\
    ```yaml\ncapabilities:\n  - api:application-lifecycle\n  - data:loaded-configuration\n\
    \  - decision:independent-runtime-config-bindings\n  - policy:context-value-storage\n\
    \  - api:request-context-accessors\n  - requirement:typed-http-contract\n  - policy:web-middleware\n\
    \  - flow:request-lifecycle\n  - policy:operational-endpoints\nconstraints:\n\
    \  - startup validation precedes request acceptance\n  - generated user code depends\
    \ on Popcorn Web runtime, never the reverse\n  - advanced features are application-level\
    \ opt-ins\n```"
  capabilities:
  - api:application-lifecycle
  - data:loaded-configuration
  - decision:independent-runtime-config-bindings
  - policy:context-value-storage
  - api:request-context-accessors
  - requirement:typed-http-contract
  - policy:web-middleware
  - flow:request-lifecycle
  - policy:operational-endpoints
  constraints:
  - startup validation precedes request acceptance
  - generated user code depends on Popcorn Web runtime, never the reverse
  - advanced features are application-level opt-ins

id: requirement:early-framework-action-dispatch
type: requirement
title: Framework Actions Before Application Resource Startup
summary: Applications that initialize resources before pw.Run need a documented configuration-and-framework-action
  sequence that lets config generation and probes exit before those resources open.
authority: authored
lifecycle: accepted
review_state: confirmed
facts:
  origin:
    request: concept:bdf-printmanager-integration
    source: source:bdf-printmanager-request
    section: Smaller notes from the same integration
  requester_priority: nonblocking documentation note
  implementation_status: Implemented and verified in this repository; no BDF deployment is claimed.
  reported_sequence:
  - Register application configuration.
  - Call pw.ParseConfig().
  - Call pwconfig.RunFrameworkAction() and honor its handled/error result.
  - Only when normal startup continues, open resources and call pw.Run.
  reported_premise: ParseConfig is idempotent, so parsing before pw.Run is supported.
  reported_api_gap: RunFrameworkAction is exported from pwconfig, not from pw.
  documentation_scope: Explain the ordering and early-exit handling for --generate-config and the health probe in
    application startup/configuration documentation.
  implementation_report: docs/requests/bdf-printmanager-implementation.md

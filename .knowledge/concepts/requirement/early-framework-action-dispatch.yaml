    text: Should pw expose a convenience wrapper for pwconfig.RunFrameworkAction?
    state: answered
    resolution: Expose RunFrameworkAction from pw and pwfast, delegating to pwconfig. Document ParseConfig, action
      dispatch/early return, application resource initialization, then Run.

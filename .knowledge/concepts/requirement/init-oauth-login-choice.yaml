      oauth section with empty client values and no redirect, reports PW0434 naming
      AUTH_OAUTH_CLIENT_ID and AUTH_OAUTH_CLIENT_SECRET and PW0437 naming auth.oauth.redirect_url,
      and nothing about oidc

  resolution: resolved
- relation: mentions
  to: requirement:alternate-http-backend-readiness
  resolution: resolved
- relation: mentions
  to: requirement:contrib-websocket
  resolution: resolved
- relation: mentions
  to: requirement:fasthttp-middleware-registration
  resolution: resolved

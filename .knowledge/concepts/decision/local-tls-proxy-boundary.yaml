id: decision:local-tls-proxy-boundary
type: decision
title: Local TLS Proxy Boundary
summary: Popcorn Web selects a local sidecar or egress proxy as the default TLS boundary
  for TinyGo services that connect to external systems, and keeps it optional where
  a driver can verify TLS itself.
facts:
  legacy_body: "Popcorn Web selects a local sidecar or egress proxy as the default\
    \ TLS boundary for TinyGo services that connect to external systems, and keeps\
    \ it optional where a driver can verify TLS itself.\n\n```yaml\nstatus: accepted\n\
    sql_exception:\n  engines: requirement:contrib-postgresql and requirement:contrib-mysql\n\
    \  effect: the proxy is a supported deployment rather than a requirement, because\
    \ both verify TLS on the connected socket\n  gate: decision:server-sql-support-tier\
    \ platform_bounds decides whether a target can do this\n  unchanged: everything\
    \ outside those two engines still crosses this boundary\napplication_hop:\n  endpoint:\
    \ loopback or the same Pod network namespace\n  transport: plaintext application\
    \ protocol is allowed only inside this boundary\nproxy_hop:\n  transport: TLS\
    \ required outside the local workload boundary\n  responsibilities:\n    - certificate-chain\
    \ and hostname verification\n    - SNI and protocol-specific TLS negotiation\n\
    \    - upstream reconnect, health checking, and bounded retry\nrecommended:\n\
    \  postgresql: pgBouncer with verified TLS upstream\n  mysql: ProxySQL or another\
    \ protocol-aware proxy with verified TLS upstream\n  redis_valkey: stunnel, Envoy,\
    \ HAProxy, or a managed service proxy\n  http: an egress proxy that preserves\
    \ the logical HTTPS origin\nsupport_tiers:\n  main: verified TLS upstream through\
    \ the local proxy boundary\n  experimental: direct TinyGo TLS when target-specific\
    \ evidence exists\n  unsupported: plaintext traffic across host, Pod, or workload\
    \ trust boundaries\nrationale:\n  - TinyGo TLS and resolver APIs vary by target\
    \ and remain incomplete for common maintained clients\n  - a local proxy provides\
    \ mature certificate validation and protocol negotiation without embedding a second\
    \ TLS stack\n  - application packages remain testable with bounded plaintext protocol\
    \ fixtures on loopback\n```"
  status: accepted
  sql_exception:
    engines: requirement:contrib-postgresql and requirement:contrib-mysql
    effect: the proxy is a supported deployment rather than a requirement, because
      both verify TLS on the connected socket
    gate: decision:server-sql-support-tier platform_bounds decides whether a target
      can do this
    unchanged: everything outside those two engines still crosses this boundary
  application_hop:
    endpoint: loopback or the same Pod network namespace
    transport: plaintext application protocol is allowed only inside this boundary
  proxy_hop:
    transport: TLS required outside the local workload boundary
    responsibilities:
    - certificate-chain and hostname verification
    - SNI and protocol-specific TLS negotiation
    - upstream reconnect, health checking, and bounded retry
  recommended:
    postgresql: pgBouncer with verified TLS upstream
    mysql: ProxySQL or another protocol-aware proxy with verified TLS upstream
    redis_valkey: stunnel, Envoy, HAProxy, or a managed service proxy
    http: an egress proxy that preserves the logical HTTPS origin
  support_tiers:
    main: verified TLS upstream through the local proxy boundary
    experimental: direct TinyGo TLS when target-specific evidence exists
    unsupported: plaintext traffic across host, Pod, or workload trust boundaries
  rationale:
  - TinyGo TLS and resolver APIs vary by target and remain incomplete for common maintained
    clients
  - a local proxy provides mature certificate validation and protocol negotiation
    without embedding a second TLS stack
  - application packages remain testable with bounded plaintext protocol fixtures
    on loopback
lifecycle: accepted
relations:
- relation: mentions
  to: decision:server-sql-support-tier
  resolution: resolved
- relation: mentions
  to: requirement:contrib-mysql
  resolution: resolved
- relation: mentions
  to: requirement:contrib-postgresql
  resolution: resolved

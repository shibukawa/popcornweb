id: decision:tinybind-sql-runtime
type: decision
title: TinyBind SQL Plan Runtime
summary: TinyBind owns SQL statement classification, result-contract validation, and
  the shared execution runtime.
facts:
  legacy_body: "TinyBind owns SQL statement classification, result-contract validation,\
    \ and the shared execution runtime.\n\n```yaml\nstatus: accepted\nowner: system:tinybind\n\
    model: mirror the generated plan plus shared runtime separation used by htmlbind\n\
    generated:\n  - typed parameter and result structures\n  - immutable statement\
    \ plan carrying execution and result metadata\n  - thin exported typed function\n\
    runtime:\n  shared:\n    - statement and argument builder\n    - Exec and Query\
    \ execution\n    - row cardinality handling\n    - row scanning contracts\n  framework_boundary:\
    \ TinyBind calls the framework-configured executor resolver for the active database\
    \ or transaction\nexecution:\n  sql.exec: Exec\n  sql.one: Query requiring exactly\
    \ one row\n  sql.optional: Query allowing zero or one row\n  sql.many: Query allowing\
    \ zero or more rows\ngeneration_validation:\n  - row-returning declarations require\
    \ SELECT or mutation with RETURNING\n  - sql.exec rejects SELECT and mutation\
    \ with RETURNING\n  - projected or RETURNING columns must match the declared response\
    \ contract\n  - incompatible or statically unresolved response shapes are generation\
    \ errors\nremoved:\n  - per-package tinybind_shared_pw_gen.go runtime duplication\n\
    \  - _tinybindSafeMutation runtime token heuristic\npopcorn_web_scope:\n  - consume\
    \ the corrected TinyBind release\n  - retain the existing configured executor\
    \ resolver\n  - regenerate SQL artifacts\n  - remove stale generated shared files\n\
    \  - add no SQL parser, validator, plan runtime, or new public executor API\n\
    ```"
  status: accepted
  owner: system:tinybind
  model: mirror the generated plan plus shared runtime separation used by htmlbind
  generated:
  - typed parameter and result structures
  - immutable statement plan carrying execution and result metadata
  - thin exported typed function
  runtime:
    shared:
    - statement and argument builder
    - Exec and Query execution
    - row cardinality handling
    - row scanning contracts
    framework_boundary: TinyBind calls the framework-configured executor resolver
      for the active database or transaction
  execution:
    sql.exec: Exec
    sql.one: Query requiring exactly one row
    sql.optional: Query allowing zero or one row
    sql.many: Query allowing zero or more rows
  generation_validation:
  - row-returning declarations require SELECT or mutation with RETURNING
  - sql.exec rejects SELECT and mutation with RETURNING
  - projected or RETURNING columns must match the declared response contract
  - incompatible or statically unresolved response shapes are generation errors
  removed:
  - per-package tinybind_shared_pw_gen.go runtime duplication
  - _tinybindSafeMutation runtime token heuristic
  popcorn_web_scope:
  - consume the corrected TinyBind release
  - retain the existing configured executor resolver
  - regenerate SQL artifacts
  - remove stale generated shared files
  - add no SQL parser, validator, plan runtime, or new public executor API
lifecycle: accepted
relations:
- relation: mentions
  to: system:tinybind
  resolution: resolved

id: decision:tinygo-fasthttp-needs-nozstd
type: decision
title: TinyGo Builds fasthttp, And Briefly Needed fasthttp_nozstd
summary: TinyGo compiles the fasthttp second build with no extra tag, since tinygodriver
  v1.2.4. For one day it needed `-tags fasthttp_nozstd`, and before that it was recorded
  as not linking at all, which was wrong.
facts:
  legacy_body: "TinyGo compiles the fasthttp second build with no extra tag, since\
    \ tinygodriver v1.2.4. For one day it needed `-tags fasthttp_nozstd`, and before\
    \ that it was recorded as not linking at all, which was wrong.\n\n```yaml\nstatus:\
    \ resolved\nresolved_by:\n  release: tinygodriver v1.2.4, \"fasthttp: encode zstd\
    \ through compress/zstd under TinyGo\"\n  effect: a TinyGo fasthttp build needs\
    \ no extra tag at all\n  measured: 2026-08-11, examples/helloworld, darwin/arm64\
    \ — 5.59 MiB with -tags fasthttp alone, and the binary serves\n  fasthttp_nozstd_now:\
    \ still accepted, saves about 40 KB, and there is little reason to pass it\n \
    \ everything_below: describes the state between the two corrections, kept because\
    \ the mechanism is what the reference page explains\nsupersedes_claim: \"tinygo\
    \ + fasthttp does not link\", recorded 2026-08-11 during the binary size measurement\
    \ and corrected the same day\nserves: requirement:second-build-feature-parity\n\
    measured: 2026-08-11, examples/helloworld, darwin/arm64, Apple M3, klauspost/compress\
    \ v1.19.1\nfailure_without_the_tag:\n  symptom: linker could not find symbol\n\
    \  symbols:\n    - zstd.buildDtable_asm from zstd/fse_decoder_asm.go\n    - zstd.sequenceDecs_decodeSync_safe_arm64\
    \ from zstd/seqdec_arm64.go\n  cause: hand-written arm64 assembly TinyGo's linker\
    \ does not resolve, selected by the constraint \"(amd64 || arm64) && !appengine\
    \ && !noasm && gc\"\n  importer: tinygodriver/fasthttp imports klauspost/compress/zstd\
    \ unconditionally\n  why_the_gc_escape_does_not_fire:\n    fact: TinyGo sets the\
    \ gc build tag, verified by compiling a file pair guarded on gc and !gc under\
    \ both compilers\n    effect: klauspost's pure-Go half is \"(!amd64 && !arm64)\
    \ || appengine || !gc || noasm\", so the escape written for other compilers never\
    \ selects under TinyGo and only noasm is left\n  why_net_http_escapes:\n    both_symbols_are_decoder_side:\
    \ buildDtable_asm and sequenceDecs_decodeSync_safe_arm64 decode; nothing in the\
    \ encoder is missing\n    pw_only_encodes: a server compresses responses, so TinyGo's\
    \ dead-code elimination drops the decoder and the assembly with it\n    pw_already_swaps_the_package:\
    \ pw/response_zstd_tinygo.go is built under \"(tinygo || force_tinygo_logic) &&\
    \ !pw_nozstd\" and uses tinygodriver/compress/zstd, while pw/response_zstd_std.go\
    \ uses klauspost\n    the_fork_decodes_too: BodyUnzstd, writeUnzstd and the FS\
    \ pre-compressed .zst read reach the decoder, which is what retains the assembly\n\
    \  therefore: this is not a fasthttp problem or a size problem; it is the decode\
    \ half of one dependency reached under a compiler that cannot link it\nsizes:\n\
    \  tinygo_net_http: 4.19 MiB\n  tinygo_fasthttp_nozstd: 5.55 MiB\n  tinygo_fasthttp_noasm:\
    \ 8.04 MiB\n  no_debug:\n    native_darwin: changes nothing measurable, because\
    \ the linked Mach-O carries no DWARF at all — debug information stays in the object\
    \ files, so there is nothing to remove\n    wasi: the opposite; a wasm module\
    \ embeds .debug_info and .debug_line as custom sections\n    wasip1_net_http:\
    \ 7.6 MiB plain, 2.9 MiB with -no-debug, 62 percent\n    wasip1_fasthttp: 13.4\
    \ MiB plain, 3.8 MiB with -no-debug, 72 percent\n    wasip2: within 0.1 MiB of\
    \ wasip1 on both\n    consequence: a WASI artifact should always pass it, and\
    \ the fasthttp penalty falls from 5.8 MiB to 0.9 MiB because most of what the\
    \ fork added was debug information about itself\n    target_wasm: does not build\
    \ — net/http's JavaScript transport does not compile under TinyGo, and no server\
    \ target needs it\n  after_v1_2_4:\n    tinygo_fasthttp_no_extra_tag: 5.6 MiB,\
    \ so fasthttp costs 1.4 MiB over net/http under TinyGo\n    direction_reverses_by_compiler:\
    \ under host Go fasthttp is the marginally smaller build; under TinyGo it is the\
    \ larger one\n    why: the fasthttp build is additive rather than a substitution\
    \ — net/http is still linked because the fork imports it, and brotli, zlib, the\
    \ router, the websocket upgrader and a SOCKS proxy dialer sit on top; host Go's\
    \ linker discards most of that\ntags:\n  fasthttp_nozstd:\n    effect: drops the\
    \ zstd dependency; tinygodriver's own tag, documented in its fasthttp/PATCHES.md\
    \ section 6\n    correct_choice: yes\n  noasm:\n    effect: klauspost's tag, swaps\
    \ the assembly for its pure-Go fallback and keeps zstd\n    correct_choice: no,\
    \ it links but pays 2.49 MiB for a codec the build then still advertises\n   \
    \ cannot_be_made_automatic_by_a_library: build tags are set by the build invocation,\
    \ so no module can inject one into a dependency it imports; only klauspost adding\
    \ !tinygo to the asm constraint, or the build tool passing the flag, can make\
    \ TinyGo imply it\n    right_layer_instead: the importer declines the package\
    \ under tinygo, per requirement:tinygodriver-encode-only-zstd\nverified_running:\
    \ the fasthttp_nozstd binary serves, logs transport=fasthttp, and answers a request\
    \ through the middleware chain; a client offering only zstd is served identity\
    \ rather than failing\nopen_work_on_this_side:\n  build_command: closed — there\
    \ is no tag left to pass\n  compression_default: closed — a TinyGo fasthttp build\
    \ produces zstd again, so the \"zstd,gzip\" default is honest on every target\n\
    \  scheduler_threads:\n    fact: a TinyGo build linking database/postgres or database/mysql\
    \ needs -scheduler=threads, and refuses to compile without it\n    why: under\
    \ the cooperative scheduler a blocking socket call holds the runtime, so the driver's\
    \ cancellation watcher never runs and a query outlives its deadline returning\
    \ nil\n    how_it_is_passed: the Dockerfile.tinygo written by api:cli-init; pw\
    \ build does not drive TinyGo\n  ipv4_only: a TinyGo binary binds IPv4 while a\
    \ Go build binds the IPv6 wildcard, which is a probing trap and not a defect\n\
    tinygodriver_additions: requirement:tinygodriver-encode-only-zstd\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: "mapping values are not allowed here\n  in \"<unicode string>\", line\
      \ 3, column 42:\n     ... : tinygodriver v1.2.4, \"fasthttp: encode zstd through\
      \ compress/z ... \n                                         ^"

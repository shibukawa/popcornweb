  item-7d65f280e748ac55:
    text: each non-none api:cli-init answer writes exactly one generated copy
  item-2b4c4cb4959878a6:
    text: generated copies include requirement:agent-log-analysis-skill guidance and
      every referenced file
  item-4d224e7ef569e4d8:
    text: no public flag or existing generated-project path changes

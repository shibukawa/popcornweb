id: decision:interactive-project-bootstrap
type: decision
title: Interactive Project Bootstrap
summary: api:cli-init asks its questions in a terminal wizard while every answer stays
  reachable as a one-shot shortcut flag, so new project options cost one wizard step
  instead of a new command.
facts:
  legacy_body: "api:cli-init asks its questions in a terminal wizard while every answer\
    \ stays reachable as a one-shot shortcut flag, so new project options cost one\
    \ wizard step instead of a new command.\n\n```yaml\nstatus: accepted\namended_by:\n\
    \  ordering: decision:preset-first-bootstrap, which puts the requirement:init-presets\
    \ list in front of the question list, so a preset answers the capability questions\
    \ and the project name is the only one still asked\n  navigation: decision:navigable-answer-hub,\
    \ which replaces the first-to-last walk for the Manual preset with an editable\
    \ list of every question\n  unchanged_here: the question list itself, the conditional-step\
    \ rule, the seeding rule, and the shortcut-flag parity below, all of which a preset\
    \ supplies answers to rather than replaces\nselection:\n  wizard: every run that\
    \ has a terminal, whether or not a project name was given\n  name_argument: seeds\
    \ the project name step rather than skipping the wizard, because the name is one\
    \ answer out of ten and a caller who knows it still has not answered the store,\
    \ authentication, or toolchain questions\n  shortcut: --yes takes the flags and\
    \ the defaults for every unanswered question, which is the only way to skip the\
    \ wizard in a terminal\n  no_terminal:\n    with_name: the shortcut path, so an\
    \ existing CI script keeps working unchanged\n    without_name: refuse and print\
    \ usage instead of guessing the name\n  superseded: the earlier rule that a project\
    \ name alone selected the shortcut path, which hid every question after the first\
    \ from anyone who typed the name they already knew\nquestion_model:\n  ordered_steps:\
    \ text input and single-select steps\n  conditional_steps:\n    rule: a step may\
    \ declare the answers it applies to, and is skipped when they do not hold\n  \
    \  effect: a skipped step is absent from navigation, the step counter, and the\
    \ review screen, and its answer is never applied\n    reason: a follow-up question\
    \ must not leak an answer into a project that never asked it\n  seeding: shortcut\
    \ flags and the project name argument become the preselected wizard answers\n\
    \  review: final screen lists every answer before anything is written\n  keys:\
    \ arrow or jk to move, digits to jump, enter to accept, esc to go back, ctrl+c\
    \ to cancel\n  extension_cost: one option field, one shortcut flag, one wizard\
    \ step, and its scaffold branch\nquestions:\n  - preset, per requirement:init-presets,\
    \ which is the first screen and answers every question below it except the project\
    \ name\n  - project name\n  - TinyGo support, defaulting to no because it is the\
    \ one answer pw add cannot revisit, and decision:stdlib-servemux routing is the\
    \ same either way\n  - router, defaulting to registered, per decision:page-router-scaffold-choice\n\
    \  - Tailwind CSS\n  - authentication mode, defaulting to none, asked before the\
    \ stores because it is the answer that decides whether a store is optional at\
    \ all\n  - store, asked only with a login, offering the requirement:database-engine-selection\
    \ engines and DynamoDB with no none among them, since a session has to live somewhere\n\
    \  - database, asked only without a login, defaulting to yes because the SQL and\
    \ migration examples depend on it\n  - database engine, asked without a login\
    \ when the database is taken; a DynamoDB login no longer asks it, because requirement:dynamodb-auth-backend\
    \ moved all four tables plugin/auth owns onto that store\n  - DynamoDB, defaulting\
    \ to no, asked wherever it was not already the store answer, because requirement:dynamodb-store\
    \ is a second kind of store rather than a fourth engine\n  - OIDC provider, asked\
    \ only for an OIDC mode, choosing requirement:contrib-devidp or an external provider\n\
    \  - Devbox environment, defaulting to yes\n  - Redis or Valkey in the development\
    \ environment, defaulting to yes and skipped without the Devbox environment it\
    \ installs into\nordering:\n  project_then_machine: the questions that shape the\
    \ project come first, and the two about how this machine gets its tools close\
    \ the wizard\n  reason: declining Devbox changes nothing about the code, so it\
    \ does not belong among the answers that do\n  dependants_follow: a question whose\
    \ answer only applies inside another one is asked right after it, which is why\
    \ Valkey follows Devbox, the engine follows the database, and the provider follows\
    \ the mode\n  authentication_before_stores:\n    rule: authentication is asked\
    \ first, and the store questions follow from its answer\n    superseded: asking\
    \ the stores first, which made authentication a question a project could pass\
    \ without ever seeing\n    effect: every path asks about both kinds of store;\
    \ only the wording changes, from whether to which\n    pairing: the store question\
    \ a login answers covers one kind, and the one after it covers the other, so neither\
    \ is skipped by taking a branch\nimplementation:\n  library: github.com/charmbracelet/bubbletea\
    \ with bubbles and lipgloss\n  scope: host-only per decision:host-tools-target-runtime,\
    \ so it never reaches application binaries\nreused_by: decision:post-init-scaffold-wizard,\
    \ which drives api:cli-add and api:cli-new from the same step machinery without\
    \ shortcut-flag parity\nrationale:\n  - a wizard explains each trade-off where\
    \ the operator decides it\n  - a question never asked is an option never discovered,\
    \ and the questions after the name are the ones a first project most needs\n \
    \ - shortcut parity keeps api:cli-init scriptable and CI friendly\n  - a declarative\
    \ step list keeps future options additive\nnon_goals:\n  - remembering answers\
    \ between runs\n  - prompting for values that belong to data:project-config edits\
    \ later\n```"
  status: accepted
  amended_by:
    ordering: decision:preset-first-bootstrap, which puts the requirement:init-presets
      list in front of the question list, so a preset answers the capability questions
      and the project name is the only one still asked
    navigation: decision:navigable-answer-hub, which replaces the first-to-last walk
      for the Manual preset with an editable list of every question
    unchanged_here: the question list itself, the conditional-step rule, the seeding
      rule, and the shortcut-flag parity below, all of which a preset supplies answers
      to rather than replaces
  selection:
    wizard: every run that has a terminal, whether or not a project name was given
    name_argument: seeds the project name step rather than skipping the wizard, because
      the name is one answer out of ten and a caller who knows it still has not answered
      the store, authentication, or toolchain questions
    shortcut: --yes takes the flags and the defaults for every unanswered question,
      which is the only way to skip the wizard in a terminal
    no_terminal:
      with_name: the shortcut path, so an existing CI script keeps working unchanged
      without_name: refuse and print usage instead of guessing the name
    superseded: the earlier rule that a project name alone selected the shortcut path,
      which hid every question after the first from anyone who typed the name they
      already knew
  question_model:
    ordered_steps: text input and single-select steps
    conditional_steps:
      rule: a step may declare the answers it applies to, and is skipped when they
        do not hold
      effect: a skipped step is absent from navigation, the step counter, and the
        review screen, and its answer is never applied
      reason: a follow-up question must not leak an answer into a project that never
        asked it
    seeding: shortcut flags and the project name argument become the preselected wizard
      answers
    review: final screen lists every answer before anything is written
    keys: arrow or jk to move, digits to jump, enter to accept, esc to go back, ctrl+c
      to cancel
    extension_cost: one option field, one shortcut flag, one wizard step, and its
      scaffold branch
  questions:
  - preset, per requirement:init-presets, which is the first screen and answers every
    question below it except the project name
  - project name
  - TinyGo support, defaulting to no because it is the one answer pw add cannot revisit,
    and decision:stdlib-servemux routing is the same either way
  - router, defaulting to registered, per decision:page-router-scaffold-choice
  - Tailwind CSS
  - authentication mode, defaulting to none, asked before the stores because it is
    the answer that decides whether a store is optional at all
  - store, asked only with a login, offering the requirement:database-engine-selection
    engines and DynamoDB with no none among them, since a session has to live somewhere
  - database, asked only without a login, defaulting to yes because the SQL and migration
    examples depend on it
  - database engine, asked without a login when the database is taken; a DynamoDB
    login no longer asks it, because requirement:dynamodb-auth-backend moved all four
    tables plugin/auth owns onto that store
  - DynamoDB, defaulting to no, asked wherever it was not already the store answer,
    because requirement:dynamodb-store is a second kind of store rather than a fourth
    engine
  - OIDC provider, asked only for an OIDC mode, choosing requirement:contrib-devidp
    or an external provider
  - Devbox environment, defaulting to yes
  - Redis or Valkey in the development environment, defaulting to yes and skipped
    without the Devbox environment it installs into
  ordering:
    project_then_machine: the questions that shape the project come first, and the
      two about how this machine gets its tools close the wizard
    reason: declining Devbox changes nothing about the code, so it does not belong
      among the answers that do
    dependants_follow: a question whose answer only applies inside another one is
      asked right after it, which is why Valkey follows Devbox, the engine follows
      the database, and the provider follows the mode
    authentication_before_stores:
      rule: authentication is asked first, and the store questions follow from its
        answer
      superseded: asking the stores first, which made authentication a question a
        project could pass without ever seeing
      effect: every path asks about both kinds of store; only the wording changes,
        from whether to which
      pairing: the store question a login answers covers one kind, and the one after
        it covers the other, so neither is skipped by taking a branch
  implementation:
    library: github.com/charmbracelet/bubbletea with bubbles and lipgloss
    scope: host-only per decision:host-tools-target-runtime, so it never reaches application
      binaries
  reused_by: decision:post-init-scaffold-wizard, which drives api:cli-add and api:cli-new
    from the same step machinery without shortcut-flag parity
  rationale:
  - a wizard explains each trade-off where the operator decides it
  - a question never asked is an option never discovered, and the questions after
    the name are the ones a first project most needs
  - shortcut parity keeps api:cli-init scriptable and CI friendly
  - a declarative step list keeps future options additive
  non_goals:
  - remembering answers between runs
  - prompting for values that belong to data:project-config edits later
lifecycle: accepted

id: decision:layered-web-runtime
type: decision
title: Layered Web Runtime
summary: Implement web capabilities as additive layers so applications stop at the
  highest layer they need.
facts:
  legacy_body: "Implement web capabilities as additive layers so applications stop\
    \ at the highest layer they need.\n\n```yaml\nlayers:\n  - core: requirement:shared-web-runtime\n\
    \  - classic: concept:classic-web-style\n  - modern_server_ui: concept:modern-server-ui\n\
    \  - optional_client_ui: concept:client-component\nconstraints:\n  - classic builds\
    \ exclude component graphs, patching, hydration, and browser runtime\n  - modern\
    \ layers remain compatible with standard handlers and middleware\n```"
  layers:
  - core: requirement:shared-web-runtime
  - classic: concept:classic-web-style
  - modern_server_ui: concept:modern-server-ui
  - optional_client_ui: concept:client-component
  constraints:
  - classic builds exclude component graphs, patching, hydration, and browser runtime
  - modern layers remain compatible with standard handlers and middleware
relations:
- relation: mentions
  to: concept:classic-web-style
  resolution: resolved
- relation: mentions
  to: concept:client-component
  resolution: resolved
- relation: mentions
  to: concept:modern-server-ui
  resolution: resolved
- relation: mentions
  to: requirement:shared-web-runtime
  resolution: resolved

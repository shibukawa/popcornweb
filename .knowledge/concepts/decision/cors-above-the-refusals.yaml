id: decision:cors-above-the-refusals
type: decision
title: CORS Marks The Response Above Every Refusal
summary: requirement:cors-middleware is answered by the policy:security-response-headers
  frame, moved from slot 60 to 52 between SlotRecover and SlotRateLimitProcess, because
  a response the browser will not hand to script is a status nobody can read, and
  every frame that refuses a request sits below that number.
facts:
  legacy_body: "requirement:cors-middleware is answered by the policy:security-response-headers\
    \ frame, moved from slot 60 to 52 between SlotRecover and SlotRateLimitProcess,\
    \ because a response the browser will not hand to script is a status nobody can\
    \ read, and every frame that refuses a request sits below that number.\n\n```yaml\n\
    status: decided 2026-08-13 with the requirement, revised the same day to one frame,\
    \ implemented the same day\none_frame:\n  decided: 2026-08-13; CORS is not a new\
    \ frame beside the response-header frame, it is more of what that frame already\
    \ does\n  supersedes: an earlier shape in this decision that added a SlotCORS\
    \ at 52 and left SlotSecurityHeaders at 60\n  slot: SlotSecurityHeaders becomes\
    \ 52; no slot is added\n  as_built: the constant moved in pwruntime chain, both\
    \ transports install the frame when either half is enabled, and the pw test that\
    \ asserted the ceiling sat between recover and the headers now asserts the headers\
    \ sit above the ceiling\n  why_it_is_the_same_frame:\n    both_are_browser_policy:\
    \ one sets what the browser may render and embed, the other sets what it may read\
    \ and from where; both are resolved from data:security-runtime-config, validated\
    \ at startup, and written before commitment\n    both_wanted_the_same_position:\
    \ the requirement needed 52 for the marking to survive a refusal, and policy:security-response-headers\
    \ was already recorded as owing its headers to every error and operational response,\
    \ which 60 does not deliver\n    one_port_instead_of_two: decision:backend-specific-middleware\
    \ pays per frame per backend, and this is the frame that would otherwise be paid\
    \ twice for one position\n    one_construction_site: both halves are resolved\
    \ and validated where the frame is built, so a misconfiguration of either is an\
    \ error before the port is bound; as built that is ResolveCORS beside ResolveSecurityHeaders\
    \ rather than one function, for the reason the implementation block of requirement:cors-middleware\
    \ records\n  what_moving_60_to_52_also_fixes: a 429 from SlotRateLimitProcess,\
    \ and a 503 beside it, now carry the configured policy headers, which the earlier\
    \ arrangement left off every refusal written above 60\n  cost_of_the_move:\n \
    \   what: an application middleware registered in the 52 to 59 gap ran outside\
    \ the response-header frame and now runs inside it\n    who: nobody in this tree,\
    \ and any application that picked a number there meaning after the headers keeps\
    \ its meaning while one meaning before them silently inverts\n    stated_because:\
    \ the numbers are a public surface and pwruntime chain says the order is the part\
    \ that must not differ, so a moved constant is a change an upgrade note owes its\
    \ reader\n  frame_name: stays security_headers, because the name already means\
    \ the browser-policy frame and renaming it costs the startup summary, the diagnostics,\
    \ and every test that names it more than the wider meaning is worth\n  preflight_carries_them_too:\
    \ the 204 this frame answers gets the configured header set like any other response,\
    \ per the rule that policy:security-response-headers applies to operational responses\n\
    forcing_fact:\n  browser: script reads neither the body nor the status of a cross-origin\
    \ response carrying no Access-Control-Allow-Origin, whatever the status was\n\
    \  framework: the refusals are written by frames, not by the application; 429\
    \ at SlotRateLimitProcess, 413 at SlotMaxRequestBody, 401 at SlotAuthentication,\
    \ 403 at SlotCSRF and SlotGuard, 500 at SlotRecover\n  consequence: a frame that\
    \ marks the response has to have run before all of them, and requirement:typed-http-contract\
    \ answers every one of those cases with a typed problem the caller was meant to\
    \ act on\nmechanism:\n  fact: w.Header() is one map for the whole chain, so headers\
    \ a frame sets before calling next are on the response every frame below it writes\n\
    \  panic_case: the recover frame at 50 is outside this one and writes its 500\
    \ after this frame returned, and the marking is still in the map, so a panic-derived\
    \ 500 is readable too\n  therefore: marking early costs nothing and covers cases\
    \ the frame never sees\nslots:\n  chosen: SlotSecurityHeaders, moved from 60 to\
    \ 52\n  above_it_and_therefore_marked:\n    SlotRateLimitProcess 55: the 429 whose\
    \ Retry-After requirement:rate-limit-problem-responses exists to deliver, and\
    \ which the move also gives the configured policy headers\n    SlotRequestTimeout\
    \ 70 and SlotMaxRequestBody 80: the two bounds a client is expected to adapt to\n\
    \    SlotPublicAssets 90: the font and asset case, which needs the header on a\
    \ success rather than on a refusal\n    SlotOperational 100: health and readiness,\
    \ reachable cross-origin by a dashboard\n    SlotSession 120, SlotAuthentication\
    \ 130, SlotRateLimit 135, SlotCSRF 140, SlotGuard 150: every credential-shaped\
    \ refusal\n    SlotAPIDoc 160: the generated document, whose plausible reader\
    \ is a UI on another origin\n  below_it_and_therefore_still_covering_the_preflight:\n\
    \    SlotTracing 10: the preflight opens a span like any request\n    SlotResources\
    \ 20: the frame reads its resolved configuration the way every other one does\n\
    \    SlotClientAddress 25 and SlotRequestID 30: a preflight answer carries a request\
    \ ID and a resolved caller\n    SlotAccessLog 40: the preflight appears in the\
    \ log, so an operator can see one being answered\n    SlotRecover 50: a panic\
    \ parsing a malformed Access-Control-Request-Headers is a 500 rather than a dropped\
    \ connection\nrejected_alternatives:\n  a_second_frame_beside_the_security_headers_at_60:\n\
    \    shape: two frames, both browser policy, both set before commitment, both\
    \ left where the header one already sat\n    why_not: 60 is below SlotRateLimitProcess,\
    \ so a rate-limited cross-origin caller receives an unreadable 429 and keeps retrying\
    \ at the rate that limited it\n    what_survived_it: the observation that the\
    \ two belong together, which one_frame above adopts by moving the pair to 52 rather\
    \ than by leaving them at 60\n    what_did_not: the asymmetry this entry once\
    \ rested on, that 60 costs the security headers only a header on an error page\
    \ and costs the marking the entire answer; it is a reason not to sit at 60, not\
    \ a reason to sit apart\n  below_the_process_rate_limiter_at_57:\n    shape: preflights\
    \ counted against the process bound\n    why_not: the same 429 problem, for a\
    \ bound whose whole purpose is to tell a client when to come back\n    accepted_cost_instead:\
    \ a preflight answer escapes the process bound; it reaches no application code,\
    \ allocates a header set, and the request that follows it is still counted\n \
    \   settled: 2026-08-13, confirmed rather than left open; the frame takes no bound\
    \ of its own either, so a preflight is counted by nothing and the remedy for a\
    \ flood is the layer in front of the process rather than a second limiter inside\
    \ it\n  answering_the_preflight_in_the_router:\n    shape: an OPTIONS route per\
    \ path, or the router's own OPTIONS handling\n    why_not: pwfast servemux sets\
    \ HandleOPTIONS false deliberately, matching Go, so this would reverse a decision\
    \ taken for the framework as a whole to serve one middleware\n    also: a preflight\
    \ carries no credentials, so a route reached below SlotAuthentication answers\
    \ 401 to a browser asking whether it may send the real request\n    also: a per-route\
    \ declaration is the per-route thing that gets forgotten, and the forgotten case\
    \ fails in the browser rather than in a test\n  leaving_it_to_the_reverse_proxy:\n\
    \    shape: nginx or the ingress sets the headers\n    why_not: api:cli-dev has\
    \ no proxy in front of it, so the developer building the cross-origin client meets\
    \ the failure first and locally, with nothing in the framework to configure\n\
    \    also: the proxy cannot answer a preflight for a path whose method set the\
    \ router owns, so it either allows more than the application does or refuses what\
    \ it allows\nconsequences:\n  - no slot is added; one constant in pwruntime chain\
    \ changes value, and both transports read it, so the position cannot differ between\
    \ them\n  - policy:security-response-headers gains the refusals written between\
    \ 52 and 60, which is the gap that concept's own rule about error responses had\
    \ left open\n  - the frame runs on every request of a deployment that enabled\
    \ either half, including same-origin ones, where the CORS work is one absent-header\
    \ check\n  - a preflight is answered without the session, the authentication or\
    \ the guard ever running, which is the same reason decision:report-endpoint-above-the-session\
    \ gives for its own endpoint and reaches the same conclusion from the opposite\
    \ direction: that one had credentials it must not act on, this one has none to\
    \ act on\n  - the marking is present on responses this frame never inspected,\
    \ including one written by the recover frame outside it\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: 'Duplicate YAML key: also'

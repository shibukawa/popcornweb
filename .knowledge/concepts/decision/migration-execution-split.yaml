id: decision:migration-execution-split
type: decision
title: Migration Execution Split
summary: A host Go build applies migrations in process, and a TinyGo build delegates
  the same request to the pw command as a child process.
facts:
  legacy_body: "A host Go build applies migrations in process, and a TinyGo build\
    \ delegates the same request to the pw command as a child process.\n\n```yaml\n\
    status: accepted\nreason: system:goose is host-only, so a TinyGo application or\
    \ test binary cannot link the engine\nselection:\n  tag_switch: decision:force-tinygo-logic\n\
    \  in_process: \"!tinygo && !force_tinygo_logic\"\n  delegated: \"tinygo || force_tinygo_logic\"\
    \n  api_parity: both selections implement the same api:migration-runner surface\n\
    scope:\n  applies_to:\n    - application startup apply\n    - api:test-run from\
    \ host Go tests and from TinyGo tests\n  does_not_apply_to:\n    - api:cli-migrate,\
    \ which links the engine directly per decision:goose-migration-engine\n    - api:cli-dev,\
    \ which invokes pw migrate in the host toolchain\nin_process:\n  - open or reuse\
    \ the pool from decision:config-driven-database\n  - construct a goose Provider\
    \ over data:migration-source\n  - apply and report the resulting version\ndelegated:\n\
    \  child: pw migrate <action>\n  transport:\n    dsn: PW_MIGRATE_DSN in the child\
    \ environment, never a process argument\n    embedded_sources: an fs.FS is staged\
    \ to a temporary directory because a child cannot share it\n    rationale: policy:migration-safety\
    \ forbids credentials in argv\n  requirements:\n    - pw is resolvable on PATH\
    \ from the running environment, which data:project-config already assumes for\
    \ the Devbox shell\n    - data:migration-source is readable by the child process\n\
    \    - the DSN names a database the child process can reach\n  constraint:\n \
    \   in_memory_database: an in-process sqlite://:memory: database is invisible\
    \ to the child, so a delegated apply requires a file-backed DSN\n    test_resolution:\
    \ decision:test-migration-snapshot removes this constraint for api:test-run by\
    \ transferring SQL instead of a DSN\n  failure:\n    - a missing pw binary is\
    \ a clear actionable error, not a silent skip\n    - an unreachable delegated\
    \ DSN is reported as a configuration error naming the constraint\n    - a snapshot\
    \ that fails to replay is reported with the failing statement\n    - the child\
    \ exit status and stderr are propagated unchanged\nhost_ci:\n  - force_tinygo_logic\
    \ exercises the delegated path under host Go tests\n  - both paths assert identical\
    \ applied version and error mapping\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: "mapping values are not allowed here\n  in \"<unicode string>\", line\
      \ 30, column 55:\n     ... : an in-process sqlite://:memory: database is invisible\
      \ to the c ... \n                                         ^"

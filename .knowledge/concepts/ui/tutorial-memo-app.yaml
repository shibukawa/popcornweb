id: ui:tutorial-memo-app
type: ui
title: Tutorial Memo Application
summary: The memo application the tutorial builds is styled as it is typed, because
  a reader who follows every step to the end should be looking at something they would
  show someone.
facts:
  legacy_body: "The memo application the tutorial builds is styled as it is typed,\
    \ because a reader who follows every step to the end should be looking at something\
    \ they would show someone.\n\n```yaml\naudience: actor:application-developer\n\
    surface: the running example of requirement:tutorial-continuity, carried across\
    \ the tutorial chapters\nui:\n  root:\n    kind: browser\n    id: screen.tutorial-memos\n\
    \    title: Memos\n    children:\n      - kind: form\n        id: compose\n  \
    \      target: POST /memos\n        children:\n          - kind: textarea\n  \
    \          id: body\n            label: the next memo, holding the rejected draft\
    \ when one comes back\n          - kind: text\n            id: field-error\n \
    \           state: present only for a rejected submission, beside the field it\
    \ belongs to\n          - kind: button\n            id: submit\n            label:\
    \ Add\n      - kind: list\n        id: memos\n        label: what has been written,\
    \ newest first\n      - kind: region\n        id: account\n        state: present\
    \ from the login chapter onward, holding the display name and the sign-out control\n\
    styling:\n  toolchain: requirement:tailwind-css-integration, so the classes in\
    \ the templates are the ones the project actually compiles\n  defect_this_fixes:\n\
    \    form: the forms chapter renders an unstyled textarea and button, which is\
    \ the first page the reader builds themselves and the one that looks least finished\n\
    \    dangling_class: its error paragraph carries class=\"error\", which no stylesheet\
    \ in the project defines\n    scaffold: the api:cli-init starter page already\
    \ ships text-3xl font-bold, Tailwind classes in a project the same tutorial set\
    \ up without Tailwind\n  rule: no template in the tutorial carries a class the\
    \ project cannot compile, in either direction\nproject_toolchain:\n  requirement:\
    \ the tutorial project has Tailwind from the chapter that first shows a styled\
    \ template\n  mechanism: api:cli-add at the head of that chapter, per requirement:tutorial-capability-growth\n\
    \  consequence: getting-started declines Tailwind, which is what makes the forms\
    \ chapter have something to add\nform_validation:\n  rule: the form declares what\
    \ it will accept, so the browser rejects an empty or over-long memo before it\
    \ is sent\n  attributes: required and maxlength on the textarea, matching the\
    \ check rules on createMemoInput\n  server_still_validates: the check rules stay\
    \ exactly as they are; the form is a convenience and the handler is the boundary,\
    \ which is the lesson rather than a caveat\n  effect_on_the_chapter:\n    keeps:\
    \ the first createMemo, the one that answers a rejection with pw.WriteProblem\
    \ and nothing else\n    drops: the second one, which re-rendered the page with\
    \ the message beside the field\n    why: that branch existed to give a browser\
    \ something readable, and it was doing api:problem-response negotiation by hand;\
    \ with the form rejecting the ordinary case and the framework answering the rest\
    \ with an error page, the chapter no longer needs it\n  demonstration: bypass\
    \ the form with a command-line client and the same route answers with problem\
    \ details, which is what shows that the two validations are not the same thing\n\
    rules:\n  - styling is shown, not taught; the chapters explain the framework and\
    \ let the classes speak for themselves\n  - a class appears in a template only\
    \ where the chapter has already added the page it belongs to\nnon_goals:\n  -\
    \ a design system, a component library, or a theme\n  - teaching Tailwind, which\
    \ has its own documentation\n  - restyling the api:cli-init scaffold from here;\
    \ ui:starter-landing-page owns that page\n```"
  audience: actor:application-developer
  surface: the running example of requirement:tutorial-continuity, carried across
    the tutorial chapters
  ui:
    root:
      kind: browser
      id: screen.tutorial-memos
      title: Memos
      children:
      - kind: form
        id: compose
        target: POST /memos
        children:
        - kind: textarea
          id: body
          label: the next memo, holding the rejected draft when one comes back
        - kind: text
          id: field-error
          state: present only for a rejected submission, beside the field it belongs
            to
        - kind: button
          id: submit
          label: Add
      - kind: list
        id: memos
        label: what has been written, newest first
      - kind: region
        id: account
        state: present from the login chapter onward, holding the display name and
          the sign-out control
  styling:
    toolchain: requirement:tailwind-css-integration, so the classes in the templates
      are the ones the project actually compiles
    defect_this_fixes:
      form: the forms chapter renders an unstyled textarea and button, which is the
        first page the reader builds themselves and the one that looks least finished
      dangling_class: its error paragraph carries class="error", which no stylesheet
        in the project defines
      scaffold: the api:cli-init starter page already ships text-3xl font-bold, Tailwind
        classes in a project the same tutorial set up without Tailwind
    rule: no template in the tutorial carries a class the project cannot compile,
      in either direction
  project_toolchain:
    requirement: the tutorial project has Tailwind from the chapter that first shows
      a styled template
    mechanism: api:cli-add at the head of that chapter, per requirement:tutorial-capability-growth
    consequence: getting-started declines Tailwind, which is what makes the forms
      chapter have something to add
  form_validation:
    rule: the form declares what it will accept, so the browser rejects an empty or
      over-long memo before it is sent
    attributes: required and maxlength on the textarea, matching the check rules on
      createMemoInput
    server_still_validates: the check rules stay exactly as they are; the form is
      a convenience and the handler is the boundary, which is the lesson rather than
      a caveat
    effect_on_the_chapter:
      keeps: the first createMemo, the one that answers a rejection with pw.WriteProblem
        and nothing else
      drops: the second one, which re-rendered the page with the message beside the
        field
      why: that branch existed to give a browser something readable, and it was doing
        api:problem-response negotiation by hand; with the form rejecting the ordinary
        case and the framework answering the rest with an error page, the chapter
        no longer needs it
    demonstration: bypass the form with a command-line client and the same route answers
      with problem details, which is what shows that the two validations are not the
      same thing
  rules:
  - styling is shown, not taught; the chapters explain the framework and let the classes
    speak for themselves
  - a class appears in a template only where the chapter has already added the page
    it belongs to
  non_goals:
  - a design system, a component library, or a theme
  - teaching Tailwind, which has its own documentation
  - restyling the api:cli-init scaffold from here; ui:starter-landing-page owns that
    page

id: rule:route-and-template-checks
type: rule
title: Route and Template Checks
summary: 'The PW02xx data:diagnostic-check entries: what data:route-table and the
  template sources say about paths that collide, paths nothing serves, and pages nothing
  reaches.'
facts:
  legacy_body: "The PW02xx data:diagnostic-check entries: what data:route-table and\
    \ the template sources say about paths that collide, paths nothing serves, and\
    \ pages nothing reaches.\n\n```yaml\nroutes:\n  duplicate-pattern:\n    trigger:\
    \ two data:route-table entries registering the same pattern\n    severity: error\n\
    \    reason: api:serve-mux panics at registration, so this is a startup crash\
    \ found without starting\n    preference: api:cli-generate should reject it at\
    \ generation time where the analysis can see both; doctor still lists it, because\
    \ a project that cannot generate is exactly when doctor runs\n  framework-mount-collision:\n\
    \    trigger: an application pattern equal to, or shadowing, an enabled framework\
    \ mount in data:route-table\n    severity: error\n    evidence: names the configuration\
    \ key that enables the mount, so moving either side is a choice the reader can\
    \ make\n    reference: policy:operational-endpoints and requirement:public-asset-delivery\n\
    \  unreachable-route:\n    trigger: a pattern that no request can reach, because\
    \ a mount prefix and the pattern disagree\n    severity: warning\n    unimplemented:\
    \ no concept names the mount prefix this compares against, and a warning built\
    \ on a mechanism nobody wrote down would fire on paths that are reachable\n  unresolved-registration:\n\
    \    trigger: a data:route-table unresolved entry\n    severity: note\n    implemented:\
    \ PW0203. The site and the analysis's own reason code are the evidence, because\
    \ the remedy is at that line\n  route-table-diverges-across-backends:\n    trigger:\
    \ the data:route-table built for one backend build configuration differs from\
    \ the one built for another\n    severity: error\n    unimplemented: api:cli-generate\
    \ writes one table, for the backend it generated; comparing two needs it to write\
    \ one per declared backend, which is a change to what generation produces rather\
    \ than to what doctor reads\n    reason: a handler in a file excluded by a build\
    \ tag takes its registration with it, so the route is absent rather than broken,\
    \ and nothing else in the toolchain reports a route that quietly stopped existing\n\
    \    also_covers: a pattern the decision:transport-source-transform absorption\
    \ layer cannot express identically, per the api:serve-mux cannot_absorb list,\
    \ which is a difference in meaning rather than in presence\n    scope: only when\
    \ a project declares a second backend build; a single-backend project never runs\
    \ it\n    reason: rule:static-route-discovery already makes this incomplete OpenAPI;\
    \ the report states it as a limit on every other route check\npages:\n  page-without-route:\n\
    \    trigger: a .pw.html page inside a generate purpose that no registration renders\n\
    \    severity: warning\n    unimplemented: data:route-table records a handler's\
    \ identity and not what it renders, so nothing connects a registration to the\
    \ template behind it; both this and route-without-page wait on that\n    reason:\
    \ it is generated, compiled, and unreachable, which reads as a missing registration\
    \ rather than an intentional file\n  route-without-page:\n    trigger: a registration\
    \ whose handler renders a page source that does not exist\n    severity: error\n\
    templates:\n  document-shell-count:\n    trigger: zero or more than one requirement:nested-html-templates\
    \ document shell across the generate.templates purposes\n    severity: error\n\
    \    status: api:cli-generate already fails on the second one; doctor states the\
    \ resolved shell so the reader sees which file won\n  error-page-missing:\n  \
    \  trigger: no 400, 404, or 500 page for flow:error-template-generation\n    severity:\
    \ note\n    reason: api:problem-response has a framework fallback, so this is\
    \ a finish-the-project item rather than a defect\n  unreferenced-component:\n\
    \    trigger: a component template no page or component includes, per data:ui-dependency-graph\n\
    \    severity: note\nrules:\n  - every check here reads data:route-table and template\
    \ sources, and none of them starts a server to find a route\n  - a check is skipped,\
    \ with a limit entry, when data:route-table is stale or unavailable, because a\
    \ partial table produces false collisions\n  - the report lists the effective\
    \ routes even when no check fires, since the route list is the answer to \"what\
    \ does this application serve\"\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: 'Duplicate YAML key: reason'

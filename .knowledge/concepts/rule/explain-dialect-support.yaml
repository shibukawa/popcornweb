id: rule:explain-dialect-support
type: rule
title: EXPLAIN Dialect Support
summary: The slow path of flow:query-diagnostics resolves its EXPLAIN statement from
  the dialect rule:rdb-dsn-resolution reports, the same source rule:savepoint-dialect-support
  uses.
facts:
  legacy_body: "The slow path of flow:query-diagnostics resolves its EXPLAIN statement\
    \ from the dialect rule:rdb-dsn-resolution reports, the same source rule:savepoint-dialect-support\
    \ uses.\n\n```yaml\nmode: plan only\nstatement:\n  sqlite: EXPLAIN QUERY PLAN\
    \ before the observed statement text\n  postgres: EXPLAIN with JSON format before\
    \ the observed statement text\n  mysql: EXPLAIN with JSON format before the observed\
    \ statement text\ndefault: unsupported\nrules:\n  - never use ANALYZE, because\
    \ it executes the observed statement a second time and can repeat its side effects\n\
    \  - plan-only EXPLAIN is safe for every statement kind, so no read or write filtering\
    \ is needed\n  - pass the original arguments, so the captured plan matches a parameterized\
    \ execution rather than a literal one\n  - an unsupported driver disables EXPLAIN\
    \ and leaves the rest of flow:query-diagnostics intact\n  - report an unsupported\
    \ driver once at startup through policy:startup-summary, never per statement\n\
    \  - every mapping here is first-class under decision:server-sql-support-tier,\
    \ and each activates only for the engine a project actually selected\n  - a driver\
    \ that rejects EXPLAIN for a statement records explain_error and continues\n \
    \ - a dialect that returns no plan rows for a statement kind records neither a\
    \ plan nor an error\n  - sqlite returns no plan for an INSERT with a VALUES list,\
    \ including one carrying ON CONFLICT or RETURNING, because the plan describes\
    \ how rows are found and such a statement finds none\n  - sqlite does plan UPDATE,\
    \ DELETE, and INSERT ... SELECT, so the gap is narrower than write versus read\n\
    \  - the captured plan is stored as text in data:query-record without framework\
    \ interpretation\n  - a multi-column plan is labeled with its own column names,\
    \ and a column the dialect names notused is dropped\n```"
  mode: plan only
  statement:
    sqlite: EXPLAIN QUERY PLAN before the observed statement text
    postgres: EXPLAIN with JSON format before the observed statement text
    mysql: EXPLAIN with JSON format before the observed statement text
  default: unsupported
  rules:
  - never use ANALYZE, because it executes the observed statement a second time and
    can repeat its side effects
  - plan-only EXPLAIN is safe for every statement kind, so no read or write filtering
    is needed
  - pass the original arguments, so the captured plan matches a parameterized execution
    rather than a literal one
  - an unsupported driver disables EXPLAIN and leaves the rest of flow:query-diagnostics
    intact
  - report an unsupported driver once at startup through policy:startup-summary, never
    per statement
  - every mapping here is first-class under decision:server-sql-support-tier, and
    each activates only for the engine a project actually selected
  - a driver that rejects EXPLAIN for a statement records explain_error and continues
  - a dialect that returns no plan rows for a statement kind records neither a plan
    nor an error
  - sqlite returns no plan for an INSERT with a VALUES list, including one carrying
    ON CONFLICT or RETURNING, because the plan describes how rows are found and such
    a statement finds none
  - sqlite does plan UPDATE, DELETE, and INSERT ... SELECT, so the gap is narrower
    than write versus read
  - the captured plan is stored as text in data:query-record without framework interpretation
  - a multi-column plan is labeled with its own column names, and a column the dialect
    names notused is dropped
relations:
- relation: mentions
  to: data:query-record
  resolution: resolved
- relation: mentions
  to: decision:server-sql-support-tier
  resolution: resolved
- relation: mentions

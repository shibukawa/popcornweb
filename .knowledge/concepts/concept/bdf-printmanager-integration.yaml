  reported_layout:
    root_package: bdf
    application: cmd/printmanager
    module: one shared go.mod at the root
    tool_config: popcornweb.toml at the root
  reported_workarounds:
  - pw generate --code-only with committed generated Go and CI drift checks.
  - Application-owned /static/ handler in cmd/printmanager/handlers/static.go; the same embedded tree is also supplied
    to pw.WithPublicFS.
  - Standalone tailwindcss through go generate.
  - Handwritten Lambda Dockerfile under cmd/printmanager/deploy/lambda.
  requests:
    requirement:configurable-public-asset-locations: primary; Ask 1 is the integration blocker
    requirement:development-public-asset-fallback: secondary; requester prefers fallback plus a diagnostic
    requirement:optional-production-config-packaging: lower than Ask 1 and Ask 2
    requirement:string-slice-config-defaults: nonblocking integration note; includes a reported CSRF startup bug
    requirement:early-framework-action-dispatch: nonblocking documentation note
    requirement:empty-query-scope-documentation: nonblocking documentation note

id: api:cli-new
type: api
title: pw new
summary: pw new scaffolds one more source of a kind the project already contains,
  so a second handler costs a wizard rather than a copied file whose route, template,
  and mux registration have to be fixed by hand.
facts:
  legacy_body: "pw new scaffolds one more source of a kind the project already contains,\
    \ so a second handler costs a wizard rather than a copied file whose route, template,\
    \ and mux registration have to be fixed by hand.\n\n```yaml\nusage: \"pw new [handler|page]\"\
    \nvocabulary:\n  level: one source added to a router the project already carries,\
    \ which is why the kinds are handler and page rather than registered and discovered\n\
    \  sibling: api:cli-add installs the router itself, and names it, per decision:page-router-scaffold-choice\n\
    \  unavailable_kind: a kind whose router is absent stops with the pw add capability\
    \ that installs it, naming both\nrequirement: requirement:incremental-project-capabilities\n\
    mode: decision:post-init-scaffold-wizard\ninputs:\n  kind: preselects the first\
    \ wizard step; omitting it lists the available kinds\nkinds:\n  handler:\n   \
    \ writes: an HTTP route, its handler source, and its optional typed template\n\
    \    offered_when: the project lists a generate.handlers entry\n  page:\n    writes:\
    \ a concept:page-tree route directory, its page.pw.html, and its optional page.go\n\
    \    offered_when: the project lists a generate.pages entry\n    requirement:\
    \ requirement:discovered-page-routing\n  future:\n    candidates: query, migration,\
    \ template\n    extension_cost: one kind entry, one step list, and its scaffold\
    \ branch\nhandler_questions:\n  package:\n    default: the working directory when\
    \ it lies under a data:project-config generate.handlers entry, because that is\
    \ where the operator already is\n    resolution:\n      - the working directory\
    \ itself, when it is a listed handler directory or below one\n      - otherwise\
    \ no preselection, and the step lists the generate.handlers entries and their\
    \ existing handler packages\n    reason: a directory outside the handler purpose\
    \ of decision:explicit-generation-sources would produce a route nothing analyzes,\
    \ so it is never offered\n    html_response: the destination must also lie under\
    \ a generate.templates entry, since the page template is generated by a different\
    \ purpose\n    outside_only: a project whose listed directories cannot take a\
    \ handler stops with the keys to edit\n    effect: a package that does not exist\
    \ yet also gets its flow:handler-registration mux and Handlers accessor for the\
    \ project.toolchain\n  method: GET, POST, PUT, PATCH, or DELETE\n  path: literal\
    \ route path, validated as a Go 1.22 method-and-path pattern\n  name:\n    default:\
    \ derived from method and path\n    use: the source file stem and the exported\
    \ handler identifier\n  response:\n    html: .pw.html template beside the handler,\
    \ rendered through WriteHTML\n    api: JSON response through WriteAPI\n  request_input:\n\
    \    yes: a private request type and a pw.Parse call site\n  review: lists every\
    \ file to create and every follow-up command\npage_questions:\n  tree:\n    asked_when:\
    \ the project lists more than one generate.pages root, since one root is not a\
    \ choice\n    default: the working directory's tree when it lies inside a root\n\
    \  path:\n    input: a route path such as /users/{id} or /files/{rest...}\n  \
    \  written_as: the rule:page-directory-naming spelling of that path, so {id} becomes\
    \ id_ and {rest...} becomes rest__\n    validated: every segment must be a legal\
    \ Go import path element, and a catch-all must end the path; both are reported\
    \ before anything is written\n  rung:\n    none: page.pw.html alone, whose data\
    \ comes from its own external calls\n    loader: page.pw.html declaring an external\
    \ and binding it, and a page.go implementing that external, written to agree from\
    \ the start; the handler is still generated whole, so this is a shape rather than\
    \ a rung, per decision:page-rung-ladder\n    handler_load: page.pw.html and a\
    \ page.go carrying a Load that owns the response and composes its own chain through\
    \ the generated Render\n  layout:\n    asked_when: the target tree has no layout.pw.html\n\
    \    yes: a layout.pw.html declaring children as html\n  review: the same final\
    \ screen as the handler kind\noutputs:\n  - \"{root}/{segments}/page.pw.html for\
    \ a page, and page.go for a rung that has one\"\n  - \"{package}/{name}_handler.go\
    \ with an init() route registration and a standard func(http.ResponseWriter, *http.Request)\"\
    \n  - \"{package}/{name}.pw.html when the response is HTML, extending the requirement:nested-html-templates\
    \ document shell\"\n  - \"{package}/index.go mux and Handlers accessor when the\
    \ package is new\"\n  - generated {source-base}_pw_gen.go from the api:cli-generate\
    \ run that follows\nmanual_steps:\n  new_package: concept:application-entry-point\
    \ owns main.go, so wiring a new handler package is printed rather than injected\n\
    rules:\n  - require a data:project-config project root, found by walking up from\
    \ the working directory\n  - offer only the kinds the project's purpose lists\
    \ can accept, so a project with no page tree is never offered a page and a project\
    \ with no handler directory is never offered a handler\n  - a page needs no registration,\
    \ so it creates no mux and prints no wiring step, which is the difference between\
    \ the two kinds\n  - refuse a page path that already serves a route, naming the\
    \ directory that does\n  - offer only destinations under a data:project-config\
    \ generate.handlers entry, and under generate.templates too when the response\
    \ is HTML\n  - register a literal method-and-path pattern, because rule:static-route-discovery\
    \ drives generated OpenAPI\n  - refuse a pattern the target package already registers,\
    \ naming the file that registers it\n  - refuse an existing destination file;\
    \ report the conflict and stop\n  - write nothing when any planned file cannot\
    \ be created, so no orphan handler source reaches the project\n  - keep the written\
    \ sources when only the api:cli-generate step fails, because the operator owns\
    \ and fixes them\n  - emit the mux type that project.toolchain selects, per flow:handler-registration\n\
    \  - run api:cli-generate after writing, so the project stays buildable\n  - never\
    \ edit an existing handler source, main.go, or the document shell\nrelations:\n\
    \  flow: flow:handler-scaffolding\n  layout: concept:project-layout\n  sibling:\
    \ api:cli-add installs capabilities rather than sources\n  generation: api:cli-generate\n\
    exit:\n  success: 0\n  canceled_wizard: 0 with a canceled notice and no files\
    \ written\n  no_terminal: nonzero with usage\n  conflict_or_invalid_pattern: nonzero\
    \ with the path and the reason\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: '''<'' not supported between instances of ''bool'' and ''str'''

id: api:auth-allowlist-store
type: api
title: Admission Allowlist Store
summary: The pre-registration lookup of policy:oidc-admission becomes a store seam,
  so it can be answered by something other than a SQL table.
facts:
  legacy_body: "The pre-registration lookup of policy:oidc-admission becomes a store\
    \ seam, so it can be answered by something other than a SQL table.\n\n```yaml\n\
    package: github.com/shibukawa/popcornweb/plugin/auth\nproblem:\n  - the registered\
    \ admission mode reads popcornweb_auth_allowlist through SQL built in plugin/auth,\
    \ with no interface between\n  - it is the only one of the four framework-owned\
    \ authentication stores with no seam, so requirement:dynamodb-auth-backend cannot\
    \ supply an implementation without one\n  - an application that already knows\
    \ who may enter, from a directory or an entitlement service, has no way to answer\
    \ the question today\nsurface:\n  - auth.SetAllowlistStore(store) installs the\
    \ application implementation\n  - Registered(ctx, issuer, candidates) reports\
    \ whether any candidate matches, where a candidate is a claim name and its verified\
    \ value\n  - the framework passes every claim of auth.oidc.registered_claims that\
    \ the verified identity carries, so the store answers one question per login rather\
    \ than one per claim\nwhy_a_batch_signature:\n  sql: the current query is one\
    \ statement with an OR over the compared claims\n  dynamo: requirement:dynamodb-auth-stores\
    \ answers it with one BatchGetItem\n  a_per_claim_signature: would make both implementations\
    \ issue N requests to answer one question, for no gain in expressiveness\nentry:\n\
    \  fields: issuer, claim name, expected value, and an operator note\n  identity:\
    \ the three key fields together, which is the primary key of the relational table\n\
    \  provisioning: administrator tooling, outside this seam; the framework reads\
    \ and never writes\ndefault:\n  when: no store is installed\n  backing: popcornweb_auth_allowlist\
    \ under rule:framework-owned-tables, selected by decision:auth-backend-selection\n\
    \  override: installing a store means the framework creates and verifies no table\
    \ for this capability, matching api:auth-credential-store\n  unused_modes: nothing\
    \ reads this store unless oidc.admission is registered, so the conditional verification\
    \ of rule:framework-owned-tables applies to it as well\nrules:\n  - a lookup failure\
    \ is an error and never a denial, so an outage cannot silently change who may\
    \ enter, per policy:oidc-admission\n  - matching is exact and case-sensitive,\
    \ and the store performs no normalization\n  - a claim the verified identity does\
    \ not carry is omitted from the candidates rather than compared as empty\n  -\
    \ no candidate at all is a non-match rather than an error\n  - store errors are\
    \ logged without claim values, per policy:oidc-security\n  - the store answers\
    \ admission only, and never authorization\nimplemented:\n  built: 2026-08-05,\
    \ replacing the raw SQL in plugin/auth\n  default: sqlAllowlist over popcornweb_auth_allowlist,\
    \ one statement per login\n  verification: the table is verified only under the\
    \ registered admission mode and only when no store is installed\nrelated:\n  -\
    \ policy:oidc-admission\n  - data:external-identity\n  - requirement:dynamodb-auth-backend\n\
    ```"
  package: github.com/shibukawa/popcornweb/plugin/auth
  problem:
  - the registered admission mode reads popcornweb_auth_allowlist through SQL built
    in plugin/auth, with no interface between
  - it is the only one of the four framework-owned authentication stores with no seam,
    so requirement:dynamodb-auth-backend cannot supply an implementation without one
  - an application that already knows who may enter, from a directory or an entitlement
    service, has no way to answer the question today
  surface:
  - auth.SetAllowlistStore(store) installs the application implementation
  - Registered(ctx, issuer, candidates) reports whether any candidate matches, where
    a candidate is a claim name and its verified value
  - the framework passes every claim of auth.oidc.registered_claims that the verified
    identity carries, so the store answers one question per login rather than one
    per claim
  why_a_batch_signature:
    sql: the current query is one statement with an OR over the compared claims
    dynamo: requirement:dynamodb-auth-stores answers it with one BatchGetItem
    a_per_claim_signature: would make both implementations issue N requests to answer
      one question, for no gain in expressiveness
  entry:
    fields: issuer, claim name, expected value, and an operator note
    identity: the three key fields together, which is the primary key of the relational
      table
    provisioning: administrator tooling, outside this seam; the framework reads and
      never writes
  default:
    when: no store is installed
    backing: popcornweb_auth_allowlist under rule:framework-owned-tables, selected
      by decision:auth-backend-selection
    override: installing a store means the framework creates and verifies no table
      for this capability, matching api:auth-credential-store
    unused_modes: nothing reads this store unless oidc.admission is registered, so
      the conditional verification of rule:framework-owned-tables applies to it as
      well
  rules:
  - a lookup failure is an error and never a denial, so an outage cannot silently
    change who may enter, per policy:oidc-admission
  - matching is exact and case-sensitive, and the store performs no normalization
  - a claim the verified identity does not carry is omitted from the candidates rather
    than compared as empty
  - no candidate at all is a non-match rather than an error
  - store errors are logged without claim values, per policy:oidc-security
  - the store answers admission only, and never authorization
  implemented:
    built: 2026-08-05, replacing the raw SQL in plugin/auth
    default: sqlAllowlist over popcornweb_auth_allowlist, one statement per login
    verification: the table is verified only under the registered admission mode and
      only when no store is installed
  related:
  - policy:oidc-admission
  - data:external-identity
  - requirement:dynamodb-auth-backend

id: api:cli-seed
type: api
title: pw seed
summary: pw seed loads data:seed-dataset files into the configured application database
  through the same effective runtime configuration used by the server.
facts:
  legacy_body: "pw seed loads data:seed-dataset files into the configured application\
    \ database through the same effective runtime configuration used by the server.\n\
    \n```yaml\nusage: pw seed [name...]\nflags:\n  --dir: override the testdata/seed\
    \ directory\narguments:\n  - each name is a data:seed-dataset path relative to\
    \ the seed directory\n  - no argument applies every .yaml file in the seed directory\
    \ in lexical order\nexecution:\n  model: decision:host-tools-target-runtime\n\
    \  mechanism: resolve the DSN from the application, then open and seed inside\
    \ the CLI process\n  dsn: resolved from the application through the api:cli-migrate\
    \ --pw-print-dsn pipe\n  engine: decision:dbtestify-integration local_boundary\n\
    behavior:\n  - load the effective runtime TOML configuration\n  - require middleware.rdb.enabled\
    \ and fail otherwise\n  - open a short-lived pool from the reported DSN and close\
    \ it before returning\n  - resolve the system:dbtestify dialect from the rdb DSN\
    \ scheme\n  - apply datasets in argument order, each in its own transaction\n\
    \  - stop on the first error and return nonzero\nrules:\n  - schema must already\
    \ exist; api:cli-migrate is a separate command and is not run implicitly\n  -\
    \ seeding is destructive by default because clear-insert truncates targeted tables\n\
    \  - the command targets development and test databases, never a shared production\
    \ database\n  - redact credentials from output and errors\n  - unknown dataset\
    \ names are errors\nnon_goals:\n  - assertion from the CLI; comparison belongs\
    \ to api:test-seed\n  - automatic seeding during api:cli-dev startup\n  - dataset\
    \ generation from a live database\nfuture:\n  - optional api:cli-dev integration\
    \ that reseeds on demand\n```"
  usage: pw seed [name...]
  flags:
    --dir: override the testdata/seed directory
  arguments:
  - each name is a data:seed-dataset path relative to the seed directory
  - no argument applies every .yaml file in the seed directory in lexical order
  execution:
    model: decision:host-tools-target-runtime
    mechanism: resolve the DSN from the application, then open and seed inside the
      CLI process
    dsn: resolved from the application through the api:cli-migrate --pw-print-dsn
      pipe
    engine: decision:dbtestify-integration local_boundary
  behavior:
  - load the effective runtime TOML configuration
  - require middleware.rdb.enabled and fail otherwise
  - open a short-lived pool from the reported DSN and close it before returning
  - resolve the system:dbtestify dialect from the rdb DSN scheme
  - apply datasets in argument order, each in its own transaction
  - stop on the first error and return nonzero
  rules:
  - schema must already exist; api:cli-migrate is a separate command and is not run
    implicitly
  - seeding is destructive by default because clear-insert truncates targeted tables
  - the command targets development and test databases, never a shared production
    database
  - redact credentials from output and errors
  - unknown dataset names are errors
  non_goals:
  - assertion from the CLI; comparison belongs to api:test-seed
  - automatic seeding during api:cli-dev startup
  - dataset generation from a live database
  future:
  - optional api:cli-dev integration that reseeds on demand

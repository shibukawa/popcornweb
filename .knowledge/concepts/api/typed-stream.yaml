id: api:typed-stream
type: api
title: Typed Stream API
summary: pw.Stream negotiates a typed event stream and runs the caller's send loop
  inside a callback, which is the one streaming shape both net/http and a register-a-writer
  backend can run.
facts:
  legacy_body: "pw.Stream negotiates a typed event stream and runs the caller's send\
    \ loop inside a callback, which is the one streaming shape both net/http and a\
    \ register-a-writer backend can run.\n\n```yaml\nsurface:\n  - WriteStream[T](w,\
    \ r, func(*Stream[T]) error)\n  - Stream.Write(T) error, which writes one value\
    \ and flushes it\n  - SetStreamErrorHandler(func(error)), shared with the other\
    \ runtime\nas_built_2026_08_09:\n  net_http: pw.WriteStream, with NewStream and\
    \ the Stream wrapper removed rather than deprecated\n  upstream_followed_2026_08_10:\
    \ tinybind-go v0.5.1 removed its own NewStream outright, so the deprecation window\
    \ closed the way this framework argued it should; the delta stream got the same\
    \ treatment, with OpenStream and OpenLiveStream replaced by callback entries on\
    \ both transports\n  fasthttp: pwfast.WriteStream, the same name and the same\
    \ callback\n  one_type: pw.Stream and pwfast.Stream both alias the module's Stream,\
    \ so the callback parameter is one type and a handler body is the same text on\
    \ both\n  send_became_write: the wrapper renamed the module's Write to Send, and\
    \ keeping that would have made the two bodies differ by a method name the rewrite\
    \ table does not cover, which is the appearance of a shared shape without the\
    \ substance\n  discovery: generation registers the new entry, and the module recognizes\
    \ both names, so a call site is found either way\n  docs: the website teaches\
    \ the callback form in both locales, and the always-close pitfall is gone because\
    \ the runtime closes\nrepresentations:\n  - text/event-stream\n  - application/x-ndjson\n\
    \  - application/ndjson\n  - application/json\nnegotiation:\n  source: Accept\
    \ header\n  unsupported: HTTP 406 problem response, written before the callback\
    \ runs\nimplementation: wraps the TinyBind streaming facility behind pw\ncallback_shape:\n\
    \  shipped_upstream: tinybind-go v0.4.9 replaced the open-then-defer-Close entry\
    \ with a callback on both transports, so this is adoption rather than a proposal\n\
    \  why: a backend that streams by registering a writer runs it after the handler\
    \ returns, so a stream value the handler holds and writes to has no equivalent\
    \ there\n  evidence: fasthttp spells its own streaming 'type StreamWriter func(w\
    \ *bufio.Writer)' with SetBodyStreamWriter, and documents that the writer from\
    \ BodyWriter must not be used after the handler returns\n  net_http: the callback\
    \ runs inline, and Send writes and flushes through http.Flusher\n  register_a_writer_backend:\
    \ the callback is registered and runs afterward, and Send writes and flushes through\
    \ the buffered writer it is handed\n  same_reason_as: api:redirect-response and\
    \ every other surface whose portable form is a callback rather than a value the\
    \ handler keeps writing to\n  replaces: NewStream returning a Stream the handler\
    \ sends on and closes\n  closing: the callback returning is the close, so a stream\
    \ cannot be left open by an early return the way an explicit Close can be missed\n\
    \  no_return_value: the entry point returns nothing, because on the other transport\
    \ the callback runs after the handler returned and an error cannot travel back\
    \ to handler code\n  errors: a callback error is post-commit and reaches an installed\
    \ stream error handler; a failure to open the stream is still an api:problem-response,\
    \ because nothing is committed yet\n  pre_commit_window_dropped:\n    intended:\
    \ defer the commit so a callback failing before its first event could still produce\
    \ a problem response, which is the common case of a query failing before anything\
    \ is written\n    why_not: the other transport runs the callback after the status\
    \ went out, so the window cannot exist there, and keeping it on net/http alone\
    \ would make one callback behave differently per transport\n    cost_accepted:\
    \ a callback failing before writing anything still sends 200 followed by an empty\
    \ stream\n  defects_it_fixed: a missing Close truncating a JSON array document,\
    \ and the documented discard of write errors, both of which the callback makes\
    \ unconditional\nwhat_it_covers:\n  in: server-sent events, newline-delimited\
    \ records, progressive chunked output, long polling, and anything else that keeps\
    \ HTTP framing\n  out: a protocol that stops speaking HTTP after an upgrade handshake,\
    \ WebSocket being that case\n  where_that_goes: api:typed-websocket, an upgrade\
    \ entry taking the request rather than a body writer or a raw connection\n  same_callback_argument:\
    \ that entry takes a callback for the reason this one does, so the two read alike\
    \ and a reader learns one shape\n  choosing_between_them: the stream unless the\
    \ client has to talk after the request, which is the one thing it cannot do\n\
    why_the_shape_had_to_change:\n  before: an adapter was proposed for what the transform\
    \ could not take, and it could never have preserved streaming, since a buffering\
    \ adapter collects the response before writing it\n  after: decision:transport-compatibility-fallback\
    \ records that no adapter was built, so a stream is either written in a rewritable\
    \ shape or it is a refusal\n  effect: this surface is not one option among several;\
    \ it is the only way a streaming handler reaches the second backend at all\n```"
  surface:
  - WriteStream[T](w, r, func(*Stream[T]) error)
  - Stream.Write(T) error, which writes one value and flushes it
  - SetStreamErrorHandler(func(error)), shared with the other runtime
  as_built_2026_08_09:
    net_http: pw.WriteStream, with NewStream and the Stream wrapper removed rather
      than deprecated
    upstream_followed_2026_08_10: tinybind-go v0.5.1 removed its own NewStream outright,
      so the deprecation window closed the way this framework argued it should; the
      delta stream got the same treatment, with OpenStream and OpenLiveStream replaced
      by callback entries on both transports
    fasthttp: pwfast.WriteStream, the same name and the same callback
    one_type: pw.Stream and pwfast.Stream both alias the module's Stream, so the callback
      parameter is one type and a handler body is the same text on both
    send_became_write: the wrapper renamed the module's Write to Send, and keeping
      that would have made the two bodies differ by a method name the rewrite table
      does not cover, which is the appearance of a shared shape without the substance
    discovery: generation registers the new entry, and the module recognizes both
      names, so a call site is found either way
    docs: the website teaches the callback form in both locales, and the always-close
      pitfall is gone because the runtime closes
  representations:
  - text/event-stream
  - application/x-ndjson
  - application/ndjson
  - application/json
  negotiation:
    source: Accept header
    unsupported: HTTP 406 problem response, written before the callback runs
  implementation: wraps the TinyBind streaming facility behind pw
  callback_shape:
    shipped_upstream: tinybind-go v0.4.9 replaced the open-then-defer-Close entry
      with a callback on both transports, so this is adoption rather than a proposal
    why: a backend that streams by registering a writer runs it after the handler
      returns, so a stream value the handler holds and writes to has no equivalent
      there
    evidence: fasthttp spells its own streaming 'type StreamWriter func(w *bufio.Writer)'
      with SetBodyStreamWriter, and documents that the writer from BodyWriter must
      not be used after the handler returns
    net_http: the callback runs inline, and Send writes and flushes through http.Flusher
    register_a_writer_backend: the callback is registered and runs afterward, and
      Send writes and flushes through the buffered writer it is handed
    same_reason_as: api:redirect-response and every other surface whose portable form
      is a callback rather than a value the handler keeps writing to
    replaces: NewStream returning a Stream the handler sends on and closes
    closing: the callback returning is the close, so a stream cannot be left open
      by an early return the way an explicit Close can be missed
    no_return_value: the entry point returns nothing, because on the other transport
      the callback runs after the handler returned and an error cannot travel back
      to handler code
    errors: a callback error is post-commit and reaches an installed stream error
      handler; a failure to open the stream is still an api:problem-response, because
      nothing is committed yet
    pre_commit_window_dropped:
      intended: defer the commit so a callback failing before its first event could
        still produce a problem response, which is the common case of a query failing
        before anything is written
      why_not: the other transport runs the callback after the status went out, so
        the window cannot exist there, and keeping it on net/http alone would make
        one callback behave differently per transport
      cost_accepted: a callback failing before writing anything still sends 200 followed
        by an empty stream
    defects_it_fixed: a missing Close truncating a JSON array document, and the documented
      discard of write errors, both of which the callback makes unconditional
  what_it_covers:
    in: server-sent events, newline-delimited records, progressive chunked output,
      long polling, and anything else that keeps HTTP framing
    out: a protocol that stops speaking HTTP after an upgrade handshake, WebSocket
      being that case
    where_that_goes: api:typed-websocket, an upgrade entry taking the request rather
      than a body writer or a raw connection
    same_callback_argument: that entry takes a callback for the reason this one does,
      so the two read alike and a reader learns one shape
    choosing_between_them: the stream unless the client has to talk after the request,
      which is the one thing it cannot do
  why_the_shape_had_to_change:
    before: an adapter was proposed for what the transform could not take, and it
      could never have preserved streaming, since a buffering adapter collects the
      response before writing it
    after: decision:transport-compatibility-fallback records that no adapter was built,
      so a stream is either written in a rewritable shape or it is a refusal
    effect: this surface is not one option among several; it is the only way a streaming
      handler reaches the second backend at all

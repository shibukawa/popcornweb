id: api:database-selection
type: api
title: Database Group Selection
summary: pw.SelectDB pins one data:database-connection-set group onto a context so
  generated SQL and api:transaction-runner use that group instead of the default.
facts:
  legacy_body: "pw.SelectDB pins one data:database-connection-set group onto a context\
    \ so generated SQL and api:transaction-runner use that group instead of the default.\n\
    \n```yaml\nshape:\n  direction: policy:request-scoped-accessor-shape moves the\
    \ first parameter from a context to the request, and the return stays context.Context\n\
    \  form: SelectDB(r, group) context.Context, alongside SelectDBContext(ctx, group)\
    \ for a caller below the handler\n  unchanged: everything below about effective\
    \ group, child contexts, transaction scope, and unknown groups, because the pin\
    \ remains a property of the returned value\n  status: proposed\nsurface:\n  -\
    \ SelectDB(context.Context, group string) context.Context\n  - DB(context.Context)\
    \ (*sql.DB, bool) returns the pool of the effective group\n  - SelectWriteDB(context.Context)\
    \ pins the resolved write group\n  - SelectSessionDB(context.Context) pins the\
    \ resolved session group\n  - RDBConfig.MigrationDSN() reports the migration group\
    \ DSN for tooling\nresolved_pointers:\n  owner: policy:connection-group-selection\n\
    \  reason: a caller that must write should not have to know the deployment topology\n\
    effective_group:\n  order:\n    - the group pinned by the nearest SelectDB\n \
    \   - the group of the active data:transaction-scope\n    - default_group\n  property:\
    \ unpinned SQL inside a transaction stays on the transaction group, so a writer\
    \ transaction never leaks a read to a replica\nexecutor_resolution:\n  - use the\
    \ active data:transaction-scope transaction when its group equals the effective\
    \ group\n  - otherwise use an explicit sqlbind executor installed in context\n\
    \  - otherwise use the memoized round-robin connection of the effective group\n\
    \  - mark the executor read-only when the selected connection is readonly\n  -\
    \ decorate the result per api:instrumented-sql-executor when query diagnostics\
    \ are enabled\nunknown_group:\n  form: SelectDB returns a context rather than\
    \ an error, so the failure is deferred\n  effect: the first executor resolution,\
    \ DB call, or Transaction on that context returns a named unknown-group error\n\
    \  reason: a group name is data, and a poisoned context fails at the statement\
    \ that depended on it instead of panicking at selection\n  collapsed_set: answers\
    \ every name, so a single-database deployment never reaches this error\nescaping_a_transaction:\n\
    \  case: SelectDB names a group other than the active scope group\n  allowed:\
    \ only when the named group is readonly\n  effect: statements run on that group's\
    \ pool, outside the transaction and without its atomicity\n  writable_target:\
    \ rejected, because a write outside the open transaction reads as atomic and is\
    \ not\nrules:\n  - selection never opens, commits, or rolls back a transaction,\
    \ per decision:explicit-transaction-boundary\n  - a pinned group survives into\
    \ every child context, including one created by api:transaction-runner\n  - api:transaction-runner\
    \ carries no group option, so one statement and one whole transaction name a group\
    \ the same way\n  - the round-robin cursor advances once per group per context\
    \ chain, so repeated statements reuse one connection\n  - callers cannot enumerate\
    \ the set, read a cursor, or install a connection of their own\n  - api:request-context-accessors\
    \ exposes no group list, and the group name never reaches a log as a secret\n\
    ```"
  shape:
    direction: policy:request-scoped-accessor-shape moves the first parameter from
      a context to the request, and the return stays context.Context
    form: SelectDB(r, group) context.Context, alongside SelectDBContext(ctx, group)
      for a caller below the handler
    unchanged: everything below about effective group, child contexts, transaction
      scope, and unknown groups, because the pin remains a property of the returned
      value
    status: proposed
  surface:
  - SelectDB(context.Context, group string) context.Context
  - DB(context.Context) (*sql.DB, bool) returns the pool of the effective group
  - SelectWriteDB(context.Context) pins the resolved write group
  - SelectSessionDB(context.Context) pins the resolved session group
  - RDBConfig.MigrationDSN() reports the migration group DSN for tooling
  resolved_pointers:
    owner: policy:connection-group-selection
    reason: a caller that must write should not have to know the deployment topology
  effective_group:
    order:
    - the group pinned by the nearest SelectDB
    - the group of the active data:transaction-scope
    - default_group
    property: unpinned SQL inside a transaction stays on the transaction group, so
      a writer transaction never leaks a read to a replica
  executor_resolution:
  - use the active data:transaction-scope transaction when its group equals the effective
    group
  - otherwise use an explicit sqlbind executor installed in context
  - otherwise use the memoized round-robin connection of the effective group
  - mark the executor read-only when the selected connection is readonly
  - decorate the result per api:instrumented-sql-executor when query diagnostics are
    enabled
  unknown_group:
    form: SelectDB returns a context rather than an error, so the failure is deferred
    effect: the first executor resolution, DB call, or Transaction on that context
      returns a named unknown-group error
    reason: a group name is data, and a poisoned context fails at the statement that
      depended on it instead of panicking at selection
    collapsed_set: answers every name, so a single-database deployment never reaches
      this error
  escaping_a_transaction:
    case: SelectDB names a group other than the active scope group
    allowed: only when the named group is readonly
    effect: statements run on that group's pool, outside the transaction and without
      its atomicity
    writable_target: rejected, because a write outside the open transaction reads
      as atomic and is not
  rules:
  - selection never opens, commits, or rolls back a transaction, per decision:explicit-transaction-boundary
  - a pinned group survives into every child context, including one created by api:transaction-runner
  - api:transaction-runner carries no group option, so one statement and one whole
    transaction name a group the same way
  - the round-robin cursor advances once per group per context chain, so repeated
    statements reuse one connection
  - callers cannot enumerate the set, read a cursor, or install a connection of their
    own
  - api:request-context-accessors exposes no group list, and the group name never
    reaches a log as a secret

id: data:account-bootstrap-credential
type: data
title: Account Bootstrap Credential
summary: An issued login ID and temporary secret authorize one bounded passkey enrollment,
  not reusable password login.
facts:
  legacy_body: "An issued login ID and temporary secret authorize one bounded passkey\
    \ enrollment, not reusable password login.\n\n```yaml\nfields:\n  account_id:\
    \ provisional data:user-account identifier\n  login_id: administrator-issued public\
    \ identifier\n  secret_digest: digest or keyed digest of a generated high-entropy\
    \ secret\n  purpose: initial_passkey or recovery_passkey\n  issued_at: timestamp\n\
    \  expires_at: timestamp\n  attempts_remaining: bounded integer\n  consumed_at:\
    \ nullable timestamp\nlifecycle:\n  - generate an unpredictable single-use secret\n\
    \  - reveal the raw secret only at issuance\n  - verify with constant-time comparison\n\
    \  - atomically consume after successful passkey persistence\n  - revoke on expiry,\
    \ exhaustion, replacement, or administrator action\nrules:\n  - UI may call the\
    \ secret a temporary password\n  - protocol semantics remain a single-use bootstrap\
    \ credential\n  - never store or log the raw secret\n  - never grant a normal\
    \ authenticated application session by itself\n  - application owns persistence\
    \ and identifier format\n```"
  fields:
    account_id: provisional data:user-account identifier
    login_id: administrator-issued public identifier
    secret_digest: digest or keyed digest of a generated high-entropy secret
    purpose: initial_passkey or recovery_passkey
    issued_at: timestamp
    expires_at: timestamp
    attempts_remaining: bounded integer
    consumed_at: nullable timestamp
  lifecycle:
  - generate an unpredictable single-use secret
  - reveal the raw secret only at issuance
  - verify with constant-time comparison
  - atomically consume after successful passkey persistence
  - revoke on expiry, exhaustion, replacement, or administrator action
  rules:
  - UI may call the secret a temporary password
  - protocol semantics remain a single-use bootstrap credential
  - never store or log the raw secret
  - never grant a normal authenticated application session by itself
  - application owns persistence and identifier format
relations:
- relation: mentions
  to: data:user-account
  resolution: resolved

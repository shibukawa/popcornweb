id: data:runtime-environment
type: data
title: Runtime Environment
summary: A single process-level environment token selects deployment-specific configuration
  before any configbind target is loaded.
facts:
  legacy_body: "A single process-level environment token selects deployment-specific\
    \ configuration before any configbind target is loaded.\n\n```yaml\nselection:\n\
    \  source: APP_ENV environment variable, then APP_ENV in ./.env and ./.env.local\
    \ when the process did not set it, per policy:dotenv-resolution\n  default: dev\
    \ when neither sets it\n  scope: process-level, resolved once before api:runtime-configuration\
    \ ParseConfig\nknown_values:\n  dev: local development\n  stg: staging\n  prod:\
    \ production\nextension:\n  allowed: any additional token beyond the known values\n\
    \  charset: lowercase letters, digits, hyphen, underscore\n  rejected:\n    -\
    \ dot\n    - path separator\n    - uppercase\n    - whitespace\nvalidation:\n\
    \  invalid_token: startup error before configuration load\n  unknown_but_valid_token:\
    \ accepted without warning\nconsumers:\n  - policy:config-file-resolution local\
    \ file naming\n  - api:runtime-configuration exposed value\n  - api:cli-dev default\
    \ environment\nrules:\n  - the token is data, not a feature switch; framework\
    \ behavior keys off explicit configuration fields\n  - the resolved token is immutable\
    \ for the process lifetime\n  - the token is safe to log unredacted\n```"
  selection:
    source: APP_ENV environment variable, then APP_ENV in ./.env and ./.env.local
      when the process did not set it, per policy:dotenv-resolution
    default: dev when neither sets it
    scope: process-level, resolved once before api:runtime-configuration ParseConfig
  known_values:
    dev: local development
    stg: staging
    prod: production
  extension:
    allowed: any additional token beyond the known values
    charset: lowercase letters, digits, hyphen, underscore
    rejected:
    - dot
    - path separator
    - uppercase
    - whitespace
  validation:
    invalid_token: startup error before configuration load
    unknown_but_valid_token: accepted without warning
  consumers:
  - policy:config-file-resolution local file naming
  - api:runtime-configuration exposed value
  - api:cli-dev default environment
  rules:
  - the token is data, not a feature switch; framework behavior keys off explicit
    configuration fields
  - the resolved token is immutable for the process lifetime
  - the token is safe to log unredacted
relations:
- relation: mentions
  to: api:cli-dev
  resolution: resolved
- relation: mentions
  to: api:runtime-configuration
  resolution: resolved
- relation: mentions
  to: policy:config-file-resolution
  resolution: resolved
- relation: mentions
  to: policy:dotenv-resolution
  resolution: resolved

id: data:passkey-credential
type: data
title: Passkey Credential
summary: A passkey credential associates a requirement:contrib-passkey credential
  record with one data:user-account.
facts:
  legacy_body: "A passkey credential associates a requirement:contrib-passkey credential\
    \ record with one data:user-account.\n\n```yaml\nfields:\n  account_id: data:user-account\
    \ identifier\n  credential_id: globally unique bytes\n  user_handle: account passkey\
    \ user handle\n  public_key: normalized ES256 key\n  algorithm: COSE algorithm\n\
    \  sign_count: integer\n  backup_eligible: bool\n  backup_state: bool\n  transports:\
    \ bounded optional list\n  created_at: timestamp\n  last_used_at: optional timestamp\n\
    \  label: optional user-visible string\nrules:\n  - multiple credentials per account\
    \ are allowed\n  - private key material never reaches the server\n  - accepted\
    \ counter and backup changes persist atomically\n  - disabled or deleted credentials\
    \ cannot authenticate\n  - application owns persistence without a required repository\
    \ type\n```"
  fields:
    account_id: data:user-account identifier
    credential_id: globally unique bytes
    user_handle: account passkey user handle
    public_key: normalized ES256 key
    algorithm: COSE algorithm
    sign_count: integer
    backup_eligible: bool
    backup_state: bool
    transports: bounded optional list
    created_at: timestamp
    last_used_at: optional timestamp
    label: optional user-visible string
  rules:
  - multiple credentials per account are allowed
  - private key material never reaches the server
  - accepted counter and backup changes persist atomically
  - disabled or deleted credentials cannot authenticate
  - application owns persistence without a required repository type
relations:
- relation: mentions
  to: data:user-account
  resolution: resolved
- relation: mentions
  to: requirement:contrib-passkey
  resolution: resolved

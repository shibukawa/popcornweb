id: data:project-config
type: data
title: Project Configuration
summary: popcornweb.toml contains only pw build and development tooling configuration; runtime application settings
  belong to configbind inputs.
facts:
  legacy_body: "popcornweb.toml contains only pw build and development tooling configuration; runtime application\
    \ settings belong to configbind inputs.\n\n```yaml\nfile: popcornweb.toml\nschema:\n  project:\n    name: myapp\n\
    \    kind: application or package, defaulting to application; a package project is a concept:component-package\
    \ and carries the data:component-package-manifest package section\n    main: ./cmd/myapp, required for an application\
    \ and absent for a package\n    toolchain: tinygo or go, defaulting to tinygo\n    database: sqlite, postgres,\
    \ or mysql, defaulting to sqlite\n  dev:\n    watch:\n      includes: []\n      excludes: []\n    idp:\n   \
    \   enabled: false\n      config: devidp.toml\n      port: 0 for an automatically reserved loopback port; api:cli-init\
    \ writes a fixed one, because the issuer it appears in is part of the account identity\n    otel:\n      enabled:\
    \ true\n      port: 0 for an automatically reserved loopback port, which is the OTLP receiver rather than the\
    \ viewer page\n      max: 0 for the system:localotelviewer retention default\n    logs:\n      enabled: true\n\
    \      directory: .log, relative to the file and used by requirement:local-jsonl-log-capture\n    console:\n\
    \      enabled: true\n      port: 18081, a fixed loopback port scaffolded by api:cli-init as dev.idp.port is,\
    \ placed beside the 18080 the identity provider already takes\n      overlay:\n        enabled: true\n     \
    \   reload: true\n      launcher:\n        enabled: true\n        corner: bottom-left, and one of bottom-left,\
    \ bottom-right, top-left, top-right\n      storybook:\n        enabled: true\n      queries:\n        enabled:\
    \ true\n      data:\n        enabled: true\n      assets:\n        enabled: true\n      api:\n        enabled:\
    \ true\n  generate:\n    handlers: [handlers] as scaffolded, per decision:explicit-generation-sources\n    templates:\
    \ [handlers, templates] as scaffolded, because a page template sits beside its handler\n    queries: [queries]\
    \ as scaffolded\n    config: [cmd/myapp] as scaffolded\n    pages: [pages] as scaffolded for a project with\
    \ a concept:page-tree, and empty otherwise\n    dynamo: [records] as scaffolded for a project with requirement:dynamodb-store,\
    \ and empty otherwise\n    line_directives: false as scaffolded. requirement:template-source-positions, a project\
    \ setting rather than a flag because api:cli-check compares against a fresh generation and output that varied\
    \ by who ran it would report drift everywhere\n  migration:\n    dir: migrations\n    auto: true for api:cli-dev\
    \ only\n  seed:\n    auto: true for api:cli-dev only\n  packages:\n    form: an array of tables naming the concept:component-package\
    \ modules the application uses, per decision:declared-package-installation\n    entry: module, the Go module\
    \ path, which must also be in go.mod\n    absent: the empty list, because a project that uses no package has\
    \ nothing to name\n  assets:\n    tailwind:\n      enabled: false\n      input: assets/app.css\n      output:\
    \ public/generated/app.css\n      minify: true for api:cli-build\n  deploy:\n    cloudflare:\n      compiler:\
    \ tinygo or go, defaulting to project.toolchain, per requirement:cloudflare-workers-build-target\n      name:\
    \ the Worker name written into wrangler.jsonc, defaulting to project.name\n      compatibility_date: the Wrangler\
    \ compatibility date, defaulting to the date the pw release pins\n      d1: an array of tables naming the D1\
    \ databases behind the d1:// bindings config.prod.toml uses, per requirement:cloudflare-d1-engine; each element\
    \ carries binding, database_name and database_id\n      r2:\n        binding: the bucket binding the external\
    \ public tree is served from, per requirement:cloudflare-r2-storage\n        bucket_name: the R2 bucket's name,\
    \ defaulting to the binding in lower case\n      kv: an array of tables naming the KV namespaces behind the\
    \ bindings config.prod.toml uses, per requirement:cloudflare-kv-backends; each element carries binding and id\n\
    optional_extensions:\n  - generated output rules\n  - generated test policy\n  - build tags and targets\n  -\
    \ build output location\nrules:\n  - project.kind selects which commands apply and which keys are legal, per\
    \ api:cli-package; a missing key means application, because it was the only kind before the key existed\n  -\
    \ a packages entry is what links its module, because api:cli-generate emits the blank import from it; a module\
    \ in go.mod and not in this list is an ordinary dependency\n  - a packages entry naming a module with no data:component-package-manifest\
    \ package section is an error\n  - api:cli-generate reads each source kind only under the generate purpose that\
    \ owns it, and warns about a .pw.html, .pw.sql, or .pw.dynamo outside its purpose\n  - every generate purpose\
    \ key is required except generate.pages and generate.dynamo; an empty list states that the purpose generates\
    \ nothing\n  - a missing generate.dynamo means the empty list, for the same reason generate.pages does; requirement:dynamodb-store\
    \ is a capability a project acquires rather than one it always had\n  - project.database names the SQL engine\
    \ only, and says nothing about requirement:dynamodb-store, which is configured at runtime and never here\n \
    \ - a missing generate.pages means the empty list, because a project scaffolded before requirement:discovered-page-routing\
    \ has no concept:page-tree and no way to acquire one silently\n  - a generate.pages entry is a tree root, so\
    \ it is neither nested in another root nor listed under generate.templates or generate.handlers\n  - the scaffolded\
    \ directory names are defaults, not identity: handlers and pages are what api:cli-init writes, and every consumer\
    \ reads the purpose list instead of the name, so renaming a tree is moving the directory and editing its entry\n\
    \  - a generated package name follows the directory it is in, so a renamed tree compiles without an edit to\
    \ its sources\n  - a generate entry is relative, names an existing directory, and is neither duplicated nor\
    \ nested inside another entry of the same purpose\n  - one generate.templates entry holds the requirement:nested-html-templates\
    \ document shell, and a second one is an error\n  - api:cli-dev regenerates from the generate purposes but watches\
    \ per decision:developer-loop-watch-scope\n  - dev.watch.includes adds relative files or glob patterns, and\
    \ dev.watch.excludes skips directory subtrees\n  - project.toolchain records the compiler api:cli-init scaffolded\
    \ for and rejects any other value\n  - a missing project.toolchain means tinygo, because every project scaffolded\
    \ before the key used api:serve-mux\n  - project.database records the requirement:database-engine-selection\
    \ engine and rejects any other value\n  - a missing project.database means sqlite, because it was the only engine\
    \ that existed before the key\n  - project.database is a generation input, not a runtime one; the effective\
    \ engine still comes from the rule:rdb-dsn-resolution scheme, and the two must agree\n  - migration.dir locates\
    \ data:migration-source and is a tooling path, not a runtime database value\n  - migration.auto only enables\
    \ the api:cli-dev apply step and never enables application startup apply\n  - seed.auto only enables the api:cli-dev\
    \ reseed step and never seeds from application startup, api:cli-migrate, or a build\n  - seed.auto has no directory\
    \ key beside it; the datasets are the api:cli-seed default location, and its --dir flag stays the way a one-off\
    \ run points elsewhere\n  - dev.idp only affects api:cli-dev and locates data:devidp-config\n  - dev.idp.port\
    \ defaults to an automatically reserved port because api:cli-dev injects the resolved issuer into the application\n\
    \  - dev.idp.enabled true requires the data:devidp-config file to exist\n  - dev.otel only affects api:cli-dev\
    \ and configures requirement:dev-telemetry-viewer\n  - dev.otel.port defaults to an automatically reserved port\
    \ because api:cli-dev injects the resolved endpoint, as it does for dev.idp\n  - dev.otel.max bounds retained\
    \ records per signal and zero keeps the viewer default\n  - dev.logs only affects api:cli-dev and configures\
    \ requirement:local-jsonl-log-capture\n  - dev.logs.directory must be a relative directory within the project;\
    \ it cannot name the project root or escape it\n  - a missing dev.logs block keeps local JSONL capture enabled\
    \ at .log, so existing projects acquire the developer convenience without runtime behavior changing\n  - dev.console\
    \ only affects api:cli-dev and configures requirement:dev-console\n  - dev.console.port is fixed rather than\
    \ reserved, because a console is bookmarked and returned to, and a reserved port would move every run\n  - dev.console.enabled\
    \ false disables every pane, including the requirement:dev-telemetry-viewer page, while dev.otel.enabled still\
    \ governs whether records are received at all\n  - a dev.console pane key disables one pane and nothing else,\
    \ and a missing pane key means enabled\n  - dev.console.overlay.reload only reloads a page requirement:dev-error-overlay\
    \ is already attached to, and never restarts anything\n  - dev.console.launcher.enabled serves requirement:dev-console-launcher,\
    \ and it is independent of dev.console.overlay.enabled because a developer who wants the way in does not necessarily\
    \ want a sheet over the page\n  - dev.console.launcher.enabled and dev.console.overlay.enabled both false inject\
    \ no console address into the application, which is what makes a served page byte-identical to a production\
    \ render\n  - dev.console.launcher.corner names one of the four corners and rejects any other value, as project.toolchain\
    \ and project.database reject theirs; a silent fallback would leave a typo looking like a default the project\
    \ chose\n  - a missing dev.console.launcher.corner means bottom-left, which is the corner applications are least\
    \ likely to have taken for themselves\n  - dev.console.launcher.corner is read by the application process at\
    \ startup, like the console address it travels with, so a changed corner arrives with the restart the edited\
    \ file already causes\n  - dev.console.storybook.enabled false builds and starts no decision:dev-harness-process\
    \ binary, because nothing else needs it\n  - dev.console.data.enabled serves the requirement:dev-data-pane browser\
    \ and editor, and dev.console.queries.enabled the requirement:dev-query-runner halves on the same pane\n  -\
    \ both false leave the application serving no pane, so it announces nothing and decision:dev-application-attachment\
    \ does not arise\n  - relative paths resolve from the config file directory\n  - unknown keys are errors\n \
    \ - command flags override config values\n  - missing config is an error except for api:cli-init\n  - server,\
    \ session, security, middleware, and observability runtime values are forbidden, and so is a database connection\
    \ value; project.database names an engine, never a DSN or a credential\n  - enabled Tailwind validates requirement:tailwind-css-integration\
    \ and decision:tailwind-host-toolchain\n  - deploy.cloudflare is read by api:cli-build --target cloudflare-workers\
    \ only; deploy.cloudflare.compiler rejects any value but tinygo or go, and a missing table means every default\n\
    \  - deploy.cloudflare.compiler = tinygo is refused when project.toolchain is go, because such a project routes\
    \ through the standard ServeMux, whose method patterns TinyGo does not match; go under a tinygo project is accepted\n\
    \  - deploy.cloudflare.compatibility_date is a YYYY-MM-DD date, because Wrangler rejects anything else at deploy\
    \ time rather than at build time\n  - a deploy.cloudflare.d1 element names its binding, names each binding once,\
    \ and carries no key but binding, database_name and database_id; a binding the production configuration uses\
    \ and the table does not name still reaches wrangler.jsonc under a derived name\n  - Tailwind plugins and their\
    \ options belong to the CSS entry through requirement:tailwind-plugin-integration\n  - the CLI must already\
    \ be available from the entered Devbox environment\nruntime_configuration:\n  owner: api:runtime-configuration\n\
    \  file_selection: policy:config-file-resolution\n  inputs:\n    - TOML selected by configbind\n    - environment\n\
    \    - CLI flags\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: "while parsing a block mapping\n  in \"<unicode string>\", line 44, column 5:\n        handlers: [handlers]\
      \ as scaffold ... \n        ^\nexpected <block end>, but found '<scalar>'\n  in \"<unicode string>\", line\
      \ 44, column 26:\n        handlers: [handlers] as scaffolded, per decision:expl ... \n                   \
      \          ^"
  asset_locations:
    assets.public: public
    assets.derived: dist/public
    assets.embed: public.go
    base: Directory containing popcornweb.toml
    contract: requirement:configurable-public-asset-locations

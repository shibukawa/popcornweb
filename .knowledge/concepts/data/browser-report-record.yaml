id: data:browser-report-record
type: data
title: Browser Report Record
summary: One report delivered to requirement:browser-report-ingest is normalized from
  either payload dialect into one bounded record before api:logger writes it.
facts:
  legacy_body: "One report delivered to requirement:browser-report-ingest is normalized\
    \ from either payload dialect into one bounded record before api:logger writes\
    \ it.\n\n```yaml\ninput_dialects:\n  reporting_api:\n    content_type: application/reports+json\n\
    \    shape: a JSON array of objects carrying age, type, url, user_agent and body\n\
    \    csp_body_keys: documentURL, referrer, blockedURL, effectiveDirective, originalPolicy,\
    \ disposition, statusCode, sourceFile, sample, lineNumber, columnNumber\n  legacy_report_uri:\n\
    \    content_type: application/csp-report\n    shape: one object under a csp-report\
    \ key\n    keys: document-uri, referrer, blocked-uri, violated-directive, effective-directive,\
    \ original-policy, disposition, status-code, source-file, script-sample, line-number,\
    \ column-number\n  why_both: the report-uri directive is still emitted for the\
    \ Firefox range that parses Reporting-Endpoints without honouring report-to, so\
    \ both dialects arrive at one path\n  normalization: the legacy body is read as\
    \ a csp-violation whose age is zero, so one record shape covers both and nothing\
    \ downstream asks which dialect arrived\nseverity:\n  crash: error\n  network-error:\
    \ warn\n  csp-violation: warn\n  integrity-violation: warn\n  coep: warn\n  coop:\
    \ warn\n  permissions-policy-violation: warn\n  deprecation: info\n  intervention:\
    \ info\n  unrecognized: info\n  rationale: a blocked resource is a page that did\
    \ not work and a notice is a page that will stop working, which are different\
    \ readings and should not share a level\nmessage: browser report\nattributes:\n\
    \  report.type: the reported type, truncated\n  report.url: document URL, origin\
    \ and path only\n  report.age_ms: int64, zero for the legacy dialect\n  report.message:\
    \ the notice text of a non-CSP type, truncated\n  report.source_file: script URL,\
    \ origin and path only\n  report.line: int64\n  report.column: int64\n  report.id:\
    \ the deprecation or intervention identifier, truncated\n  csp.effective_directive:\
    \ the directive that matched\n  csp.blocked_url: origin and path, or the scheme\
    \ alone for an opaque scheme\n  csp.disposition: enforce or report\n  csp.sample:\
    \ the violating text the browser sampled, already capped at 40 characters by the\
    \ CSP specification\n  net.phase: dns, connection, or application, from requirement:network-error-logging\n\
    \  net.error_type: the reported failure, such as dns.name_not_resolved or tls.cert.invalid\n\
    \  net.elapsed_ms: int64\n  net.method: the request method\n  net.protocol: the\
    \ ALPN protocol name\n  net.status_code: int64\n  net.sampling_fraction: float64,\
    \ without which a count of these records means nothing\n  net.server_ip: recorded\
    \ only when it is this deployment's own address\nnever_recorded:\n  request_headers_and_response_headers:\
    \ an NEL policy may ask a browser to include them, and this framework never does,\
    \ because they carry caller headers into a log record\n  original_policy: echoes\
    \ the deployment's own configured policy on every violation and adds nothing the\
    \ configuration does not already state\n  user_agent: high cardinality, and the\
    \ access log holds it for the same request\n  referrer: report.url already names\
    \ the page that broke, and a referrer can carry a query nobody meant to log\n\
    \  raw_body: including in the parse-failure diagnostic, which names the length\
    \ and the content type only\nbounds:\n  string_attribute: a fixed byte cap per\
    \ value, because every field here is written by whoever posts to the endpoint\n\
    \  url_shaped: query and fragment stripped before truncation\n  opaque_scheme:\
    \ a data:, blob: or filesystem: URL is reduced to its scheme, since the rest of\
    \ it is the injected payload\n  numeric: a non-numeric line or column is dropped\
    \ rather than coerced\n  escaping: policy:log-emission escapes control characters\
    \ and line breaks, and this record adds no second implementation of that\nrules:\n\
    \  - every attribute follows data:log-attribute, so values stay scalar and no\
    \ reserved record field can be replaced\n  - an unrecognized report type is recorded\
    \ rather than refused, because the type set grows without this framework changing\n\
    \  - a report missing the fields its type declares is still recorded, with the\
    \ absent attributes omitted rather than emitted empty\n  - policy:query-log-safety\
    \ is untouched here; nothing on this path reaches a database\n```"
  legacy_parse_issues:
  - kind: legacy_parse_error
    block: 0
    message: "mapping values are not allowed here\n  in \"<unicode string>\", line\
      \ 55, column 31:\n      opaque_scheme: a data:, blob: or filesystem: URL is\
      \ reduced  ... \n                                  ^"
relations:
- relation: mentions
  to: api:logger
  resolution: resolved
- relation: mentions
  to: data:log-attribute
  resolution: resolved
- relation: mentions
  to: policy:log-emission
  resolution: resolved
- relation: mentions
  to: policy:query-log-safety
  resolution: resolved
- relation: mentions
  to: requirement:browser-report-ingest
  resolution: resolved
- relation: mentions
  to: requirement:network-error-logging
  resolution: resolved

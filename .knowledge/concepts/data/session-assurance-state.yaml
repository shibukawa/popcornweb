id: data:session-assurance-state
type: data
title: Session Assurance State
summary: Assurance state is the whole of what proved this session and when, held in
  the plugin/auth slot of api:session-registry, together with the `[auth]` keys that
  bound how stale a proof may be.
facts:
  legacy_body: "Assurance state is the whole of what proved this session and when,\
    \ held in the plugin/auth slot of api:session-registry, together with the `[auth]`\
    \ keys that bound how stale a proof may be.\n\n```yaml\nownership:\n  principle:\
    \ plugin/auth owns what proved the session, when, and whether that is still enough;\
    \ the session package owns only where those bytes live\n  boundary: concept:session-storage-boundary\n\
    \  slot: one registered session.Private slot, stored exactly like an application's\
    \ own\n  why_not_the_record:\n    - every field here answers how well the subject\
    \ is proved, which data:session-record has no basis to answer for an anonymous\
    \ browser\n    - a provider proof time is an OpenID Connect concept, and passkey_only\
    \ has no provider at all\n    - a record field would be permanently empty in every\
    \ deployment that uses no provider, and in every session that holds only a cart\n\
    \    - api:session-manager stores the slot as opaque encoded data and never learns\
    \ what an issuer is\nfields:\n  authenticated_at: time of the most recent authentication-strength\
    \ change\n  authentication_method: unordered label such as oidc or passkey\n \
    \ provider_authenticated_at: verified auth_time of the identity provider when\
    \ the proof came from OIDC, supplied by requirement:contrib-oidc\n  reauth_count:\
    \ completed re-proofs on this session, for audit only\n  step_up_at: the single-use\
    \ admission stamp of api:assurance-guard\nmoved_from_the_record:\n  keys: authenticated_at\
    \ and authentication_method\n  was: data:session-record fields exposed on the\
    \ generic session view\n  now: slot fields exposed through auth accessors\n  effect:\
    \ a handler asks plugin/auth how fresh the proof is, and never asks the session\
    \ package\nstrength:\n  today: the existing unordered authentication_method label,\
    \ recorded and audited but never compared\n  deferred: an ordered label set and\
    \ the auth.assurance.strengths key, for the reason api:assurance-guard gives\n\
    \  effect: nothing in the request view ranks one method above another, so no handler\
    \ can accidentally depend on an ordering the framework invented\nprovider_time:\n\
    \  reason: a provider may satisfy a max_age request from its own single sign-on\
    \ session, so the callback time is not the proof time\n  rule: freshness is measured\
    \ from provider_authenticated_at when present, otherwise from authenticated_at\n\
    \  absent: a provider returning no auth_time cannot satisfy a freshness requirement\
    \ through OIDC re-proof\nconfig_fields:\n  binding: every key is under [auth],\
    \ because none of them means anything to a session that carries no identity\n\
    \  auth.recent_auth_max_age: the existing duration, default 5m, which becomes\
    \ the default maximum age of a guard naming none\n  auth.assurance.policy.<name>.max_age:\
    \ a named window an api:assurance-guard Requirement resolves, so user experience\
    \ is deployment-tunable\n  auth.assurance.hint: the keys policy:session-downgrade\
    \ defines, which are the hint's own absolute and idle bounds and not the session's\n\
    \  auth.session: the ttl, idle_timeout, and renewal_interval keys decision:session-lifetime-owned-by-auth\
    \ moved here, so a guard window and the session bound it must fit inside are declared\
    \ together\nabsolute_expiry_on_reproof:\n  behavior: re-proof resets it, because\
    \ api:session-manager Rotate revokes and creates, and creation stamps a fresh\
    \ CreatedAt and ExpiresAt\n  aligned_with: the reauthentication rule of policy:session-security\
    \ and the NIST rule that a successful reauthentication resets both timeouts\n\
    \  not_configurable: preserving the original absolute expiry across a rotation\
    \ would need a new session-package capability, and no requirement asks for one\n\
    \  revisit_when: a deployment states that its absolute expiry is a theft bound\
    \ it needs held across re-proof\n  side_effect: CreatedAt is restamped, so a session\
    \ keeps no memory of when it first began; nothing reads that today\nvalidation:\n\
    \  - auth.recent_auth_max_age stays positive whenever any guard or enrollment\
    \ path is reachable\n  - a guard may name a max age of zero, which means prove\
    \ again for this operation and is not the same as naming none\n  - a Requirement\
    \ naming an undefined auth.assurance.policy entry fails startup rather than at\
    \ request time\n  - every auth.assurance.policy entry declares max_age, and a\
    \ zero value is valid and carries the zero_semantics of api:assurance-guard\n\
    \  - data:authentication-runtime-config mode_validation refuses an assurance key\
    \ the selected mode cannot honor\nrules:\n  - the request view exposes the method\
    \ label and effective freshness, never a token, an ID Token body, or a raw claim\n\
    \  - re-proof updates authenticated_at, provider_authenticated_at, authentication_method,\
    \ and reauth_count in one rotation\n  - re-proof resets idle and absolute expiry\
    \ together, per absolute_expiry_on_reproof above\n  - the method label changes\
    \ only through a new proof, never through elapsed time\n  - a stored record predating\
    \ these fields reads as having no provider proof time rather than failing, which\
    \ the data:session-record version field already governs\n```"
  ownership:
    principle: plugin/auth owns what proved the session, when, and whether that is
      still enough; the session package owns only where those bytes live
    boundary: concept:session-storage-boundary
    slot: one registered session.Private slot, stored exactly like an application's
      own
    why_not_the_record:
    - every field here answers how well the subject is proved, which data:session-record
      has no basis to answer for an anonymous browser
    - a provider proof time is an OpenID Connect concept, and passkey_only has no
      provider at all
    - a record field would be permanently empty in every deployment that uses no provider,
      and in every session that holds only a cart
    - api:session-manager stores the slot as opaque encoded data and never learns
      what an issuer is
  fields:
    authenticated_at: time of the most recent authentication-strength change
    authentication_method: unordered label such as oidc or passkey
    provider_authenticated_at: verified auth_time of the identity provider when the
      proof came from OIDC, supplied by requirement:contrib-oidc
    reauth_count: completed re-proofs on this session, for audit only
    step_up_at: the single-use admission stamp of api:assurance-guard
  moved_from_the_record:
    keys: authenticated_at and authentication_method
    was: data:session-record fields exposed on the generic session view
    now: slot fields exposed through auth accessors
    effect: a handler asks plugin/auth how fresh the proof is, and never asks the
      session package
  strength:
    today: the existing unordered authentication_method label, recorded and audited
      but never compared
    deferred: an ordered label set and the auth.assurance.strengths key, for the reason
      api:assurance-guard gives
    effect: nothing in the request view ranks one method above another, so no handler
      can accidentally depend on an ordering the framework invented
  provider_time:
    reason: a provider may satisfy a max_age request from its own single sign-on session,
      so the callback time is not the proof time
    rule: freshness is measured from provider_authenticated_at when present, otherwise
      from authenticated_at
    absent: a provider returning no auth_time cannot satisfy a freshness requirement
      through OIDC re-proof
  config_fields:
    binding: every key is under [auth], because none of them means anything to a session
      that carries no identity
    auth.recent_auth_max_age: the existing duration, default 5m, which becomes the
      default maximum age of a guard naming none
    auth.assurance.policy.<name>.max_age: a named window an api:assurance-guard Requirement
      resolves, so user experience is deployment-tunable
    auth.assurance.hint: the keys policy:session-downgrade defines, which are the
      hint's own absolute and idle bounds and not the session's
    auth.session: the ttl, idle_timeout, and renewal_interval keys decision:session-lifetime-owned-by-auth
      moved here, so a guard window and the session bound it must fit inside are declared
      together
  absolute_expiry_on_reproof:
    behavior: re-proof resets it, because api:session-manager Rotate revokes and creates,
      and creation stamps a fresh CreatedAt and ExpiresAt
    aligned_with: the reauthentication rule of policy:session-security and the NIST
      rule that a successful reauthentication resets both timeouts
    not_configurable: preserving the original absolute expiry across a rotation would
      need a new session-package capability, and no requirement asks for one
    revisit_when: a deployment states that its absolute expiry is a theft bound it
      needs held across re-proof
    side_effect: CreatedAt is restamped, so a session keeps no memory of when it first
      began; nothing reads that today
  validation:
  - auth.recent_auth_max_age stays positive whenever any guard or enrollment path
    is reachable
  - a guard may name a max age of zero, which means prove again for this operation
    and is not the same as naming none
  - a Requirement naming an undefined auth.assurance.policy entry fails startup rather
    than at request time
  - every auth.assurance.policy entry declares max_age, and a zero value is valid
    and carries the zero_semantics of api:assurance-guard
  - data:authentication-runtime-config mode_validation refuses an assurance key the
    selected mode cannot honor
  rules:
  - the request view exposes the method label and effective freshness, never a token,
    an ID Token body, or a raw claim
  - re-proof updates authenticated_at, provider_authenticated_at, authentication_method,
    and reauth_count in one rotation
  - re-proof resets idle and absolute expiry together, per absolute_expiry_on_reproof
    above
  - the method label changes only through a new proof, never through elapsed time
  - a stored record predating these fields reads as having no provider proof time
    rather than failing, which the data:session-record version field already governs

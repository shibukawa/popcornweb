id: data:html-render-config
type: data
title: HTML Render Runtime Config
summary: The `html` binding bounds and gates progressive rendering for requirement:async-html-rendering.
facts:
  legacy_body: "The `html` binding bounds and gates progressive rendering for requirement:async-html-rendering.\n\
    \n```yaml\nprefix: html\nregistration: pw.RegisterConfig[HTMLConfig](\"html\"\
    ) beside the other built-in bindings\nkeys:\n  html.streaming: bool\n  html.async_timeout:\
    \ duration bounding one await boundary\n  html.async_concurrency: maximum simultaneous\
    \ boundary work per render\n  html.bot_detection: bool gating requirement:bot-synchronous-render\n\
    \  html.bot_async_timeout: duration bounding one await boundary on a classified\
    \ bot request\n  html.bot_user_agents: string list appended to data:bot-user-agent-catalog\n\
    live_keys:\n  status: implemented with requirement:live-html-rendering\n  html.live:\
    \ bool gating the live mode; false keeps every document valid and static, and\
    \ tells no client to connect\n  html.live_max_duration: maximum lifetime of one\
    \ live response before it closes with the retry record, default 10m\n  html.live_duration_jitter:\
    \ percentage that lifetime is spread by, per response, default 20\n  html.live_idle_timeout:\
    \ duration with no delivery after which a live response closes, default 5m\n \
    \ html.live_max_boundaries: maximum boundaries one live response may serve, default\
    \ 32\n  html.live_max_responses: maximum concurrent live responses per client,\
    \ default 4, keyed as policy:live-subscription-bounds describes\n  deferred: a\
    \ per-boundary minimum interval, which is still an open question upstream about\
    \ where pacing is declared\n  bounds: policy:live-subscription-bounds states what\
    \ each one buys\n  binding: the same html prefix, because these tune the same\
    \ render rather than a second subsystem\n  depends_on_streaming: every live key\
    \ hangs off html.streaming, because a buffered document writes no placeholder\
    \ a delivery could replace\n  rules:\n    - zero live_max_duration or live_idle_timeout\
    \ leaves the request context as the only bound\n    - zero or negative live_max_boundaries\
    \ and live_max_responses are unbounded\n    - live_duration_jitter above 100 is\
    \ clamped, and zero means no spread\ndefaults:\n  html.streaming: \"true\"\n \
    \ html.async_timeout: 3s\n  html.async_concurrency: \"0\"\n  html.bot_detection:\
    \ \"true\"\n  html.bot_async_timeout: 5s\n  html.bot_user_agents: empty\nsources:\
    \ config.toml, environment variable, and CLI flag, like every other binding under\
    \ decision:independent-runtime-config-bindings\nread: api:html-response reads\
    \ the binding from the request context per response\nunparsed_default:\n  problem:\
    \ a registered binding reads back before anything parses it, and a zero value\
    \ there is indistinguishable from an explicit setting\n  effect_if_ignored: a\
    \ zero streaming field would disable the feature in every test and every embedding\
    \ that never parses configuration\n  handling: registration seeds the target with\
    \ the documented values, so the string defaults and the Go defaults come from\
    \ one place\nrules:\n  - zero async_timeout means the request context is the only\
    \ deadline\n  - async_timeout bounds one boundary on the streaming branch and\
    \ one whole render on the buffered branch, per the bound_delivery note in policy:async-render-bounds\n\
    \  - zero or negative async_concurrency means unbounded, matching htmlbind\n \
    \ - streaming false forces the buffered branch even when a chain can open a boundary,\
    \ and htmlbind.RenderChain still produces a complete correct document\n  - reject\
    \ a negative duration at startup\n  - bot_detection false skips classification\
    \ entirely, so a crawler streams like a browser\n  - streaming false makes bot_detection\
    \ irrelevant, because every response is already buffered\n  - zero bot_async_timeout\
    \ falls back to async_timeout rather than meaning unbounded, so a misread key\
    \ cannot hold a crawler connection open for the whole request deadline\n  - bot_user_agents\
    \ entries are lowercased and appended; a duplicate of a built-in token is accepted\
    \ and has no effect\n  - api:html-fragment-response reads async_timeout and async_concurrency\
    \ only, per decision:buffered-fragment-delivery\nbot_timeout_tension:\n  longer_side:\
    \ an indexer waits far longer than a browser, and a timeout fallback baked into\
    \ a buffered document is exactly the outcome requirement:bot-synchronous-render\
    \ exists to prevent\n  shorter_side: a preview spider abandons a slow response\
    \ within a few seconds, and the buffered branch has no head start to offer it\n\
    \  resolution: one key defaulting to 5s, above the browser bound and inside a\
    \ typical spider budget\n  rejected_for_now: per-category bounds keyed off the\
    \ group in data:bot-user-agent-catalog\n  revisit_when: measurement shows preview\
    \ spiders abandoning responses that an indexer would have waited for\nconsumers:\n\
    \  - api:html-response\n  - api:client-classification\n  - policy:async-render-bounds\n\
    ```"
  prefix: html
  registration: pw.RegisterConfig[HTMLConfig]("html") beside the other built-in bindings
  keys:
    html.streaming: bool
    html.async_timeout: duration bounding one await boundary
    html.async_concurrency: maximum simultaneous boundary work per render
    html.bot_detection: bool gating requirement:bot-synchronous-render
    html.bot_async_timeout: duration bounding one await boundary on a classified bot
      request
    html.bot_user_agents: string list appended to data:bot-user-agent-catalog
  live_keys:
    status: implemented with requirement:live-html-rendering
    html.live: bool gating the live mode; false keeps every document valid and static,
      and tells no client to connect
    html.live_max_duration: maximum lifetime of one live response before it closes
      with the retry record, default 10m
    html.live_duration_jitter: percentage that lifetime is spread by, per response,
      default 20
    html.live_idle_timeout: duration with no delivery after which a live response
      closes, default 5m
    html.live_max_boundaries: maximum boundaries one live response may serve, default
      32
    html.live_max_responses: maximum concurrent live responses per client, default
      4, keyed as policy:live-subscription-bounds describes
    deferred: a per-boundary minimum interval, which is still an open question upstream
      about where pacing is declared
    bounds: policy:live-subscription-bounds states what each one buys
    binding: the same html prefix, because these tune the same render rather than
      a second subsystem
    depends_on_streaming: every live key hangs off html.streaming, because a buffered
      document writes no placeholder a delivery could replace
    rules:
    - zero live_max_duration or live_idle_timeout leaves the request context as the
      only bound
    - zero or negative live_max_boundaries and live_max_responses are unbounded
    - live_duration_jitter above 100 is clamped, and zero means no spread
  defaults:
    html.streaming: 'true'
    html.async_timeout: 3s
    html.async_concurrency: '0'
    html.bot_detection: 'true'
    html.bot_async_timeout: 5s
    html.bot_user_agents: empty
  sources: config.toml, environment variable, and CLI flag, like every other binding
    under decision:independent-runtime-config-bindings
  read: api:html-response reads the binding from the request context per response
  unparsed_default:
    problem: a registered binding reads back before anything parses it, and a zero
      value there is indistinguishable from an explicit setting
    effect_if_ignored: a zero streaming field would disable the feature in every test
      and every embedding that never parses configuration
    handling: registration seeds the target with the documented values, so the string
      defaults and the Go defaults come from one place
  rules:
  - zero async_timeout means the request context is the only deadline
  - async_timeout bounds one boundary on the streaming branch and one whole render
    on the buffered branch, per the bound_delivery note in policy:async-render-bounds
  - zero or negative async_concurrency means unbounded, matching htmlbind
  - streaming false forces the buffered branch even when a chain can open a boundary,
    and htmlbind.RenderChain still produces a complete correct document
  - reject a negative duration at startup
  - bot_detection false skips classification entirely, so a crawler streams like a
    browser
  - streaming false makes bot_detection irrelevant, because every response is already
    buffered
  - zero bot_async_timeout falls back to async_timeout rather than meaning unbounded,
    so a misread key cannot hold a crawler connection open for the whole request deadline
  - bot_user_agents entries are lowercased and appended; a duplicate of a built-in
    token is accepted and has no effect
  - api:html-fragment-response reads async_timeout and async_concurrency only, per
    decision:buffered-fragment-delivery
  bot_timeout_tension:
    longer_side: an indexer waits far longer than a browser, and a timeout fallback
      baked into a buffered document is exactly the outcome requirement:bot-synchronous-render
      exists to prevent
    shorter_side: a preview spider abandons a slow response within a few seconds,
      and the buffered branch has no head start to offer it
    resolution: one key defaulting to 5s, above the browser bound and inside a typical
      spider budget
    rejected_for_now: per-category bounds keyed off the group in data:bot-user-agent-catalog
    revisit_when: measurement shows preview spiders abandoning responses that an indexer
      would have waited for
  consumers:
  - api:html-response
  - api:client-classification
  - policy:async-render-bounds

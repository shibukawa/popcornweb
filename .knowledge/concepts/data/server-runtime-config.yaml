id: data:server-runtime-config
type: data
title: Server Runtime Config
summary: The `server` binding controls HTTP listener lifecycle, limits, and proxy trust.
facts:
  legacy_body: "The `server` binding controls HTTP listener lifecycle, limits, and proxy trust.\n\n```yaml\nfields:\n\
    \  port: HTTP listen port\n  read_header_timeout: duration\n  read_timeout: duration\n  write_timeout: duration\n\
    \  idle_timeout: duration\n  shutdown_timeout: duration\n  max_request_body: bytes\n  trusted_proxies: address\
    \ or network list; the trust gate of decision:forwarded-header-trust, read by every consumer of requirement:proxied-request-identity\
    \ rather than by one middleware\n  health: absolute path of the liveness endpoint; unset serves none\n  readiness:\
    \ absolute path of the readiness endpoint; unset serves none\n  openapi: absolute path of the generated OpenAPI\
    \ document; unset serves none\n  api_doc: scalar or swagger, naming the API reference UI of requirement:dev-api-reference;\
    \ unset serves none\n  api_doc_path: absolute path that UI serves at, read only while api_doc names one\n  api_catalog:\
    \ bool, the RFC 9727 well-known endpoint of requirement:api-catalog-well-known; a switch rather than a path\
    \ because the standard fixes the location\n  api_catalog_origin: absolute scheme-and-host origin the catalog's\
    \ links are built from; unset writes them relative rather than guessing one, per requirement:api-catalog-well-known\n\
    \  public.enabled: bool\n  public.mount: absolute non-root path prefix\n  public.read_local: bool\ndefaults:\n\
    \  api_doc_path: /docs\n  public.enabled: true\n  public.mount: /public\n  public.read_local: false\nrules:\n\
    \  - expose the port as server.port, --port, and PORT for container-oriented configuration\n  - validate the\
    \ port, positive limits, durations, and proxy networks at startup\n  - graceful shutdown uses shutdown_timeout\
    \ where supported\n  - local TLS termination follows decision:local-tls-proxy-boundary\n  - policy:operational-endpoints\
    \ defines endpoint behavior and access\n  - health, readiness, openapi, and api_doc carry no default, so that\
    \ an operator reading a deployment's configuration sees every address it answers on; a default would leave endpoints\
    \ running that no file mentions\n  - api_doc_path is the one endpoint path with a default, and it is read only\
    \ while api_doc names a UI, so it registers no route the file left unsaid\n  - requirement:public-asset-delivery\
    \ defines the public endpoint\n  - local public root is ./public relative to the process working directory\n\
    \  - public.mount is canonicalized to one leading and trailing slash and rejects root, dot segments, wildcards,\
    \ queries, and fragments\n  - reject duplicate endpoint paths, overlapping mounts, and collisions with application\
    \ routes\n  - OpenAPI documents are assembled from generated package fragments\n  - api_catalog is refused with\
    \ no openapi and no api_doc to link, per requirement:api-catalog-well-known\n```"
  fields:
    port: HTTP listen port
    read_header_timeout: duration
    read_timeout: duration
    write_timeout: duration
    idle_timeout: duration
    shutdown_timeout: duration
    max_request_body: bytes
    trusted_proxies: address or network list; the trust gate of decision:forwarded-header-trust, read by every consumer
      of requirement:proxied-request-identity rather than by one middleware
    health: absolute path of the liveness endpoint; unset serves none
    readiness: absolute path of the readiness endpoint; unset serves none
    openapi: absolute path of the generated OpenAPI document; unset serves none
    api_doc: scalar or swagger, naming the API reference UI of requirement:dev-api-reference; unset serves none
    api_doc_path: absolute path that UI serves at, read only while api_doc names one
    api_catalog: bool, the RFC 9727 well-known endpoint of requirement:api-catalog-well-known; a switch rather than
      a path because the standard fixes the location
    api_catalog_origin: absolute scheme-and-host origin the catalog's links are built from; unset writes them relative
      rather than guessing one, per requirement:api-catalog-well-known
    public.enabled: bool
    public.mount: absolute non-root path prefix
    public.read_local: bool
  defaults:
    api_doc_path: /docs
    public.enabled: true
    public.mount: /public
    public.read_local: false
  rules:
  - expose the port as server.port, --port, and PORT for container-oriented configuration
  - validate the port, positive limits, durations, and proxy networks at startup
  - graceful shutdown uses shutdown_timeout where supported
  - local TLS termination follows decision:local-tls-proxy-boundary
  - policy:operational-endpoints defines endpoint behavior and access
  - health, readiness, openapi, and api_doc carry no default, so that an operator reading a deployment's configuration
    sees every address it answers on; a default would leave endpoints running that no file mentions
  - api_doc_path is the one endpoint path with a default, and it is read only while api_doc names a UI, so it registers
    no route the file left unsaid
  - requirement:public-asset-delivery defines the public endpoint
  - local public root is ./public relative to the process working directory
  - public.mount is canonicalized to one leading and trailing slash and rejects root, dot segments, wildcards, queries,
    and fragments
  - reject duplicate endpoint paths, overlapping mounts, and collisions with application routes
  - OpenAPI documents are assembled from generated package fragments
  - api_catalog is refused with no openapi and no api_doc to link, per requirement:api-catalog-well-known
  public_local_root:
    key: server.public.local_root
    default: dist/public
    base: Working directory
    development: pw dev injects SERVER_PUBLIC_LOCAL_ROOT from assets.derived; both transports use this setting.

id: data:request-context-capsule
type: data
title: Request Context Capsule
summary: Popcorn Web stores stable request-scoped framework resources in one private
  value to bound context.Value lookup depth.
facts:
  legacy_body: "Popcorn Web stores stable request-scoped framework resources in one\
    \ private value to bound context.Value lookup depth.\n\n```yaml\nvisibility:\n\
    \  type: private\n  context_key: private\nfields:\n  database: optional *sql.DB\n\
    \  transaction_scope: optional data:transaction-scope\n  configuration_registry:\
    \ data:runtime-config-registry\n  root_span: optional contrib/otel/trace *Span\n\
    \  logger: private api:logger backend and stable request attributes\n  session:\
    \ optional validated data:session-record safe view\n  authentication: data:request-authentication\n\
    \  csrf_token: optional masked request token\nderived:\n  sql_executor: transaction\
    \ scope tx when present, otherwise database\nparent:\n  what: every derived capsule\
    \ copy records the capsule it came from, nil at request start, exposed framework-side\
    \ as Parent\n  why: one lookup reaches the innermost capsule and ancestry is a\
    \ pointer chase, per requirement:context-lookup-performance\nlifecycle:\n  - create\
    \ once per request\n  - framework middleware assembles fields before application\
    \ handler dispatch\n  - authentication middleware finalizes authenticated or unauthenticated\
    \ state before application handler dispatch\n  - policy:csrf-protection derives\
    \ a safe masked token without exposing the stored secret\n  - fields are stable\
    \ after handler dispatch\n  - api:transaction-runner creates a scoped child context\
    \ when no data:transaction-scope exists yet\n  - api:transaction-runner nests\
    \ through savepoints when a scope already exists\n  - never share a capsule across\
    \ requests\nconstraints:\n  - no general-purpose user value map\n  - no exported\
    \ field access\n  - no user-visible setter or replacement API\n```"
  visibility:
    type: private
    context_key: private
  fields:
    database: optional *sql.DB
    transaction_scope: optional data:transaction-scope
    configuration_registry: data:runtime-config-registry
    root_span: optional contrib/otel/trace *Span
    logger: private api:logger backend and stable request attributes
    session: optional validated data:session-record safe view
    authentication: data:request-authentication
    csrf_token: optional masked request token
  derived:
    sql_executor: transaction scope tx when present, otherwise database
  parent:
    what: every derived capsule copy records the capsule it came from, nil at request
      start, exposed framework-side as Parent
    why: one lookup reaches the innermost capsule and ancestry is a pointer chase,
      per requirement:context-lookup-performance
  lifecycle:
  - create once per request
  - framework middleware assembles fields before application handler dispatch
  - authentication middleware finalizes authenticated or unauthenticated state before
    application handler dispatch
  - policy:csrf-protection derives a safe masked token without exposing the stored
    secret
  - fields are stable after handler dispatch
  - api:transaction-runner creates a scoped child context when no data:transaction-scope
    exists yet
  - api:transaction-runner nests through savepoints when a scope already exists
  - never share a capsule across requests
  constraints:
  - no general-purpose user value map
  - no exported field access
  - no user-visible setter or replacement API
relations:
- relation: mentions
  to: api:logger
  resolution: resolved
- relation: mentions
  to: api:transaction-runner
  resolution: resolved
- relation: mentions
  to: data:request-authentication
  resolution: resolved
- relation: mentions
  to: data:runtime-config-registry
  resolution: resolved
- relation: mentions
  to: data:session-record
  resolution: resolved
- relation: mentions
  to: data:transaction-scope
  resolution: resolved
- relation: mentions
  to: policy:csrf-protection
  resolution: resolved
- relation: mentions
  to: requirement:context-lookup-performance
  resolution: resolved

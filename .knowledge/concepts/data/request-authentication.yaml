id: data:request-authentication
type: data
title: Request Authentication
summary: Authentication middleware records one immutable, protocol-neutral result
  for downstream handlers and authorization checks.
facts:
  legacy_body: "Authentication middleware records one immutable, protocol-neutral\
    \ result for downstream handlers and authorization checks.\n\n```yaml\nstate:\n\
    \  - unauthenticated\n  - authenticated\nauthenticated_fields:\n  subject: stable\
    \ identity identifier\n  principal: optional application-defined typed value\n\
    \  method: session, passkey, OIDC, bearer, or application-defined method\n  session:\
    \ optional opaque safe metadata\n  authorization_scope: optional tenant, roles,\
    \ permissions, or application-defined claims\n  authenticated_at: optional timestamp\n\
    \  expires_at: optional timestamp\nsecurity:\n  exclude:\n    - password and password\
    \ hash\n    - bearer, refresh, and ID token body\n    - raw session cookie or\
    \ session secret\n    - passkey ceremony secret or private key material\n    -\
    \ provider client secret\nimplemented:\n  surface:\n    - pw.RequestAuthentication(context)\
    \ returns this verified result\n    - pw.Authenticated(context) reports whether\
    \ the request carries a verified identity\n    - auth.User(context) returns the\
    \ account summary api:authentication-endpoints resolved\n  fields: account id,\
    \ issuer, identity claim and value, subject, and copied display claims\n  boundary:\
    \ the identity proves authentication only; authorization stays with the application\n\
    rules:\n  - verify credentials before constructing authenticated state\n  - copy\
    \ or freeze mutable claims before handler dispatch\n  - represent anonymous requests\
    \ explicitly instead of using a missing principal as authority\n```"
  state:
  - unauthenticated
  - authenticated
  authenticated_fields:
    subject: stable identity identifier
    principal: optional application-defined typed value
    method: session, passkey, OIDC, bearer, or application-defined method
    session: optional opaque safe metadata
    authorization_scope: optional tenant, roles, permissions, or application-defined
      claims
    authenticated_at: optional timestamp
    expires_at: optional timestamp
  security:
    exclude:
    - password and password hash
    - bearer, refresh, and ID token body
    - raw session cookie or session secret
    - passkey ceremony secret or private key material
    - provider client secret
  implemented:
    surface:
    - pw.RequestAuthentication(context) returns this verified result
    - pw.Authenticated(context) reports whether the request carries a verified identity
    - auth.User(context) returns the account summary api:authentication-endpoints
      resolved
    fields: account id, issuer, identity claim and value, subject, and copied display
      claims
    boundary: the identity proves authentication only; authorization stays with the
      application
  rules:
  - verify credentials before constructing authenticated state
  - copy or freeze mutable claims before handler dispatch
  - represent anonymous requests explicitly instead of using a missing principal as
    authority
relations:
- relation: mentions
  to: api:authentication-endpoints
  resolution: resolved

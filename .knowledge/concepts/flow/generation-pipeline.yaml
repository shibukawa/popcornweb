id: flow:generation-pipeline
type: flow
title: Application Generation Pipeline
summary: The generation pipeline converts application Go, HTML, and SQL sources into
  deterministic Go artifacts that run without target-side reflection.
facts:
  legacy_body: "The generation pipeline converts application Go, HTML, and SQL sources\
    \ into deterministic Go artifacts that run without target-side reflection.\n\n\
    ```yaml\nflow:\n  trigger: api:cli-generate reads data:project-config\n  steps:\n\
    \    - id: resolve\n      action: walk each decision:explicit-generation-sources\
    \ purpose, sort matching source paths, and warn about sources found outside the\
    \ purpose that owns their kind\n    - id: analyze\n      actor: system:tinybind\n\
    \      action: parse route registrations, pw.Parse calls, response calls, reachable\
    \ types, .pw.html, and .pw.sql sources\n    - id: select\n      action: drop artifacts\
    \ whose purpose does not list the directory that produced them\n    - id: emit-go\n\
    \      outputs:\n        - request binders and OpenAPI fragments\n        - flow:template-generation\
    \ renderers\n        - flow:sql-generation query functions\n        - optimized\
    \ JSON codecs\n        - optional generated tests\n      naming: \"{source-base}_pw_gen.go\
    \ beside the source\"\n    - id: compare-or-commit\n      action: compare in check\
    \ mode or atomically replace policy:generated-artifacts\n  failure:\n    default:\
    \ no destination artifact is partially written\n```"
  flow:
    trigger: api:cli-generate reads data:project-config
    steps:
    - id: resolve
      action: walk each decision:explicit-generation-sources purpose, sort matching
        source paths, and warn about sources found outside the purpose that owns their
        kind
    - id: analyze
      actor: system:tinybind
      action: parse route registrations, pw.Parse calls, response calls, reachable
        types, .pw.html, and .pw.sql sources
    - id: select
      action: drop artifacts whose purpose does not list the directory that produced
        them
    - id: emit-go
      outputs:
      - request binders and OpenAPI fragments
      - flow:template-generation renderers
      - flow:sql-generation query functions
      - optimized JSON codecs
      - optional generated tests
      naming: '{source-base}_pw_gen.go beside the source'
    - id: compare-or-commit
      action: compare in check mode or atomically replace policy:generated-artifacts
    failure:
      default: no destination artifact is partially written
relations:
- relation: mentions
  to: api:cli-generate
  resolution: resolved
- relation: mentions
  to: data:project-config
  resolution: resolved
- relation: mentions
  to: decision:explicit-generation-sources
  resolution: resolved
- relation: mentions
  to: flow:sql-generation
  resolution: resolved
- relation: mentions
  to: flow:template-generation
  resolution: resolved
- relation: mentions
  to: policy:generated-artifacts
  resolution: resolved
- relation: mentions
  to: system:tinybind
  resolution: resolved

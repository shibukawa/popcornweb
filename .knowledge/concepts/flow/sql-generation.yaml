id: flow:sql-generation
type: flow
title: SQL Generation and Execution
summary: Named .pw.sql sources generate typed plans and thin context-based functions
  over the shared TinyBind SQL runtime.
facts:
  legacy_body: "Named .pw.sql sources generate typed plans and thin context-based\
    \ functions over the shared TinyBind SQL runtime.\n\n```yaml\nsource: .pw.sql\n\
    output: \"{source-base}_pw_gen.go beside the source\"\narchitecture: decision:tinybind-sql-runtime\n\
    generated_function:\n  input:\n    - context.Context\n    - typed query parameters\n\
    \  executor: selected from the framework request context\n  forbidden_input:\n\
    \    - manual *sql.DB\n    - manual *sql.Tx\ndialect:\n  source: data:project-config\
    \ project.database, the one place a project states its engine for generation\n\
    \  passed_to: the system:tinybind generator SQL dialect option\n  required: system:tinybind\
    \ has no default, because a silently assumed dialect emits placeholders the engine\
    \ rejects at the first query\n  carries: the placeholder style today, and whatever\
    \ later engine difference the generator has to know\n  placeholders:\n    postgres:\
    \ $1, $2, and so on\n    mysql: \"?\"\n    sqlite: \"?\"\n  naming: the engine\
    \ name and the system:tinybind dialect agree except for postgres, which tinybind\
    \ spells postgresql, so the two are mapped rather than assumed equal\n  changing_it:\
    \ rewrites every generated query, so the key and the rule:rdb-dsn-resolution DSN\
    \ move together\nruntime:\n  database_driver: resolved by decision:config-driven-database\n\
    \  connection: initialized from registered runtime configuration\n  outside_transaction:\
    \ use request database\n  inside_transaction: use active transaction\n  diagnostics:\
    \ api:instrumented-sql-executor observes every generated call without changing\
    \ generated output\ncleanup:\n  - remove tinybind_shared_pw_gen.go after the corrected\
    \ system:tinybind generator no longer emits it\n  - Popcorn Web adds no independent\
    \ SQL classification or response validator\n```"
  source: .pw.sql
  output: '{source-base}_pw_gen.go beside the source'
  architecture: decision:tinybind-sql-runtime
  generated_function:
    input:
    - context.Context
    - typed query parameters
    executor: selected from the framework request context
    forbidden_input:
    - manual *sql.DB
    - manual *sql.Tx
  dialect:
    source: data:project-config project.database, the one place a project states its
      engine for generation
    passed_to: the system:tinybind generator SQL dialect option
    required: system:tinybind has no default, because a silently assumed dialect emits
      placeholders the engine rejects at the first query
    carries: the placeholder style today, and whatever later engine difference the
      generator has to know
    placeholders:
      postgres: $1, $2, and so on
      mysql: '?'
      sqlite: '?'
    naming: the engine name and the system:tinybind dialect agree except for postgres,
      which tinybind spells postgresql, so the two are mapped rather than assumed
      equal
    changing_it: rewrites every generated query, so the key and the rule:rdb-dsn-resolution
      DSN move together
  runtime:
    database_driver: resolved by decision:config-driven-database
    connection: initialized from registered runtime configuration
    outside_transaction: use request database
    inside_transaction: use active transaction
    diagnostics: api:instrumented-sql-executor observes every generated call without
      changing generated output
  cleanup:
  - remove tinybind_shared_pw_gen.go after the corrected system:tinybind generator
    no longer emits it
  - Popcorn Web adds no independent SQL classification or response validator
relations:
- relation: mentions
  to: api:instrumented-sql-executor
  resolution: resolved
- relation: mentions
  to: data:project-config
  resolution: resolved
- relation: mentions
  to: decision:config-driven-database
  resolution: resolved
- relation: mentions
  to: decision:tinybind-sql-runtime
  resolution: resolved
- relation: mentions
  to: rule:rdb-dsn-resolution
  resolution: resolved
- relation: mentions
  to: system:tinybind
  resolution: resolved

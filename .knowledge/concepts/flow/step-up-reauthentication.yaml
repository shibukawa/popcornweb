  resolution: resolved
- relation: mentions
  to: policy:csrf-protection
  resolution: resolved
- relation: mentions
  to: policy:oidc-admission
  resolution: resolved
- relation: mentions
  to: policy:reauthentication
  resolution: resolved
- relation: mentions
  to: requirement:contrib-auth-state
  resolution: resolved
- relation: mentions
  to: requirement:contrib-oidc
  resolution: resolved

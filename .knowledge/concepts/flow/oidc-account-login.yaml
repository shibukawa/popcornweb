id: flow:oidc-account-login
type: flow
title: OIDC Account Login
summary: OIDC login verifies an external IdP identity, resolves or provisions a local
  account, and creates a Popcorn Web session.
facts:
  legacy_body: "OIDC login verifies an external IdP identity, resolves or provisions\
    \ a local account, and creates a Popcorn Web session.\n\n```yaml\nimplemented_subset:\n\
    \  endpoints: api:authentication-endpoints performs the verification and session\
    \ steps\n  deferred: account provisioning, policy:account-linking, and policy:oidc-admission\
    \ remain application-owned\nflow:\n  - begin requirement:contrib-oidc authorization\
    \ code flow with PKCE, state, and nonce\n  - consume callback state through requirement:contrib-auth-state\n\
    \  - verify token signature, issuer, audience, nonce, time, and subject\n  - apply\
    \ policy:oidc-admission to the verified identity and claims\n  - resolve data:external-identity\
    \ by canonical issuer and subject\n  - provision data:user-account and external\
    \ link only when admission, auto-provision, and registration policy all permit\n\
    \  - reject suspended, deleted, ambiguous, or conflicting accounts\n  - create\
    \ or rotate api:session-manager session\n  - record data:request-authentication\
    \ method as OIDC\n  - optionally offer flow:passkey-enrollment\nrules:\n  - policy:account-linking\
    \ governs existing-account links\n  - deny admission before creating, linking,\
    \ or mutating an account\n  - access and refresh tokens are not stored in the\
    \ login session unless application functionality explicitly requires them\n```"
  implemented_subset:
    endpoints: api:authentication-endpoints performs the verification and session
      steps
    deferred: account provisioning, policy:account-linking, and policy:oidc-admission
      remain application-owned
  flow:
  - begin requirement:contrib-oidc authorization code flow with PKCE, state, and nonce
  - consume callback state through requirement:contrib-auth-state
  - verify token signature, issuer, audience, nonce, time, and subject
  - apply policy:oidc-admission to the verified identity and claims
  - resolve data:external-identity by canonical issuer and subject
  - provision data:user-account and external link only when admission, auto-provision,
    and registration policy all permit
  - reject suspended, deleted, ambiguous, or conflicting accounts
  - create or rotate api:session-manager session
  - record data:request-authentication method as OIDC
  - optionally offer flow:passkey-enrollment
  rules:
  - policy:account-linking governs existing-account links
  - deny admission before creating, linking, or mutating an account
  - access and refresh tokens are not stored in the login session unless application
    functionality explicitly requires them
relations:
- relation: mentions
  to: api:authentication-endpoints
  resolution: resolved
- relation: mentions
  to: api:session-manager
  resolution: resolved
- relation: mentions

  resolution: resolved
- relation: mentions
  to: data:user-account
  resolution: resolved
- relation: mentions
  to: flow:passkey-enrollment
  resolution: resolved
- relation: mentions
  to: policy:account-linking
  resolution: resolved
- relation: mentions
  to: policy:oidc-admission
  resolution: resolved
- relation: mentions
  to: requirement:contrib-auth-state
  resolution: resolved
- relation: mentions
  to: requirement:contrib-oidc
  resolution: resolved

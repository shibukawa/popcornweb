id: flow:error-template-generation
type: flow
title: Error Template Generation
summary: The host generator converts standard .pw.html error pages into TinyGo-safe
  renderers used by api:problem-response.
facts:
  legacy_body: "The host generator converts standard .pw.html error pages into TinyGo-safe\
    \ renderers used by api:problem-response.\n\n```yaml\ntrigger: api:cli-generate\
    \ finds templates/400.pw.html, 404.pw.html, or 500.pw.html\nsteps:\n  - parse\
    \ and escape-analyze through requirement:contrib-html-template\n  - bind the framework\
    \ safe error-page model\n  - reject unsupported fields, helpers, inclusions, or\
    \ output contexts\n  - emit a package-level renderer beside each source\n  - format\
    \ and atomically update policy:generated-artifacts\nrules:\n  - generated fragments\
    \ register during package import\n  - source HTML remains the human-owned presentation\
    \ artifact\n```"
  trigger: api:cli-generate finds templates/400.pw.html, 404.pw.html, or 500.pw.html
  steps:
  - parse and escape-analyze through requirement:contrib-html-template
  - bind the framework safe error-page model
  - reject unsupported fields, helpers, inclusions, or output contexts
  - emit a package-level renderer beside each source
  - format and atomically update policy:generated-artifacts
  rules:
  - generated fragments register during package import
  - source HTML remains the human-owned presentation artifact
relations:
- relation: mentions
  to: api:cli-generate
  resolution: resolved
- relation: mentions
  to: api:problem-response
  resolution: resolved
- relation: mentions
  to: policy:generated-artifacts
  resolution: resolved
- relation: mentions
  to: requirement:contrib-html-template
  resolution: resolved

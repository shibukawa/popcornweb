  resolution: resolved
- relation: mentions
  to: policy:dev-token-relaxation
  resolution: resolved
- relation: mentions
  to: policy:token-revocation
  resolution: resolved
- relation: mentions
  to: requirement:contrib-jwt
  resolution: resolved
- relation: mentions
  to: requirement:jwt-only-api-authentication
  resolution: resolved

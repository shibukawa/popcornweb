id: flow:passkey-only-registration
type: flow
title: Passkey-Only Registration
summary: Passkey-only deployments may issue a login ID and temporary secret that open
  only a restricted first-passkey enrollment.
facts:
  legacy_body: "Passkey-only deployments may issue a login ID and temporary secret\
    \ that open only a restricted first-passkey enrollment.\n\n```yaml\npolicies:\n\
    \  disabled: no self-registration\n  invite: require a single-use bounded invitation\n\
    \  administrator: provision account and data:account-bootstrap-credential out\
    \ of band\n  open: explicit opt-in with abuse controls\nflow:\n  - allocate provisional\
    \ data:user-account with random stable user handle\n  - issue login ID and one-time\
    \ temporary secret under policy:bootstrap-credential-security\n  - verify the\
    \ ID and secret without revealing account existence\n  - grant a short-lived enrollment\
    \ ticket; create no session at all, so the request stays unauthenticated\n  -\
    \ begin requirement:contrib-passkey registration\n  - persist single-use ceremony\
    \ state in requirement:contrib-auth-state\n  - finish registration and atomically\
    \ save data:passkey-credential, activate the account, and consume the bootstrap\
    \ credential\n  - replace the enrollment ticket with an api:session-manager session\n\
    failure:\n  - leave no active account without a credential\n  - expire or clean\
    \ abandoned provisional accounts\n  - revoke expired, exhausted, replaced, or\
    \ consumed bootstrap credentials\nrules:\n  - the temporary secret is not a reusable\
    \ password authentication method\n  - email input is unverified unless a separate\
    \ verification flow proves it\n  - open registration requires rate limits and\
    \ enumeration-safe responses\n  - policy:account-recovery must be selected before\
    \ enabling passkey-only registration\n```"
  policies:
    disabled: no self-registration
    invite: require a single-use bounded invitation
    administrator: provision account and data:account-bootstrap-credential out of
      band
    open: explicit opt-in with abuse controls
  flow:
  - allocate provisional data:user-account with random stable user handle
  - issue login ID and one-time temporary secret under policy:bootstrap-credential-security
  - verify the ID and secret without revealing account existence
  - grant a short-lived enrollment ticket; create no session at all, so the request
    stays unauthenticated
  - begin requirement:contrib-passkey registration
  - persist single-use ceremony state in requirement:contrib-auth-state
  - finish registration and atomically save data:passkey-credential, activate the
    account, and consume the bootstrap credential
  - replace the enrollment ticket with an api:session-manager session
  failure:
  - leave no active account without a credential
  - expire or clean abandoned provisional accounts
  - revoke expired, exhausted, replaced, or consumed bootstrap credentials
  rules:
  - the temporary secret is not a reusable password authentication method
  - email input is unverified unless a separate verification flow proves it
  - open registration requires rate limits and enumeration-safe responses
  - policy:account-recovery must be selected before enabling passkey-only registration
relations:
- relation: mentions
  to: api:session-manager
  resolution: resolved
- relation: mentions
  to: data:account-bootstrap-credential
  resolution: resolved
- relation: mentions
  to: data:passkey-credential
  resolution: resolved
- relation: mentions
  to: data:user-account
  resolution: resolved
- relation: mentions
  to: policy:account-recovery
  resolution: resolved
- relation: mentions
  to: policy:bootstrap-credential-security
  resolution: resolved
- relation: mentions
  to: requirement:contrib-auth-state
  resolution: resolved
- relation: mentions
  to: requirement:contrib-passkey
  resolution: resolved

id: policy:ui-state-placement
type: policy
title: UI State Placement
summary: Place state according to its durability and sharing semantics.
facts:
  legacy_body: "Place state according to its durability and sharing semantics.\n\n\
    ```yaml\nclassification:\n  shareable_bookmarkable_history: path or search parameters\n\
    \  temporary_interaction: client state or flow:partial-refresh\n  persistent_mutation:\
    \ api:server-action\n  external_change: dependency invalidation and optional revalidation\n\
    rule: search-parameter navigation may update history while refreshing only dependent\
    \ boundaries\n```"
  classification:
    shareable_bookmarkable_history: path or search parameters
    temporary_interaction: client state or flow:partial-refresh
    persistent_mutation: api:server-action
    external_change: dependency invalidation and optional revalidation
  rule: search-parameter navigation may update history while refreshing only dependent
    boundaries
relations:
- relation: mentions
  to: api:server-action
  resolution: resolved
- relation: mentions
  to: flow:partial-refresh
  resolution: resolved

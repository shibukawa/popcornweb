id: policy:web-middleware
type: policy
title: Web Middleware Integration
summary: Infrastructure composes through standard http.Handler middleware, with framework-specific
  forms adaptable to common Go signatures where feasible.
facts:
  legacy_body: "Infrastructure composes through standard http.Handler middleware,\
    \ with framework-specific forms adaptable to common Go signatures where feasible.\n\
    \n```yaml\nconcerns:\n  - request IDs and structured logging\n  - panic recovery\n\
    \  - authentication, authorization, sessions, and CSRF\n  - CORS, which is requirement:cors-middleware,\
    \ exists nowhere in the tree yet, and is answered by the response-header middleware\
    \ rather than by one of its own, and compression\n  - request size, timeout, and\
    \ rate limits, the last of which is requirement:rate-limit-enforcement and is\
    \ only partly a middleware\n  - caching\n  - metrics and minimal OpenTelemetry\
    \ propagation and export\n  - trusted proxy and forwarded-header handling, resolved\
    \ once through requirement:proxied-request-identity rather than per consumer\n\
    ordering:\n  - canonicalize and reject malformed request targets\n  - apply policy:security-response-headers,\
    \ which also answers the preflight and marks the response for requirement:cors-middleware,\
    \ above every frame that can refuse\n  - apply api:rdb-middleware and selected\
    \ transaction policy\n  - load api:session-manager state\n  - establish data:request-authentication\n\
    \  - apply policy:authenticated-path-protection\n  - apply policy:csrf-protection\n\
    \  - run application authorization and handler\nconfiguration:\n  - data:middleware-runtime-config\
    \ controls the enabled framework set and effective order\n  - startup validation\
    \ rejects missing dependencies and unsafe ordering\n  - applications may wrap\
    \ the final handler with additional standard middleware\napplication:\n  - api:application-lifecycle\
    \ Run applies the configured stack\n  - api:application-lifecycle Middlewares\
    \ returns the same wrapped handler\nportability:\n  framework_set: the concerns\
    \ listed above are the set decision:backend-specific-middleware ports in full,\
    \ one implementation per backend behind one build-tagged name\n  application_middleware:\
    \ backend-specific source with no portability promise, and the wrapping seam stays\
    \ legal under decision:transport-handle-containment\n  unchanged_here: the configured\
    \ order, data:middleware-runtime-config, and startup validation, which describe\
    \ the stack rather than its implementation\n```"
  concerns:
  - request IDs and structured logging
  - panic recovery
  - authentication, authorization, sessions, and CSRF
  - CORS, which is requirement:cors-middleware, exists nowhere in the tree yet, and
    is answered by the response-header middleware rather than by one of its own, and
    compression
  - request size, timeout, and rate limits, the last of which is requirement:rate-limit-enforcement
    and is only partly a middleware
  - caching
  - metrics and minimal OpenTelemetry propagation and export
  - trusted proxy and forwarded-header handling, resolved once through requirement:proxied-request-identity
    rather than per consumer
  ordering:
  - canonicalize and reject malformed request targets
  - apply policy:security-response-headers, which also answers the preflight and marks
    the response for requirement:cors-middleware, above every frame that can refuse
  - apply api:rdb-middleware and selected transaction policy
  - load api:session-manager state
  - establish data:request-authentication
  - apply policy:authenticated-path-protection
  - apply policy:csrf-protection
  - run application authorization and handler
  configuration:
  - data:middleware-runtime-config controls the enabled framework set and effective
    order
  - startup validation rejects missing dependencies and unsafe ordering
  - applications may wrap the final handler with additional standard middleware
  application:
  - api:application-lifecycle Run applies the configured stack
  - api:application-lifecycle Middlewares returns the same wrapped handler
  portability:
    framework_set: the concerns listed above are the set decision:backend-specific-middleware
      ports in full, one implementation per backend behind one build-tagged name
    application_middleware: backend-specific source with no portability promise, and
      the wrapping seam stays legal under decision:transport-handle-containment
    unchanged_here: the configured order, data:middleware-runtime-config, and startup
      validation, which describe the stack rather than its implementation

id: policy:oidc-security
type: policy
title: OIDC Security Policy
summary: OIDC network discovery and browser state are validated against explicit trust
  anchors and single-use correlation values.
facts:
  legacy_body: "OIDC network discovery and browser state are validated against explicit\
    \ trust anchors and single-use correlation values.\n\n```yaml\nissuer:\n  - HTTPS\
    \ required except explicit loopback development mode\n  - discovered issuer must\
    \ exactly equal configured issuer\n  - authorization, device authorization, token,\
    \ JWKS, and UserInfo URLs must use HTTPS\nhttp:\n  - outbound transport follows\
    \ policy:outbound-transport-security\n  - redirects disabled by default for discovery\
    \ and JWKS\n  - response size and request duration bounded\n  - caller may restrict\
    \ resolved IP ranges to prevent SSRF\nbrowser:\n  - policy:oauth-security state\
    \ and PKCE rules apply\n  - nonce generated from crypto/rand and stored with OAuth\
    \ correlation data\n  - state, nonce, and verifier expire and are atomically consumed\
    \ once\ndevice:\n  - policy:device-authorization-security applies\n  - the typed\
    \ device completion path has no browser transaction and therefore does not require\
    \ a nonce claim\n  - issuer, audience, azp, signature, time, and subject checks\
    \ remain identical to browser completion\ntokens:\n  - requirement:contrib-jwt\
    \ policy applied\n  - never log authorization code, tokens, verifier, nonce, or\
    \ client secret\ncache:\n  - honor bounded HTTP cache lifetime\n  - retain last\
    \ valid JWKS only until configured stale limit\n```"
  issuer:
  - HTTPS required except explicit loopback development mode
  - discovered issuer must exactly equal configured issuer
  - authorization, device authorization, token, JWKS, and UserInfo URLs must use HTTPS
  http:
  - outbound transport follows policy:outbound-transport-security
  - redirects disabled by default for discovery and JWKS
  - response size and request duration bounded
  - caller may restrict resolved IP ranges to prevent SSRF
  browser:
  - policy:oauth-security state and PKCE rules apply
  - nonce generated from crypto/rand and stored with OAuth correlation data
  - state, nonce, and verifier expire and are atomically consumed once
  device:
  - policy:device-authorization-security applies
  - the typed device completion path has no browser transaction and therefore does
    not require a nonce claim
  - issuer, audience, azp, signature, time, and subject checks remain identical to
    browser completion
  tokens:
  - requirement:contrib-jwt policy applied
  - never log authorization code, tokens, verifier, nonce, or client secret
  cache:
  - honor bounded HTTP cache lifetime
  - retain last valid JWKS only until configured stale limit
relations:
- relation: mentions
  to: policy:device-authorization-security
  resolution: resolved
- relation: mentions
  to: policy:oauth-security
  resolution: resolved
- relation: mentions
  to: policy:outbound-transport-security
  resolution: resolved
- relation: mentions
  to: requirement:contrib-jwt
  resolution: resolved

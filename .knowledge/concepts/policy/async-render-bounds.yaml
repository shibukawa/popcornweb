id: policy:async-render-bounds
type: policy
title: Async Render Bounds
summary: Await boundary work stays bounded, cancellable, and server-confidential across
  both render branches of decision:automatic-async-render-selection.
facts:
  legacy_body: "Await boundary work stays bounded, cancellable, and server-confidential\
    \ across both render branches of decision:automatic-async-render-selection.\n\n\
    ```yaml\nbound_delivery:\n  fact: htmlbind.WithAsyncTimeout is read by the async\
    \ coordinator, which the blocking path never builds, so the option alone bounds\
    \ the streaming branch only\n  streaming: pass the option, which bounds each boundary\
    \ independently\n  buffered: derive a render deadline from the same value and\
    \ pass it as the htmlbind.WithContext context\n  shape_difference: per boundary\
    \ on one branch, per render on the other\n  why_acceptable: nothing is committed\
    \ on the buffered branch, so total wait is the number that matters, and api:async-html-value\
    \ already started the work concurrently before the render began\n  without_it:\
    \ a chain forced onto the buffered branch waits on its boundaries until the request\
    \ context ends, which is the stall the setting exists to prevent\nrules:\n  -\
    \ bound one boundary with htmlbind.WithAsyncTimeout from data:html-render-config\n\
    \  - bound a buffered render with a context deadline carrying the same value,\
    \ per bound_delivery\n  - use html.bot_async_timeout in place of html.async_timeout\
    \ when api:client-classification reports a bot, since that request waits for every\
    \ boundary before any byte leaves\n  - bound simultaneous boundary work with htmlbind.WithConcurrencyLimit\
    \ from data:html-render-config\n  - pass the request context so client disconnect\
    \ and server shutdown stop the wait\n  - an expired boundary renders recover with\
    \ code timeout, or escalates through decision:unhandled-boundary-escalation\n\
    \  - a failure with no recover clause never becomes a permanently stuck fallback\n\
    \  - report every original error through htmlbind.WithErrorReporter into api:logger,\
    \ including errors a recover clause handled\n  - a recover subtree receives only\
    \ pw.AsyncError; Go error text, SQL, and configuration never reach the page\n\
    \  - an error gains a message or code only through an explicit PublicError projection\n\
    \  - an external without a context parameter cannot be interrupted; the render\
    \ abandons it and discards its result\n  - work started by api:async-html-value\
    \ stays the handler's to cancel\n  - a boundary goroutine panic becomes that boundary's\
    \ error and never reaches the recovery middleware\nlive_boundaries:\n  scope:\
    \ these rules bound work that settles; a binding that keeps delivering is bounded\
    \ by policy:live-subscription-bounds instead\n  not_covered_here:\n    concurrency:\
    \ htmlbind excludes live subscriptions from WithConcurrencyLimit, so html.async_concurrency\
    \ caps nothing about them\n    timeout: the bound still applies to a live boundary's\
    \ first delivery on the entries that must answer, and running out leaves the fallback\
    \ rather than rendering recover, because a quiet source has not failed\n    reporter:\
    \ reported off the delivery lock since system:tinybind v0.2.8, per requirement:live-error-report-off-lock,\
    \ so both paths now report the same way\nextends: policy:server-ui-security\n\
    ```"
  bound_delivery:
    fact: htmlbind.WithAsyncTimeout is read by the async coordinator, which the blocking
      path never builds, so the option alone bounds the streaming branch only
    streaming: pass the option, which bounds each boundary independently
    buffered: derive a render deadline from the same value and pass it as the htmlbind.WithContext
      context
    shape_difference: per boundary on one branch, per render on the other
    why_acceptable: nothing is committed on the buffered branch, so total wait is
      the number that matters, and api:async-html-value already started the work concurrently
      before the render began
    without_it: a chain forced onto the buffered branch waits on its boundaries until
      the request context ends, which is the stall the setting exists to prevent
  rules:
  - bound one boundary with htmlbind.WithAsyncTimeout from data:html-render-config
  - bound a buffered render with a context deadline carrying the same value, per bound_delivery
  - use html.bot_async_timeout in place of html.async_timeout when api:client-classification
    reports a bot, since that request waits for every boundary before any byte leaves
  - bound simultaneous boundary work with htmlbind.WithConcurrencyLimit from data:html-render-config
  - pass the request context so client disconnect and server shutdown stop the wait
  - an expired boundary renders recover with code timeout, or escalates through decision:unhandled-boundary-escalation
  - a failure with no recover clause never becomes a permanently stuck fallback
  - report every original error through htmlbind.WithErrorReporter into api:logger,
    including errors a recover clause handled
  - a recover subtree receives only pw.AsyncError; Go error text, SQL, and configuration
    never reach the page
  - an error gains a message or code only through an explicit PublicError projection
  - an external without a context parameter cannot be interrupted; the render abandons
    it and discards its result
  - work started by api:async-html-value stays the handler's to cancel
  - a boundary goroutine panic becomes that boundary's error and never reaches the
    recovery middleware
  live_boundaries:
    scope: these rules bound work that settles; a binding that keeps delivering is
      bounded by policy:live-subscription-bounds instead
    not_covered_here:
      concurrency: htmlbind excludes live subscriptions from WithConcurrencyLimit,
        so html.async_concurrency caps nothing about them
      timeout: the bound still applies to a live boundary's first delivery on the
        entries that must answer, and running out leaves the fallback rather than
        rendering recover, because a quiet source has not failed
      reporter: reported off the delivery lock since system:tinybind v0.2.8, per requirement:live-error-report-off-lock,
        so both paths now report the same way
  extends: policy:server-ui-security

id: policy:bootstrap-credential-security
type: policy
title: Bootstrap Credential Security
summary: Issued temporary credentials are narrowly scoped to establishing or recovering
  a passkey.
facts:
  legacy_body: "Issued temporary credentials are narrowly scoped to establishing or\
    \ recovering a passkey.\n\n```yaml\nissuance:\n  - generate sufficient entropy;\
    \ do not accept a user-chosen temporary password\n  - prefer delivering login\
    \ ID and secret through separate trusted channels\n  - bind the credential to\
    \ one account, purpose, and expiry\nverification:\n  - rate-limit by credential,\
    \ login ID, client, and deployment policy\n  - return enumeration-safe failure\
    \ responses\n  - decrement attempts atomically\n  - audit issuance, failure, consumption,\
    \ expiry, and revocation without secrets\nauthorization:\n  allowed:\n    - begin\
    \ and finish the bound passkey ceremony\n    - inspect only the minimum account\
    \ display data needed for enrollment\n  forbidden:\n    - application handlers\n\
    \    - account administration\n    - normal session creation before passkey persistence\n\
    grant_shape:\n  form: a single-use enrollment ticket, not a session\n  reason:\
    \ a session with a restriction relies on every handler remembering the restriction,\
    \ while a request that carries no session cannot be mistaken for authority at\
    \ all\n  effect: the request stays unauthenticated until the passkey is persisted\n\
    completion:\n  - atomically persist the passkey, activate the account, and consume\
    \ the credential\n  - replace the restricted enrollment ticket with a normal session\n\
    \  - invalidate an abandoned ticket after a short TTL\n```"
  issuance:
  - generate sufficient entropy; do not accept a user-chosen temporary password
  - prefer delivering login ID and secret through separate trusted channels
  - bind the credential to one account, purpose, and expiry
  verification:
  - rate-limit by credential, login ID, client, and deployment policy
  - return enumeration-safe failure responses
  - decrement attempts atomically
  - audit issuance, failure, consumption, expiry, and revocation without secrets
  authorization:
    allowed:
    - begin and finish the bound passkey ceremony
    - inspect only the minimum account display data needed for enrollment
    forbidden:
    - application handlers
    - account administration
    - normal session creation before passkey persistence
  grant_shape:
    form: a single-use enrollment ticket, not a session
    reason: a session with a restriction relies on every handler remembering the restriction,
      while a request that carries no session cannot be mistaken for authority at
      all
    effect: the request stays unauthenticated until the passkey is persisted
  completion:
  - atomically persist the passkey, activate the account, and consume the credential
  - replace the restricted enrollment ticket with a normal session
  - invalidate an abandoned ticket after a short TTL

id: policy:config-file-resolution
type: policy
title: Config File Resolution
summary: Project-local configuration files are named per data:runtime-environment,
  while shared user and system configuration files keep one environment-neutral name.
facts:
  legacy_body: "Project-local configuration files are named per data:runtime-environment,\
    \ while shared user and system configuration files keep one environment-neutral\
    \ name.\n\n```yaml\nnaming:\n  project_local: config.{env}.toml\n  user_and_system:\
    \ config.toml\nsearch_order:\n  - explicit --config-path value\n  - ./config.{env}.toml\n\
    \  - ./config/config.{env}.toml\n  - user config directory {vendor}/{tool}/config.toml\n\
    \  - system config directory {vendor}/{tool}/config.toml\nresolution:\n  mode:\
    \ exclusive first readable match\n  base: process working directory for project-local\
    \ candidates\n  explicit_path:\n    - bypasses environment-specific naming entirely\n\
    \    - unreadable explicit path fails without fallback\n  not_found: TOML input\
    \ is skipped; defaults, environment, and CLI still apply\nrules:\n  - project-local\
    \ candidates are limited to the working directory and its config/ directory\n\
    \  - project-local lookup never falls back to a local config.toml\n  - user and\
    \ system directories are never environment-specific\n  - the resolved path and\
    \ the active environment are reported by policy:startup-summary\n  - a readable\
    \ project-local file suppresses user and system candidates\nrationale:\n  - deployment-specific\
    \ values live beside the project and are selected without editing files\n  - operator-owned\
    \ machine-wide overrides stay environment-neutral and need no per-environment\
    \ duplication\nengine: system:tinybind configpath resolution with environment-derived\
    \ extra read paths\nsibling: policy:dotenv-resolution names the .env files by\
    \ the same token, and layers them where this policy selects exclusively, per decision:layered-dotenv-files\n\
    consumers:\n  - api:runtime-configuration\n  - data:loaded-configuration\n```"
  naming:
    project_local: config.{env}.toml
    user_and_system: config.toml
  search_order:
  - explicit --config-path value
  - ./config.{env}.toml
  - ./config/config.{env}.toml
  - user config directory {vendor}/{tool}/config.toml
  - system config directory {vendor}/{tool}/config.toml
  resolution:
    mode: exclusive first readable match
    base: process working directory for project-local candidates
    explicit_path:
    - bypasses environment-specific naming entirely
    - unreadable explicit path fails without fallback
    not_found: TOML input is skipped; defaults, environment, and CLI still apply
  rules:
  - project-local candidates are limited to the working directory and its config/
    directory
  - project-local lookup never falls back to a local config.toml
  - user and system directories are never environment-specific
  - the resolved path and the active environment are reported by policy:startup-summary
  - a readable project-local file suppresses user and system candidates
  rationale:
  - deployment-specific values live beside the project and are selected without editing
    files
  - operator-owned machine-wide overrides stay environment-neutral and need no per-environment
    duplication
  engine: system:tinybind configpath resolution with environment-derived extra read
    paths
  sibling: policy:dotenv-resolution names the .env files by the same token, and layers
    them where this policy selects exclusively, per decision:layered-dotenv-files
  consumers:
  - api:runtime-configuration
  - data:loaded-configuration
relations:
- relation: mentions
  to: api:runtime-configuration
  resolution: resolved
- relation: mentions
  to: data:loaded-configuration
  resolution: resolved
- relation: mentions
  to: data:runtime-environment
  resolution: resolved
- relation: mentions
  to: decision:layered-dotenv-files
  resolution: resolved
- relation: mentions
  to: policy:dotenv-resolution
  resolution: resolved
- relation: mentions
  to: policy:startup-summary
  resolution: resolved
- relation: mentions
  to: system:tinybind
  resolution: resolved

id: policy:oidc-admission
type: policy
title: OIDC Admission Policy
summary: OIDC verification proves identity; admission separately decides whether that
  identity may enter this application.
facts:
  legacy_body: "OIDC verification proves identity; admission separately decides whether\
    \ that identity may enter this application.\n\n```yaml\nmodes:\n  existing:\n\
    \    admit: canonical issuer and subject already resolve to data:external-identity\n\
    \    provisioning: forbidden\n  registered:\n    admit: a verified claim of the\
    \ identity matches a row registered in advance for that issuer\n    lookup: api:auth-allowlist-store\n\
    \    storage: popcornweb_auth_allowlist through rule:framework-owned-tables, unless\
    \ an application installed a store\n    row: issuer, claim name, expected value,\
    \ and an operator note\n    compared_claims: auth.oidc.registered_claims, defaulting\
    \ to auth.oidc.identity_claim alone\n    match: any compared claim, so a deployment\
    \ may also recognize someone registered by another attribute\n    lookup_failure:\
    \ an error, never a denial, so an outage cannot silently change who may enter\n\
    \    provisioning: controlled by oidc.auto_provision and registration policy\n\
    \  claim:\n    admit: configured verified claim rule matches\n    provisioning:\
    \ controlled by oidc.auto_provision and registration policy\n  authenticated:\n\
    \    admit: every identity verified by the configured issuer\n    provisioning:\
    \ controlled by oidc.auto_provision and registration policy\nclaim_rule:\n  path:\
    \ JSON Pointer into the selected verified claim set\n  values: non-empty allowlist\
    \ of exact string values\n  match:\n    any: scalar equals or array intersects\
    \ the allowlist\n    all: array contains every configured value\nfailure:\n  -\
    \ reject missing paths, unexpected value types, and non-matches\n  - return an\
    \ enumeration-safe access-denied response\n  - do not create or link an account\n\
    identity_key:\n  claim: auth.oidc.identity_claim selects the verified claim that\
    \ identifies the account, defaulting to sub\n  contract: data:external-identity\n\
    rules:\n  - evaluate only after issuer, audience, signature, nonce, time, and\
    \ subject verification\n  - deny a login whose token lacks a usable value for\
    \ the configured identity claim\n  - never use unverified request parameters or\
    \ decoded-but-unverified tokens\n  - apply admission on every OIDC login, including\
    \ existing accounts\n  - treat claim matching as exact and case-sensitive\n  -\
    \ avoid a general expression language in framework configuration\n  - audit rule\
    \ outcome without raw tokens, secrets, or unnecessary claim values\nboundary:\n\
    \  - OIDC admission governs OIDC login and provisioning, not arbitrary application\
    \ authorization\n  - passkey login authenticates the local account without refreshing\
    \ IdP claims\n  - deployments requiring continuing organization membership must\
    \ define entitlement refresh, expiry, and revocation beyond this admission gate\n\
    ```"
  modes:
    existing:
      admit: canonical issuer and subject already resolve to data:external-identity
      provisioning: forbidden
    registered:
      admit: a verified claim of the identity matches a row registered in advance
        for that issuer
      lookup: api:auth-allowlist-store
      storage: popcornweb_auth_allowlist through rule:framework-owned-tables, unless
        an application installed a store
      row: issuer, claim name, expected value, and an operator note
      compared_claims: auth.oidc.registered_claims, defaulting to auth.oidc.identity_claim
        alone
      match: any compared claim, so a deployment may also recognize someone registered
        by another attribute
      lookup_failure: an error, never a denial, so an outage cannot silently change
        who may enter
      provisioning: controlled by oidc.auto_provision and registration policy
    claim:
      admit: configured verified claim rule matches
      provisioning: controlled by oidc.auto_provision and registration policy
    authenticated:
      admit: every identity verified by the configured issuer
      provisioning: controlled by oidc.auto_provision and registration policy
  claim_rule:
    path: JSON Pointer into the selected verified claim set
    values: non-empty allowlist of exact string values
    match:
      any: scalar equals or array intersects the allowlist
      all: array contains every configured value
  failure:
  - reject missing paths, unexpected value types, and non-matches
  - return an enumeration-safe access-denied response
  - do not create or link an account
  identity_key:
    claim: auth.oidc.identity_claim selects the verified claim that identifies the
      account, defaulting to sub
    contract: data:external-identity
  rules:
  - evaluate only after issuer, audience, signature, nonce, time, and subject verification
  - deny a login whose token lacks a usable value for the configured identity claim
  - never use unverified request parameters or decoded-but-unverified tokens
  - apply admission on every OIDC login, including existing accounts
  - treat claim matching as exact and case-sensitive
  - avoid a general expression language in framework configuration
  - audit rule outcome without raw tokens, secrets, or unnecessary claim values
  boundary:
  - OIDC admission governs OIDC login and provisioning, not arbitrary application
    authorization
  - passkey login authenticates the local account without refreshing IdP claims
  - deployments requiring continuing organization membership must define entitlement
    refresh, expiry, and revocation beyond this admission gate
relations:
- relation: mentions
  to: api:auth-allowlist-store
  resolution: resolved
- relation: mentions
  to: data:external-identity
  resolution: resolved
- relation: mentions
  to: rule:framework-owned-tables
  resolution: resolved

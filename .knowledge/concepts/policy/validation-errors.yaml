id: policy:validation-errors
type: policy
title: Validation and Error Policy
summary: All request conversion and application validation failures use api:problem-response
  values and safe RFC problem responses.
facts:
  legacy_body: "All request conversion and application validation failures use api:problem-response\
    \ values and safe RFC problem responses.\n\n```yaml\nconversion_errors:\n  producer:\
    \ generated api:request-binding binder\nbusiness_validation:\n  representation:\
    \ problem details with field failures\n  collect: all independently detectable\
    \ field failures before returning\napplication_errors:\n  constructors:\n    -\
    \ pw.BadRequest\n    - pw.Unauthorized\n    - pw.Forbidden\n    - pw.NotFound\n\
    \    - pw.Conflict\n    - pw.PayloadTooLarge\n    - pw.TooManyRequests\n    -\
    \ pw.RateLimited\n    - pw.InternalServerError\n    - pw.Validation\nresponse:\n\
    \  writer: api:problem-response WriteProblem\n  media_type: application/problem+json\n\
    \  field_shape:\n    - field\n    - location\n    - message\nsecurity:\n  - hide\
    \ internal causes for 5xx responses\n  - use stable machine-readable problem codes\n\
    \  - HTML negotiation uses the generated 400, 401, 403, 404, 409, 413, 429, and\
    \ 500 templates when possible\n```"
  conversion_errors:
    producer: generated api:request-binding binder
  business_validation:
    representation: problem details with field failures
    collect: all independently detectable field failures before returning
  application_errors:
    constructors:
    - pw.BadRequest
    - pw.Unauthorized
    - pw.Forbidden
    - pw.NotFound
    - pw.Conflict
    - pw.PayloadTooLarge
    - pw.TooManyRequests
    - pw.RateLimited
    - pw.InternalServerError
    - pw.Validation
  response:
    writer: api:problem-response WriteProblem
    media_type: application/problem+json
    field_shape:
    - field
    - location
    - message
  security:
  - hide internal causes for 5xx responses
  - use stable machine-readable problem codes
  - HTML negotiation uses the generated 400, 401, 403, 404, 409, 413, 429, and 500
    templates when possible
relations:
- relation: mentions
  to: api:problem-response
  resolution: resolved
- relation: mentions
  to: api:request-binding
  resolution: resolved

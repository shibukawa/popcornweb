id: policy:package-compatibility
type: policy
title: Package Compatibility
summary: A concept:component-package's committed artifacts were emitted by one generator
  version and must link against whichever runtime the consumer resolved, so the framework
  states what pair is supported rather than hoping the pair agrees.
facts:
  legacy_body: "A concept:component-package's committed artifacts were emitted by\
    \ one generator version and must link against whichever runtime the consumer resolved,\
    \ so the framework states what pair is supported rather than hoping the pair agrees.\n\
    \n```yaml\nproblem:\n  - decision:committed-package-artifacts freezes generated\
    \ Go at publish time, while go.mod resolution picks the runtime at build time\n\
    \  - a package built against system:tinybind v0.2.10 links into an application\
    \ that resolved v0.3.1, because Go picks the higher of the two\n  - the generated\
    \ code is the one caller that touches the runtime's unstable surface, and nothing\
    \ today says which pairs work\ndeclared:\n  where: data:component-package-manifest\
    \ generated_with\n  values: the Popcorn Web version and the system:tinybind version\
    \ behind it\n  authority: it records what produced the artifacts; it does not\
    \ constrain what the consumer resolves, because go.mod already owns that\nrules:\n\
    \  - a package depends on Popcorn Web through go.mod like any consumer, so the\
    \ module graph and not this policy performs the resolution\n  - the framework\
    \ states a supported window of generator versions per release, and api:cli-doctor\
    \ reports a package outside it\n  - a package generated by a newer Popcorn Web\
    \ than the consumer's is reported, because the artifact may call a runtime entry\
    \ that does not exist yet, which is a compile error the report names in advance\n\
    \  - a package generated by an older one is accepted inside the window and reported\
    \ outside it\n  - the window is a Popcorn Web statement, and the system:tinybind\
    \ version is recorded as evidence rather than checked independently\n  - a version\
    \ mismatch is never repaired by regenerating the dependency, per decision:committed-package-artifacts\n\
    upstream_dependency:\n  what: system:tinybind states no compatibility contract\
    \ for generated code against a different runtime version\n  consequence: the window\
    \ above is this framework's judgment over an unstated guarantee, so a minor upstream\
    \ release can invalidate it silently\n  asked_for: requirement:generated-code-version-tolerance\n\
    tinygo:\n  - a package claiming TinyGo support meets rule:tinygo-runtime-compatibility\
    \ and the policy:contrib-compatibility matrix, on the same terms vision:contrib\
    \ packages do\n  - a package that does not claim it is a host-Go package, and\
    \ an application building for TinyGo learns that from the failure rather than\
    \ from a manifest key, because a claim nobody verifies is worse than none\ndatabase:\n\
    \  - a package's supported engines come from data:component-package-manifest requires.engines,\
    \ checked when api:cli-generate reads the declaration and again before requirement:package-schema-contribution\
    \ applies its stream\n  - a package ships no .pw.sql for the first shape, per\
    \ the requirement:component-package-distribution non-goal, so no generated query\
    \ carries a dialect into a consumer\nverification:\n  package_side: the requirement:contrib-acceptance\
    \ common gates apply to a published package on the same reading, because a package\
    \ is a contrib package that happens to live elsewhere\n  project_side: api:cli-doctor\
    \ reports every linked package, its declared versions, and whether its migrations\
    \ and configuration section arrived\n```"
  problem:
  - decision:committed-package-artifacts freezes generated Go at publish time, while
    go.mod resolution picks the runtime at build time
  - a package built against system:tinybind v0.2.10 links into an application that
    resolved v0.3.1, because Go picks the higher of the two
  - the generated code is the one caller that touches the runtime's unstable surface,
    and nothing today says which pairs work
  declared:
    where: data:component-package-manifest generated_with
    values: the Popcorn Web version and the system:tinybind version behind it
    authority: it records what produced the artifacts; it does not constrain what
      the consumer resolves, because go.mod already owns that
  rules:
  - a package depends on Popcorn Web through go.mod like any consumer, so the module
    graph and not this policy performs the resolution
  - the framework states a supported window of generator versions per release, and
    api:cli-doctor reports a package outside it
  - a package generated by a newer Popcorn Web than the consumer's is reported, because
    the artifact may call a runtime entry that does not exist yet, which is a compile
    error the report names in advance
  - a package generated by an older one is accepted inside the window and reported
    outside it
  - the window is a Popcorn Web statement, and the system:tinybind version is recorded
    as evidence rather than checked independently
  - a version mismatch is never repaired by regenerating the dependency, per decision:committed-package-artifacts
  upstream_dependency:
    what: system:tinybind states no compatibility contract for generated code against
      a different runtime version
    consequence: the window above is this framework's judgment over an unstated guarantee,
      so a minor upstream release can invalidate it silently
    asked_for: requirement:generated-code-version-tolerance
  tinygo:
  - a package claiming TinyGo support meets rule:tinygo-runtime-compatibility and
    the policy:contrib-compatibility matrix, on the same terms vision:contrib packages
    do
  - a package that does not claim it is a host-Go package, and an application building
    for TinyGo learns that from the failure rather than from a manifest key, because
    a claim nobody verifies is worse than none
  database:
  - a package's supported engines come from data:component-package-manifest requires.engines,
    checked when api:cli-generate reads the declaration and again before requirement:package-schema-contribution
    applies its stream
  - a package ships no .pw.sql for the first shape, per the requirement:component-package-distribution
    non-goal, so no generated query carries a dialect into a consumer
  verification:
    package_side: the requirement:contrib-acceptance common gates apply to a published
      package on the same reading, because a package is a contrib package that happens
      to live elsewhere
    project_side: api:cli-doctor reports every linked package, its declared versions,
      and whether its migrations and configuration section arrived

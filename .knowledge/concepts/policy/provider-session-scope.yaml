id: policy:provider-session-scope
type: policy
title: Provider Session Scope of Logout
summary: Ending the local session and ending the provider session are separate acts,
  and only the second one signs the user out of every other application sharing that
  provider.
facts:
  legacy_body: "Ending the local session and ending the provider session are separate\
    \ acts, and only the second one signs the user out of every other application\
    \ sharing that provider.\n\n```yaml\nquestion: what a logout should do to the\
    \ session the identity provider holds, which is not the session this application\
    \ owns\nnaming:\n  local_vocabulary: reconfirm and global, and the rejected local\
    \ below, are names for deployment behavior in this catalog, and no specification\
    \ defines them\n  standardized: only the prompt and max_age parameters of an authorization\
    \ request, and the RP-initiated logout request\n  absent_from_every_specification:\
    \ logging out of one relying party at the provider while leaving the provider\
    \ session alive for the others; the provider session is one shared session and\
    \ nothing can scope its end to one client\n  consequence: reconfirm exists because\
    \ that request cannot be made, so it asks the provider for nothing and changes\
    \ the authorization requests that follow instead\nmodes:\n  reconfirm:\n    action:\
    \ revoke the framework session, send the provider nothing at all, and mark authorization\
    \ requests to carry prompt until a sign-in completes\n    request_at_logout: none;\
    \ this mode is the absence of a logout request plus one parameter on each ordinary\
    \ authorization request that follows, until a sign-in completes\n    prompt: select_account\
    \ and login, per the prompt_values of policy:reauthentication\n    provider_session:\
    \ untouched, so every other relying party is unaffected\n    next_login: the provider\
    \ shows who it knows and still demands proof, which is the behavior local logout\
    \ fails to produce\n    fits: the ordinary case for an application sharing a consumer\
    \ or organizational provider\n    intent_storage: a short-lived cookie set by\
    \ logout and read by the login endpoint, which does not spend it, and expired\
    \ by the callback that completes a sign-in\n    intent_integrity: none required,\
    \ because prompt can only add interaction; a forged intent costs the user a redundant\
    \ confirmation and grants nothing\n    consumption:\n      spent_by: the callback\
    \ that completes a sign-in, which expires the cookie whether or not one was pending,\
    \ and by nothing that only begins an authorization\n      why: a request that\
    \ begins an authorization and never finishes one has re-proved nobody, and the\
    \ login path is reachable by anything that fetches URLs, such as a second tab,\
    \ a prefetch, or a browser following a redirect for an icon, so a mark spent by\
    \ the first request to read it was used up before the person's own click\n   \
    \   ceiling: one hour from the logout, so an abandoned sign-in cannot turn the\
    \ intent into a lasting setting\n      expiry_site: the callback, because the\
    \ cookie is scoped to the login path and the callback request does not carry it,\
    \ so the expiry is sent without looking for the cookie\n      kept_when: a callback\
    \ that fails or is refused leaves the mark, since nothing was proved\n      other_sign_ins:\
    \ a passkey sign-in under oidc_passkey does not pass through the callback and\
    \ leaves the mark to the ceiling, which costs one redundant confirmation and nothing\
    \ else\n      before_2026_10_21: the login endpoint expired the mark as it read\
    \ it, so any request to the login path spent it; Safari fetches /favicon.ico and\
    \ /apple-touch-icon*.png unprompted, a guard that redirected every unauthenticated\
    \ request sent those fetches to the login with the mark's cookie, and the next\
    \ real login was answered silently from the provider session, as if the sign-out\
    \ had not worked; policy:authenticated-path-protection no longer redirects a request\
    \ that asks for no page\n  global:\n    availability: the OIDC modes only; flow:oauth-provider-login\
    \ has no end session endpoint to send the request to\n    action: RP-initiated\
    \ logout against the discovered end_session_endpoint of requirement:contrib-oidc\n\
    \    effect: ends the provider session, and the provider notifies every other\
    \ relying party through its registered logout mechanisms\n    fits: a deployment\
    \ that defines sign-out as leaving everything, and every deployment under policy:shared-device-mode,\
    \ which fixes this mode\n    confirmation: the provider decides whether to ask\
    \ the end user, and must ask when no id_token_hint was sent\nshared_primitive:\n\
    \  fact: reconfirm logout and the step-up of flow:step-up-reauthentication both\
    \ want an authorization request the provider may not satisfy silently\n  difference:\
    \ step-up keeps the local session and resumes an operation, while reconfirm logout\
    \ destroys it and lands on the login page\n  implementation: one reconfirmation\
    \ intent carried into the next requirement:contrib-oidc authorization request,\
    \ not two mechanisms\nselection:\n  field: auth.oidc.logout_scope, one of reconfirm\
    \ or global\n  default: reconfirm\n  shape: a configbind enum tag, which validates\
    \ the chosen value whatever source set it and which requires the default to be\
    \ a listed value\nrejected_mode:\n  name: local, meaning revoke the framework\
    \ session and leave the provider session alone\n  behavior: the next login is\
    \ silent, so the same user returns without interaction and the sign-out appears\
    \ not to have worked\n  fits: nothing; it is the failure mode that made ending\
    \ the provider session look like the only alternative\n  status: not offered,\
    \ because reconfirm supplies everything local was reached for and nothing was\
    \ reached for local itself\nremoved_setting:\n  was: auth.oidc.provider_logout,\
    \ a bool defaulting to true, read at plugin/auth/endpoints.go\n  equivalence:\
    \ true was global, and false was the rejected local mode\n  cost_one: signing\
    \ out of one application signed the user out of every application sharing the\
    \ provider, which is rarely what the user asked for\n  cost_two: api:authentication-endpoints\
    \ sends no id_token_hint because the session payload holds no token body, so the\
    \ provider is required to show a confirmation screen on every logout\n  original_reason:\
    \ local logout left the provider signed in and made the next login silent, which\
    \ is true and which reconfirm fixes without ending the provider session\nremoval:\n\
    \  status: implemented\n  compatibility: none is owed before 1.0, so provider_logout\
    \ is deleted rather than mapped\n  hazard: configbind treats a key owned by no\
    \ definition as an ordinary unknown overlay key and ignores it, so a deleted field\
    \ goes silently dead rather than failing\n  aggravation: api:cli-init wrote provider_logout\
    \ into every scaffolded configuration, so the stray key is present in every existing\
    \ project rather than rare\n  consequence_if_ignored: a deployment that wrote\
    \ provider_logout true would run reconfirm while its configuration still reads\
    \ as global, which is the silently-ignored-security-setting case the data:authentication-runtime-config\
    \ mode_validation principle exists to prevent\n  mechanism:\n    approach: the\
    \ field survives with its default inverted to false, which makes presence detectable\
    \ without a raw-key lookup the plugin does not have\n    untouched_project: binds\
    \ false and starts\n    stale_true: refused at startup with logout_scope and the\
    \ value to use named\n    stale_false: accepted, because false meant the rejected\
    \ local scope whose nearest surviving behavior is the new default\n    rejected_alternative:\
    \ a pointer field, which configbind has no kind for, and a raw overlay lookup,\
    \ which would need new framework surface for one transitional check\n  lifetime:\
    \ a transitional check, removable once no configuration in the wild carries the\
    \ key\n  scaffold: api:cli-init writes logout_scope and no longer writes provider_logout\n\
    per_request:\n  field: auth.oidc.allow_global_logout_request, bool, default false\n\
    \  purpose: one deployment offering both a sign-out button and a sign-out-everywhere\
    \ button, which is a user choice rather than a deployment choice\n  direction:\
    \ a request may only escalate toward global and may never downgrade\n  reason:\
    \ escalation costs the user extra sign-outs and nothing else, while a forced downgrade\
    \ would leave the provider session alive after the user asked to leave it\n  transport:\
    \ a field on the existing same-origin POST logout, so it inherits the method and\
    \ origin checks api:authentication-endpoints already applies\nrules:\n  - a logout\
    \ revokes the local session first and unconditionally, whatever the selected mode\
    \ does afterward\n  - a provider that advertises no end_session_endpoint degrades\
    \ global to reconfirm, never to a silent logout that leaves the next login unchallenged\n\
    \  - a typed logout_scope or allow_global_logout_request is refused under every\
    \ mode that reaches no provider session — passkey_only, which has none, and oauth_only,\
    \ whose provider offers no way to end the one it holds — per the mode_validation\
    \ principle of data:authentication-runtime-config\n  - the default is not refused\
    \ there, because every mode binds it; only a value somebody typed is, which is\
    \ what makes the refusal legible\n  - the reconfirmation intent survives until\
    \ a sign-in completes or an hour passes, whichever is first, and never becomes\
    \ a permanent setting; beginning an authorization does not end it\n  - a mode\
    \ is a deployment choice, and an application handler never selects one\n  - audit\
    \ the selected mode with the logout event, without tokens or cookie values\nstandards:\n\
    \  authorization_request: https://openid.net/specs/openid-connect-core-1_0.html\n\
    \  authorization_request_note: section 3.1.2.1 defines prompt and max_age, which\
    \ are the whole of reconfirm mode\n  rp_initiated_logout: https://openid.net/specs/openid-connect-rpinitiated-1_0.html\n\
    \  rp_initiated_logout_note: the whole of global mode\nunusable_neighbors:\n \
    \ session_management: check_session_iframe reads provider cookies from a cross-site\
    \ iframe, which third-party cookie blocking prevents, so the specification no\
    \ longer works in practice\n  front_channel_logout: the same cross-site iframe\
    \ pattern, and equally unusable\n  back_channel_logout: server to server, so it\
    \ still works and remains the way a provider tells this application to end a session\n\
    \  consequence: the working toolbox is the authorization-request parameters, RP-initiated\
    \ logout, and back-channel logout, and nothing else\n```"
  question: what a logout should do to the session the identity provider holds, which
    is not the session this application owns
  naming:
    local_vocabulary: reconfirm and global, and the rejected local below, are names
      for deployment behavior in this catalog, and no specification defines them
    standardized: only the prompt and max_age parameters of an authorization request,
      and the RP-initiated logout request
    absent_from_every_specification: logging out of one relying party at the provider
      while leaving the provider session alive for the others; the provider session
      is one shared session and nothing can scope its end to one client
    consequence: reconfirm exists because that request cannot be made, so it asks
      the provider for nothing and changes the authorization requests that follow
      instead
  modes:
    reconfirm:
      action: revoke the framework session, send the provider nothing at all, and
        mark authorization requests to carry prompt until a sign-in completes
      request_at_logout: none; this mode is the absence of a logout request plus one
        parameter on each ordinary authorization request that follows, until a sign-in
        completes
      prompt: select_account and login, per the prompt_values of policy:reauthentication
      provider_session: untouched, so every other relying party is unaffected
      next_login: the provider shows who it knows and still demands proof, which is
        the behavior local logout fails to produce
      fits: the ordinary case for an application sharing a consumer or organizational
        provider
      intent_storage: a short-lived cookie set by logout and read by the login endpoint,
        which does not spend it, and expired by the callback that completes a sign-in
      intent_integrity: none required, because prompt can only add interaction; a
        forged intent costs the user a redundant confirmation and grants nothing
      consumption:
        spent_by: the callback that completes a sign-in, which expires the cookie
          whether or not one was pending, and by nothing that only begins an authorization
        why: a request that begins an authorization and never finishes one has re-proved
          nobody, and the login path is reachable by anything that fetches URLs, such
          as a second tab, a prefetch, or a browser following a redirect for an icon,
          so a mark spent by the first request to read it was used up before the person's
          own click
        ceiling: one hour from the logout, so an abandoned sign-in cannot turn the
          intent into a lasting setting
        expiry_site: the callback, because the cookie is scoped to the login path
          and the callback request does not carry it, so the expiry is sent without
          looking for the cookie
        kept_when: a callback that fails or is refused leaves the mark, since nothing
          was proved
        other_sign_ins: a passkey sign-in under oidc_passkey does not pass through
          the callback and leaves the mark to the ceiling, which costs one redundant
          confirmation and nothing else
        before_2026_10_21: the login endpoint expired the mark as it read it, so any
          request to the login path spent it; Safari fetches /favicon.ico and /apple-touch-icon*.png
          unprompted, a guard that redirected every unauthenticated request sent those
          fetches to the login with the mark's cookie, and the next real login was
          answered silently from the provider session, as if the sign-out had not
          worked; policy:authenticated-path-protection no longer redirects a request
          that asks for no page
    global:
      availability: the OIDC modes only; flow:oauth-provider-login has no end session
        endpoint to send the request to
      action: RP-initiated logout against the discovered end_session_endpoint of requirement:contrib-oidc
      effect: ends the provider session, and the provider notifies every other relying
        party through its registered logout mechanisms
      fits: a deployment that defines sign-out as leaving everything, and every deployment
        under policy:shared-device-mode, which fixes this mode
      confirmation: the provider decides whether to ask the end user, and must ask
        when no id_token_hint was sent
  shared_primitive:
    fact: reconfirm logout and the step-up of flow:step-up-reauthentication both want
      an authorization request the provider may not satisfy silently
    difference: step-up keeps the local session and resumes an operation, while reconfirm
      logout destroys it and lands on the login page
    implementation: one reconfirmation intent carried into the next requirement:contrib-oidc
      authorization request, not two mechanisms
  selection:
    field: auth.oidc.logout_scope, one of reconfirm or global
    default: reconfirm
    shape: a configbind enum tag, which validates the chosen value whatever source
      set it and which requires the default to be a listed value
  rejected_mode:
    name: local, meaning revoke the framework session and leave the provider session
      alone
    behavior: the next login is silent, so the same user returns without interaction
      and the sign-out appears not to have worked
    fits: nothing; it is the failure mode that made ending the provider session look
      like the only alternative
    status: not offered, because reconfirm supplies everything local was reached for
      and nothing was reached for local itself
  removed_setting:
    was: auth.oidc.provider_logout, a bool defaulting to true, read at plugin/auth/endpoints.go
    equivalence: true was global, and false was the rejected local mode
    cost_one: signing out of one application signed the user out of every application
      sharing the provider, which is rarely what the user asked for
    cost_two: api:authentication-endpoints sends no id_token_hint because the session
      payload holds no token body, so the provider is required to show a confirmation
      screen on every logout
    original_reason: local logout left the provider signed in and made the next login
      silent, which is true and which reconfirm fixes without ending the provider
      session
  removal:
    status: implemented
    compatibility: none is owed before 1.0, so provider_logout is deleted rather than
      mapped
    hazard: configbind treats a key owned by no definition as an ordinary unknown
      overlay key and ignores it, so a deleted field goes silently dead rather than
      failing
    aggravation: api:cli-init wrote provider_logout into every scaffolded configuration,
      so the stray key is present in every existing project rather than rare
    consequence_if_ignored: a deployment that wrote provider_logout true would run
      reconfirm while its configuration still reads as global, which is the silently-ignored-security-setting
      case the data:authentication-runtime-config mode_validation principle exists
      to prevent
    mechanism:
      approach: the field survives with its default inverted to false, which makes
        presence detectable without a raw-key lookup the plugin does not have
      untouched_project: binds false and starts
      stale_true: refused at startup with logout_scope and the value to use named
      stale_false: accepted, because false meant the rejected local scope whose nearest
        surviving behavior is the new default
      rejected_alternative: a pointer field, which configbind has no kind for, and
        a raw overlay lookup, which would need new framework surface for one transitional
        check
    lifetime: a transitional check, removable once no configuration in the wild carries
      the key
    scaffold: api:cli-init writes logout_scope and no longer writes provider_logout
  per_request:
    field: auth.oidc.allow_global_logout_request, bool, default false
    purpose: one deployment offering both a sign-out button and a sign-out-everywhere
      button, which is a user choice rather than a deployment choice
    direction: a request may only escalate toward global and may never downgrade
    reason: escalation costs the user extra sign-outs and nothing else, while a forced
      downgrade would leave the provider session alive after the user asked to leave
      it
    transport: a field on the existing same-origin POST logout, so it inherits the
      method and origin checks api:authentication-endpoints already applies
  rules:
  - a logout revokes the local session first and unconditionally, whatever the selected
    mode does afterward
  - a provider that advertises no end_session_endpoint degrades global to reconfirm,
    never to a silent logout that leaves the next login unchallenged
  - a typed logout_scope or allow_global_logout_request is refused under every mode
    that reaches no provider session — passkey_only, which has none, and oauth_only,
    whose provider offers no way to end the one it holds — per the mode_validation
    principle of data:authentication-runtime-config
  - the default is not refused there, because every mode binds it; only a value somebody
    typed is, which is what makes the refusal legible
  - the reconfirmation intent survives until a sign-in completes or an hour passes,
    whichever is first, and never becomes a permanent setting; beginning an authorization
    does not end it
  - a mode is a deployment choice, and an application handler never selects one
  - audit the selected mode with the logout event, without tokens or cookie values
  standards:
    authorization_request: https://openid.net/specs/openid-connect-core-1_0.html
    authorization_request_note: section 3.1.2.1 defines prompt and max_age, which
      are the whole of reconfirm mode
    rp_initiated_logout: https://openid.net/specs/openid-connect-rpinitiated-1_0.html
    rp_initiated_logout_note: the whole of global mode
  unusable_neighbors:
    session_management: check_session_iframe reads provider cookies from a cross-site
      iframe, which third-party cookie blocking prevents, so the specification no
      longer works in practice
    front_channel_logout: the same cross-site iframe pattern, and equally unusable
    back_channel_logout: server to server, so it still works and remains the way a
      provider tells this application to end a session
    consequence: the working toolbox is the authorization-request parameters, RP-initiated
      logout, and back-channel logout, and nothing else

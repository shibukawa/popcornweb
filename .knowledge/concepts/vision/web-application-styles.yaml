id: vision:web-application-styles
type: vision
title: Classic and Modern Web Styles
summary: Popcorn Web supports classic handler-based web applications and an opt-in
  server-driven modern UI on one net/http foundation. Modern facilities extend rather
  than replace classic mode.
facts:
  legacy_body: "Popcorn Web supports classic handler-based web applications and an\
    \ opt-in server-driven modern UI on one net/http foundation. Modern facilities\
    \ extend rather than replace classic mode.\n\n```yaml\nprinciples:\n  - standard\
    \ Go and TinyGo targets\n  - generated mapping instead of runtime reflection\n\
    \  - net/http interoperability\n  - server-rendered HTML with a small optional\
    \ browser runtime\n  - incremental adoption without unused modern runtime cost\n\
    layers:\n  - requirement:shared-web-runtime\n  - requirement:classic-web-acceptance\n\
    \  - requirement:discovered-page-routing\n  - requirement:modern-web-acceptance\n\
    routing: decision:dual-router-coexistence, so a project writes registrations,\
    \ derives them from a page tree, or both\ndelivery: decision:web-runtime-delivery-order\n\
    architecture: decision:layered-web-runtime\n```"
  principles:
  - standard Go and TinyGo targets
  - generated mapping instead of runtime reflection
  - net/http interoperability
  - server-rendered HTML with a small optional browser runtime
  - incremental adoption without unused modern runtime cost
  layers:
  - requirement:shared-web-runtime
  - requirement:classic-web-acceptance
  - requirement:discovered-page-routing
  - requirement:modern-web-acceptance
  routing: decision:dual-router-coexistence, so a project writes registrations, derives
    them from a page tree, or both
  delivery: decision:web-runtime-delivery-order
  architecture: decision:layered-web-runtime

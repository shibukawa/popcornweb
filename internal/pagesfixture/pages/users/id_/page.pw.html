package id_

type View { name: string, page: int }

external LoadUser(id: string, page: int?): View

export component Page(id: string, page: int?): html {
  <script component>
  export function setup({ el }) {
    return {
      highlight(event) {
        event.currentTarget.classList.add("hot");
      },
    };
  }
</script>
  <section>
    {val view = LoadUser(id, page)}
    <h1 on-click="highlight">{view.name}</h1>
    <p>page {view.page}</p>
    <button server-action="Rename" data-target="#name">rename</button>
    <form server-action="Retire">
      <input type="text" name="reason"/>
      <button type="submit">retire</button>
    </form>
  </section>
}
